<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shuttle Split</title>
<meta name="theme-color" content="#F5F8F3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone column, editorial page titles, colour-blocked step cards, fixed bottom tab bar */
:root{
  --bg:#F5F8F3; --surface:#FFFFFF; --field:#F3F4F3; --ink:#141414; --muted:#6B6E6C; --line:rgba(20,20,20,.09);
  --accent:#0B7A4E; --accent-ink:#FFFFFF; --pop:#FFD23F; --pop-ink:#1A1A1A; --soft:#E2F2E9;
  --danger:#C62F3B;
  --display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --surface:#191B1D; --field:#232628; --ink:#F2F3F2; --muted:#A3A7A5; --line:rgba(255,255,255,.1); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);transition:background .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}

/* header */
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px 6px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--pop)}
.avatar img{width:100%;height:100%;object-fit:cover}
.brandtxt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.brandtxt b{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pill{margin-left:auto;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* pages */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px;padding-block:8px 24px}
.pagehead{display:flex;flex-direction:column;gap:4px;padding-top:6px}
h1.page{font-family:var(--display);font-weight:500;font-size:46px;line-height:.95;letter-spacing:-.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1.page em{font-style:italic;color:var(--accent);text-transform:none}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;border:1px solid var(--line)}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:14px}
.step-h{display:flex;align-items:center;gap:12px}
.step-h h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.step-h > div{display:flex;flex-direction:column;min-width:0}
.tile{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.count{margin-left:auto;min-width:40px;height:40px;padding:0 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;padding:6px 2px}
.link.danger{color:var(--danger)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.center{justify-content:center}
.chip{border:1.5px solid var(--line);background:var(--field);border-radius:999px;padding:10px 15px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .1s}
.chip:active{transform:scale(.96)}
.chip .ic{width:16px;height:16px;stroke-width:2.6;display:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .ic{display:block}
.chip.sm{padding:7px 12px;font-size:13.5px}
.chip.out{background:transparent;color:var(--muted);text-decoration:line-through;border-style:dashed}
.chip.maybe{background:transparent;border-color:var(--accent);color:var(--accent);border-style:dashed}
fieldset:disabled .chip,fieldset:disabled .round,fieldset:disabled .seg{opacity:.55}

/* date bar */
.datebar{flex-direction:row;align-items:center;padding:8px}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--field);display:grid;place-items:center;flex:none}
.round.big{width:56px;height:56px;background:var(--accent);color:var(--accent-ink)}
.round.big .ic{width:24px;height:24px;stroke-width:2.4}
.datebtn{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:4px;min-width:0}
.datebtn .d1{font-family:var(--display);font-size:26px;font-weight:600;font-style:italic}
.datebtn .d2{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.todaytag{font-size:10px;font-weight:800;letter-spacing:.1em;background:var(--pop);color:var(--pop-ink);padding:2px 7px;border-radius:999px;margin-top:4px}

/* hours */
.hours{display:flex;align-items:center;justify-content:center;gap:22px;padding:4px 0}
.hval{display:flex;flex-direction:column;align-items:center;min-width:96px}
.hval b{font-family:var(--display);font-size:56px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.hval span{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.money{display:flex;align-items:center;background:var(--field);border-radius:14px;border:1.5px solid transparent}
.money:focus-within{border-color:var(--accent)}
.money span{padding:0 2px 0 14px;color:var(--muted);font-weight:700;font-size:18px}
.money .suf{padding:0 14px 0 0;font-size:14px;white-space:nowrap}
.money input{border:0;background:transparent;font-weight:700;font-size:20px;padding:13px 10px 13px 4px;width:100%;min-width:0;font-variant-numeric:tabular-nums;outline:none}
.txt{border:1.5px solid transparent;background:var(--field);border-radius:14px;padding:12px 14px;font-size:16px;width:100%;min-width:0;outline:none}
.txt:focus{border-color:var(--accent)}
.addrow{display:flex;gap:8px}
.addrow .txt{flex:1}
.totline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px dashed var(--line);padding-top:10px;font-weight:600}
.totline b{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.warn{margin:0;font-size:13.5px;background:color-mix(in srgb,var(--pop) 35%,var(--surface));color:var(--ink);padding:10px 12px;border-radius:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:12px 8px;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.reveal{display:flex;flex-direction:column;gap:12px;animation:rise .2s ease}
@keyframes rise{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* buttons */
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;letter-spacing:.01em;text-align:center}
.btn.small{padding:10px 14px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.pop{background:var(--pop);color:var(--pop-ink)}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.wa{background:#1FA855;color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .full{grid-column:1/-1}

/* summary */
.summary{background:var(--accent);color:var(--accent-ink);border:0}
.summary .eyebrow{color:inherit;opacity:.75}
.bigtot{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.bigtot b{font-family:var(--display);font-size:52px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.sumlines{display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.sumlines div{display:flex;align-items:center;gap:10px}
.sumlines small{display:block;opacity:.75;font-size:12.5px}
.sumlines .amt{margin-left:auto;font-weight:800;white-space:nowrap}
.pp{display:grid;grid-template-columns:1fr auto;gap:6px 14px;background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;font-variant-numeric:tabular-nums}
.pp span:nth-child(even){text-align:right;font-weight:800}
.sum-empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 0}
.sum-empty .ic{width:44px;height:44px;stroke-width:1.3}

/* banners */
.notice{display:flex;gap:12px;align-items:center;background:var(--pop);color:var(--pop-ink);border-radius:var(--r);padding:14px}
.notice p{margin:0;font-weight:600;font-size:14px;flex:1}
.notice .btn{background:var(--pop-ink);color:var(--pop);padding:10px 14px}

/* lists */
.daylist{display:flex;flex-direction:column;gap:6px}
.daylist label{display:flex;align-items:center;gap:12px;padding:12px;background:var(--field);border-radius:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.daylist input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.daylist span{flex:1;font-weight:700}
.daylist em{font-style:normal;color:var(--muted);font-size:13px;text-align:right}
.plist{display:flex;flex-direction:column}
.plist > div{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.plist > div:last-child{border-bottom:0}
.ini{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.plist .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14.5px}
th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.tot{font-weight:800;color:var(--accent)}
tfoot td{font-weight:800;border-bottom:0}
.empty{text-align:center;padding:22px 8px;color:var(--muted)}
.preview img{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{border:2px solid transparent;border-radius:14px;padding:6px;background:var(--field);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;min-width:0}
.sw i{width:100%;aspect-ratio:1;border-radius:10px;display:block;max-width:100%}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.groupcard{flex-direction:row;align-items:center;gap:14px}
.gphoto{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;flex:none}
.gphoto img{width:100%;height:100%;object-fit:cover}
.gphoto .ic{width:34px;height:34px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.vote-row{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--field);border-radius:14px}
.vote-row b{font-size:15px}
.res{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-weight:800;font-size:13px;background:var(--soft);color:var(--accent);white-space:nowrap}
.badge.solid{background:var(--accent);color:var(--accent-ink)}
.pollcard{cursor:pointer}
.pollcard b{font-size:17px}
.cta{background:var(--pop);color:var(--pop-ink);border:0}
.cta h2{font-family:var(--display);font-weight:600;font-size:28px;margin:0;line-height:1.05}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabbar button .ic{width:24px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] .ic{stroke-width:2.3}
.tabdot{width:5px;height:5px;border-radius:50%;background:transparent}
.tabbar button[aria-selected="true"] .tabdot{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;width:max-content;max-width:calc(100% - 32px);text-align:center}
.savedot{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<header class="top">
  <div class="wrap">
    <div class="avatar" id="avatar"><svg class="ic"><use href="#i-shuttle"/></svg></div>
    <div class="brandtxt"><span class="eyebrow">Shuttle Split</span><b id="gname">Badminton Family</b></div>
    <button class="pill" id="authbtn" hidden><svg class="ic" style="width:16px;height:16px"><use href="#i-lock"/></svg><span>Sign in</span></button>
  </div>
</header>

<main>
  <div class="wrap view" id="view-day"></div>
  <div class="wrap view" id="view-polls" hidden></div>
  <div class="wrap view" id="view-pay" hidden></div>
  <div class="wrap view" id="view-team" hidden></div>
</main>

<nav class="tabbar" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button role="tab" data-tab="day" aria-selected="true"><svg class="ic"><use href="#i-shuttle"/></svg>Today<i class="tabdot"></i></button>
    <button role="tab" data-tab="polls" aria-selected="false"><svg class="ic"><use href="#i-poll"/></svg>Polls<i class="tabdot"></i></button>
    <button role="tab" data-tab="pay" aria-selected="false"><svg class="ic"><use href="#i-wallet"/></svg>Payouts<i class="tabdot"></i></button>
    <button role="tab" data-tab="team" aria-selected="false"><svg class="ic"><use href="#i-users"/></svg>Team<i class="tabdot"></i></button>
  </div>
</nav>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,st)=>`<svg class="ic"${st?` style="${st}"`:''}><use href="#i-${n}"/></svg>`;
const norm=s=>String(s||'').trim().replace(/\s+/g,' ');
const nkey=s=>norm(s).toLowerCase();
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ymd(new Date());
const shift=(ds,n)=>{const d=new Date(ds+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dlabel=(ds,o)=>new Date(ds+'T00:00').toLocaleDateString('en-IN',o||{weekday:'short',day:'numeric',month:'short'});
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const fmtH=h=>(Math.round(h*100)/100).toString();
const initials=n=>norm(n).split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

/* ---------- themes ---------- */
const SKINS={
  court:{name:'Court',accent:'#0B7A4E',ink:'#FFFFFF',pop:'#FFD23F',popInk:'#1A1A1A',bg:'#F5F8F3'},
  smash:{name:'Smash',accent:'#E0344A',ink:'#FFFFFF',pop:'#1E2A5E',popInk:'#FFFFFF',bg:'#FBF5F4'},
  ocean:{name:'Ocean',accent:'#1F4FD1',ink:'#FFFFFF',pop:'#F6BE2C',popInk:'#1A1A1A',bg:'#F3F6FC'},
  sunset:{name:'Sunset',accent:'#7B3FE4',ink:'#FFFFFF',pop:'#FF8A3D',popInk:'#1A1A1A',bg:'#F8F5FD'},
  mono:{name:'Mono',accent:'#111111',ink:'#FFFFFF',pop:'#111111',popInk:'#FFFFFF',bg:'#FFFFFF'}
};
const darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):{matches:false};
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v*t+B[i]*(1-t)).toString(16).padStart(2,'0')).join('')}
function skinColors(){const k=SKINS[S.skin]?S.skin:'court',s={...SKINS[k]};
  if(darkMQ.matches){if(k==='mono'){s.accent='#F2F2F2';s.ink='#111111';s.pop='#F2F2F2';s.popInk='#111111'}s.bg='#0F1011';s.soft=mix(s.accent,'#191B1D',.22)}
  else s.soft=mix(s.accent,'#FFFFFF',.13);return s}
function applySkin(){const s=skinColors(),r=document.documentElement.style;
  r.setProperty('--accent',s.accent);r.setProperty('--accent-ink',s.ink);r.setProperty('--pop',s.pop);r.setProperty('--pop-ink',s.popInk);r.setProperty('--bg',s.bg);r.setProperty('--soft',s.soft);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=s.bg}
if(darkMQ.addEventListener)darkMQ.addEventListener('change',applySkin);

/* ---------- state ---------- */
const LS='shuttle-split-v1', LSP='shuttle-split-photo';
const S={roster:[],rate:300,courts:1,groupName:'',skin:'court',days:{}};
let photo='', db=null, auth=null, isOrg=false, tab='day', curDate=todayStr();
const canEdit=()=>!db||isOrg;
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&typeof j==='object')Object.assign(S,j);photo=localStorage.getItem(LSP)||''}catch(e){}
  S.days=S.days||{};Object.keys(S.days).forEach(k=>S.days[k]=normDay(S.days[k],k))}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ---------- writes: one at a time per document, debounced ---------- */
const pending={},inflight={},timers={};
const fsDoc=path=>db.doc(path.replace(/^([^/]+)\//,COLLECTION_PREFIX+'$1/'));
const busy=p=>(p in pending)||!!inflight[p];
function queueWrite(path,val){saveLocal();if(!db)return;pending[path]=val;clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),450)}
async function flush(path){
  if(inflight[path]||!(path in pending))return;
  const v=pending[path];delete pending[path];inflight[path]=true;
  try{const ref=fsDoc(path);if(v===null)await ref.delete();else await ref.set(v)}
  catch(e){toast(e&&e.code==='permission-denied'?'Only the organizer can change this. Sign in first.':'Couldn’t save ('+((e&&e.code)||'error')+'). Kept on this phone.')}
  inflight[path]=false;if(path in pending)flush(path);
}
function saveConfig(){queueWrite('config/main',{roster:S.roster,rate:S.rate,courts:1,groupName:S.groupName||'',skin:S.skin||'court'})}

/* ---------- days & money ---------- */
function blankDay(date){return{date,present:[],hours:2,rate:S.rate,courts:1,shuttle:0,shuttleSkip:[],drinksOn:false,drinks:0,drinksSkip:[]}}
function normDay(d,date){
  const x=Object.assign(blankDay(date),d||{});
  x.present=[...(x.present||[])];x.shuttleSkip=[...(x.shuttleSkip||[])];x.drinksSkip=[...(x.drinksSkip||[])];
  x.hours=+x.hours||0;x.rate=+x.rate||0;x.shuttle=+x.shuttle||0;x.drinks=+x.drinks||0;x.drinksOn=!!x.drinksOn;
  if(+x.courts>1)x.hours=r2(x.hours*(+x.courts)); /* older days: fold courts into total hours */
  x.courts=1;return x;
}
const getDay=date=>S.days[date]?normDay(S.days[date],date):blankDay(date);
function calc(d){
  const n=d.present.length, court=(+d.hours||0)*(+d.rate||0);
  const shS=d.present.filter(p=>!d.shuttleSkip.includes(p));
  const drS=d.drinksOn?d.present.filter(p=>!d.drinksSkip.includes(p)):[];
  const shuttle=+d.shuttle||0, drinks=d.drinksOn?(+d.drinks||0):0;
  const cEach=n?Math.ceil(court/n):0, sEach=shS.length&&shuttle?Math.ceil(shuttle/shS.length):0, dEach=drS.length&&drinks?Math.ceil(drinks/drS.length):0;
  const per={};d.present.forEach(p=>{const o={court:cEach,shuttle:shS.includes(p)?sEach:0,drinks:drS.includes(p)?dEach:0};o.total=o.court+o.shuttle+o.drinks;per[p]=o});
  const actual=court+shuttle+drinks, collected=Object.values(per).reduce((a,b)=>a+b.total,0);
  return{n,court,shuttle,drinks,cEach,sEach,dEach,shN:shS.length,drN:drS.length,per,actual,collected,
    cExact:n?court/n:0,sExact:shS.length?shuttle/shS.length:0,dExact:drS.length?drinks/drS.length:0};
}
const playedDays=()=>Object.keys(S.days).filter(k=>S.days[k].present&&S.days[k].present.length).sort().reverse();
function orderNames(arr){const ix=n=>{const i=S.roster.findIndex(r=>nkey(r)===nkey(n));return i<0?999:i};return[...arr].sort((a,b)=>ix(a)-ix(b)||a.localeCompare(b))}

/* ---------- duplicate name check ---------- */
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function nameCheck(n,list){const k=nkey(n);if(!k)return null;list=list||S.roster;
  const ex=list.find(r=>nkey(r)===k);if(ex)return{type:'dup',name:ex};
  const nr=list.find(r=>{const rk=nkey(r);return(k.length>3&&rk.length>3&&lev(rk,k)<=1)||rk.split(' ')[0]===k.split(' ')[0]});
  return nr?{type:'near',name:nr}:null}

/* ---------- UI bits ---------- */
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
function copyText(t,msg){const ok=()=>toast(msg||'Copied. Paste it in your WhatsApp group.');
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Select the text and copy it.')}a.remove()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
const waHref=t=>'https://wa.me/?text='+encodeURIComponent(t);
const signinNotice=what=>db&&!isOrg?`<div class="notice">${ic('lock')}<p>You’re viewing. Sign in as the organizer to ${what}.</p><button class="btn" data-signin>Sign in</button></div>`:'';
function renderHeader(){
  $('#gname').textContent=S.groupName||'Badminton Family';
  $('#avatar').innerHTML=photo?`<img src="${photo}" alt="">`:ic('shuttle');
  const ab=$('#authbtn');ab.hidden=!db;ab.classList.toggle('on',isOrg);
  ab.querySelector('span').textContent=isOrg?'Organizer':'Sign in';
}

/* ================= TODAY ================= */
let dayConfirmClear=false, guestPending='';
function renderDay(){
  const v=$('#view-day'), d=getDay(curDate), isToday=curDate===todayStr();
  v.innerHTML=`
  <div class="pagehead"><span class="eyebrow">Record a play day</span><h1 class="page">Today’s <em>game</em></h1></div>
  ${signinNotice('record days')}
  <div class="card datebar">
    <button class="round" data-act="prev" aria-label="Previous day">${ic('left')}</button>
    <label class="datebtn"><span class="d1">${esc(dlabel(curDate,{weekday:'long'}))}</span><span class="d2">${esc(dlabel(curDate,{day:'numeric',month:'long',year:'numeric'}))}</span>${isToday?'<span class="todaytag">TODAY</span>':''}
      <input type="date" id="date" value="${curDate}" aria-label="Choose date"></label>
    <button class="round" data-act="next" aria-label="Next day">${ic('right')}</button>
  </div>
  <fieldset id="dayfs" ${canEdit()?'':'disabled'}>
    <section class="card">
      <div class="step-h"><span class="tile">${ic('users')}</span><div><span class="eyebrow">Step 1</span><h2>Who played?</h2></div><span class="count" id="pcount">0</span></div>
      <div class="chips" id="att"></div>
      <div class="row"><button type="button" class="link" data-act="all">Select all</button><button type="button" class="link" data-act="none">Clear</button><button type="button" class="link" data-act="frompoll" id="frompoll" hidden>${ic('poll','width:16px;height:16px;vertical-align:-3px')} Fill from poll</button></div>
      <div class="addrow"><input class="txt" id="guest" placeholder="Add a guest or new player" autocomplete="off" enterkeyhint="done"><button type="button" class="btn primary small" data-act="addguest">${ic('plus')}Add</button></div>
      <p class="warn" id="guestwarn" hidden></p>
    </section>
    <section class="card">
      <div class="step-h"><span class="tile">${ic('clock')}</span><div><span class="eyebrow">Step 2</span><h2>Court time</h2></div></div>
      <div class="hours"><button type="button" class="round big" data-act="h-" aria-label="Half an hour less">${ic('minus')}</button><div class="hval"><b id="hval">2</b><span>hours</span></div><button type="button" class="round big" data-act="h+" aria-label="Half an hour more">${ic('plus')}</button></div>
      <div class="chips center" id="hpre"></div>
      <p class="hint" style="text-align:center">Total hours booked across all courts. 2 courts × 2 hrs = 4.</p>
      <div class="field"><label for="rate">Court rate</label><div class="money"><span>₹</span><input id="rate" type="number" inputmode="decimal" min="0" value="${d.rate||''}" placeholder="300"><span class="suf">per hour</span></div></div>
      <div class="totline"><span>Court cost</span><b id="courttot"></b></div>
    </section>
    <section class="card">
      <div class="step-h"><span class="tile">${ic('shuttle')}</span><div><span class="eyebrow">Step 3</span><h2>Shuttles</h2></div></div>
      <div class="field"><label for="shuttle">Shuttle cost for the day</label><div class="money"><span>₹</span><input id="shuttle" type="number" inputmode="decimal" min="0" placeholder="0 if none" value="${d.shuttle||''}"></div></div>
      <div class="reveal" id="shwrap" hidden><span class="lbl">Shared by · tap to leave someone out</span><div class="chips" id="shchips"></div></div>
    </section>
    <section class="card">
      <div class="step-h"><span class="tile">${ic('cup')}</span><div><span class="eyebrow">Step 4</span><h2>Drinks</h2></div></div>
      <div class="seg" role="group" aria-label="Drinks taken?"><button type="button" data-act="drinks-no" id="drno">No drinks</button><button type="button" data-act="drinks-yes" id="dryes">${ic('cup','width:17px;height:17px')}Drinks taken</button></div>
      <div class="reveal" id="drwrap" hidden>
        <div class="field"><label for="drinks">Drinks total</label><div class="money"><span>₹</span><input id="drinks" type="number" inputmode="decimal" min="0" placeholder="Amount" value="${d.drinks||''}"></div></div>
        <span class="lbl">Shared by · tap anyone who didn’t have one</span><div class="chips" id="drchips"></div>
      </div>
    </section>
  </fieldset>
  <section class="card summary" id="sum"></section>
  ${S.days[curDate]&&canEdit()?`<div class="row center">${dayConfirmClear?`<span class="hint">Remove everything recorded for this day?</span><button class="link" data-act="clear-no">Keep</button><button class="btn danger small" data-act="clear-yes">Clear day</button>`:`<button class="link danger" data-act="clear">${ic('trash','width:16px;height:16px;vertical-align:-3px')} Clear this day</button>`}</div>`:''}`;
  refreshDay();
}
function refreshDay(){
  const v=$('#view-day');if(!v.querySelector('#att'))return;
  const d=getDay(curDate), c=calc(d);
  $('#pcount').textContent=d.present.length;
  const extra=d.present.filter(p=>!S.roster.some(r=>nkey(r)===nkey(p)));
  const names=[...S.roster,...extra];
  $('#att').innerHTML=names.length?names.map(p=>`<button type="button" class="chip ${d.present.includes(p)?'on':''}" data-act="toggle" data-v="${esc(p)}" aria-pressed="${d.present.includes(p)}">${ic('check')}${esc(p)}</button>`).join(''):'<p class="hint">No players yet. Add names below or in the Team tab.</p>';
  $('#hval').textContent=fmtH(d.hours);
  $('#hpre').innerHTML=[1,1.5,2,3,4,6].map(h=>`<button type="button" class="chip sm ${d.hours===h?'on':''}" data-act="hset" data-v="${h}">${ic('check')}${fmtH(h)} h</button>`).join('');
  $('#courttot').textContent=fmtH(d.hours)+' h × '+inr(d.rate)+' = '+inr(c.court);
  $('#shwrap').hidden=!(d.shuttle>0&&d.present.length);
  $('#shchips').innerHTML=orderNames(d.present).map(p=>`<button type="button" class="chip sm ${d.shuttleSkip.includes(p)?'out':'on'}" data-act="sh" data-v="${esc(p)}">${ic('check')}${esc(p)}</button>`).join('');
  $('#drno').setAttribute('aria-pressed',String(!d.drinksOn));$('#dryes').setAttribute('aria-pressed',String(d.drinksOn));
  $('#drwrap').hidden=!d.drinksOn;
  $('#drchips').innerHTML=d.present.length?orderNames(d.present).map(p=>`<button type="button" class="chip sm ${d.drinksSkip.includes(p)?'out':'on'}" data-act="dr" data-v="${esc(p)}">${ic('check')}${esc(p)}</button>`).join(''):'<p class="hint">Tick who played in Step 1 first.</p>';
  const fp=$('#frompoll');if(fp)fp.hidden=!(db&&canEdit()&&pollForDate(curDate));
  renderSummary(d,c);
}
function renderSummary(d,c){
  const el=$('#sum');
  if(!c.n){el.innerHTML=`<div class="sum-empty">${ic('shuttle')}<b>Tap who played</b><span style="opacity:.8">Everyone’s share shows up here as you go.</span></div>`;return}
  const amts=[...new Set(Object.values(c.per).map(x=>x.total))];
  el.innerHTML=`
    <span class="eyebrow">${esc(dlabel(curDate,{weekday:'long',day:'numeric',month:'short'}))} · ${c.n} players</span>
    <div class="bigtot"><span style="font-weight:700">${amts.length===1?'Each pays':'To collect'}</span><b>${inr(amts.length===1?amts[0]:c.collected)}</b></div>
    <div class="sumlines">
      <div>${ic('clock')}<span>Court<small>${fmtH(d.hours)} h × ${inr(d.rate)} ÷ ${c.n} = ${inr(r2(c.cExact))}</small></span><span class="amt">${inr(c.cEach)}</span></div>
      ${c.shuttle?`<div>${ic('shuttle')}<span>Shuttles<small>${inr(c.shuttle)} ÷ ${c.shN} = ${inr(r2(c.sExact))}</small></span><span class="amt">${inr(c.sEach)}</span></div>`:''}
      ${c.drinks?`<div>${ic('cup')}<span>Drinks<small>${inr(c.drinks)} ÷ ${c.drN} = ${inr(r2(c.dExact))}</small></span><span class="amt">${inr(c.dEach)}</span></div>`:''}
    </div>
    ${amts.length>1?`<div class="pp">${orderNames(d.present).map(p=>`<span>${esc(p)}</span><span>${inr(c.per[p].total)}</span>`).join('')}</div>`:''}
    <div class="totline" style="border-color:rgba(255,255,255,.3)"><span>Cost ${inr(c.actual)}${c.collected>c.actual?' · rounded up':''}</span><b>${inr(c.collected)}</b></div>
    <button class="btn pop" data-act="topay">${ic('share')}Make payout poster</button>`;
}
function editDay(fn){
  if(!canEdit()){toast('Sign in as the organizer to make changes.');return}
  const d=getDay(curDate);fn(d);S.days[curDate]=d;queueWrite('days/'+curDate,d);
  if(dayConfirmClear){dayConfirmClear=false}
  refreshDay();
}
function addGuest(force){
  const inp=$('#guest'),n=norm(inp.value),w=$('#guestwarn');if(!n)return;
  const chk=nameCheck(n,S.roster);
  if(chk&&chk.type==='dup'){inp.value='';w.hidden=true;editDay(d=>{if(!d.present.includes(chk.name))d.present.push(chk.name)});toast(chk.name+' is already on the team. Marked as played.');return}
  if(chk&&chk.type==='near'&&!force){guestPending=n;w.hidden=false;w.innerHTML=`<span>Looks like <b>${esc(chk.name)}</b>. Same person?</span><button type="button" class="btn ghost small" data-act="guest-same" data-v="${esc(chk.name)}">Yes, ${esc(chk.name)}</button><button type="button" class="btn primary small" data-act="guest-new">No, add ${esc(n)}</button>`;return}
  inp.value='';w.hidden=true;S.roster.push(n);saveConfig();editDay(d=>{d.present.push(n)});toast(n+' added to the team.');
}
function bindDay(){
  const v=$('#view-day');
  v.addEventListener('click',e=>{
    if(e.target.closest('[data-signin]')){signIn();return}
    const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
    const a=b.dataset.act,val=b.dataset.v;
    switch(a){
      case'prev':curDate=shift(curDate,-1);dayConfirmClear=false;renderDay();break;
      case'next':curDate=shift(curDate,1);dayConfirmClear=false;renderDay();break;
      case'toggle':editDay(d=>{d.present=d.present.includes(val)?d.present.filter(x=>x!==val):[...d.present,val]});break;
      case'all':editDay(d=>{d.present=[...new Set([...d.present,...S.roster])]});break;
      case'none':editDay(d=>{d.present=[]});break;
      case'h-':editDay(d=>{d.hours=Math.max(.5,r2(d.hours-.5))});break;
      case'h+':editDay(d=>{d.hours=Math.min(48,r2(d.hours+.5))});break;
      case'hset':editDay(d=>{d.hours=+val});break;
      case'sh':editDay(d=>{d.shuttleSkip=d.shuttleSkip.includes(val)?d.shuttleSkip.filter(x=>x!==val):[...d.shuttleSkip,val]});break;
      case'dr':editDay(d=>{d.drinksSkip=d.drinksSkip.includes(val)?d.drinksSkip.filter(x=>x!==val):[...d.drinksSkip,val]});break;
      case'drinks-yes':editDay(d=>{d.drinksOn=true});setTimeout(()=>{const i=$('#drinks');if(i&&!i.value)i.focus()},60);break;
      case'drinks-no':editDay(d=>{d.drinksOn=false});break;
      case'addguest':addGuest(false);break;
      case'guest-new':$('#guest').value=guestPending;addGuest(true);break;
      case'guest-same':$('#guest').value='';$('#guestwarn').hidden=true;editDay(d=>{if(!d.present.includes(val))d.present.push(val)});break;
      case'frompoll':fillFromPoll(curDate);break;
      case'clear':dayConfirmClear=true;renderDay();break;
      case'clear-no':dayConfirmClear=false;renderDay();break;
      case'clear-yes':delete S.days[curDate];queueWrite('days/'+curDate,null);dayConfirmClear=false;renderDay();toast('Day cleared.');break;
      case'topay':pay.range='day';pay.day=curDate;pay.off.clear();go('pay');break;
    }
  });
  v.addEventListener('input',e=>{
    const id=e.target.id,val=Math.max(0,+e.target.value||0);
    if(id==='rate')editDay(d=>{d.rate=val});
    else if(id==='shuttle')editDay(d=>{d.shuttle=val});
    else if(id==='drinks')editDay(d=>{d.drinks=val});
    else if(id==='guest')$('#guestwarn').hidden=true;
  });
  v.addEventListener('change',e=>{if(e.target.id==='date'&&e.target.value){curDate=e.target.value;dayConfirmClear=false;renderDay()}});
  v.addEventListener('keydown',e=>{if(e.target.id==='guest'&&e.key==='Enter'){e.preventDefault();addGuest(false)}});
}

/* ================= PAYOUTS ================= */
const pay={range:'last',from:shift(todayStr(),-6),to:todayStr(),day:null,off:new Set()};
const RANGES=[['last','Latest'],['week','This week'],['lastweek','Last week'],['month','This month'],['lastmonth','Last month'],['custom','Pick dates']];
function rangeOf(k){
  const t=todayStr(),d=new Date(t+'T00:00'),dow=(d.getDay()+6)%7;
  switch(k){
    case'day':return[pay.day,pay.day];
    case'week':return[shift(t,-dow),shift(t,6-dow)];
    case'lastweek':return[shift(t,-dow-7),shift(t,-dow-1)];
    case'month':return[t.slice(0,8)+'01',t];
    case'lastmonth':return[ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))];
    case'custom':return pay.from<=pay.to?[pay.from,pay.to]:[pay.to,pay.from];
    default:{const ds=playedDays();if(!ds.length)return[t,t];return[shift(ds[0],-2),ds[0]]}
  }
}
function report(sel){
  const days=[...sel].sort().map(k=>getDay(k)),calcs=days.map(calc);
  const names=orderNames([...new Set(days.flatMap(d=>d.present))]);
  const rows=names.map(p=>{const cells=calcs.map(c=>c.per[p]?c.per[p].total:null);return{p,cells,total:cells.reduce((a,b)=>a+(b||0),0)}});
  return{days,calcs,rows,total:rows.reduce((a,b)=>a+b.total,0),actual:calcs.reduce((a,c)=>a+c.actual,0),hours:days.reduce((a,d)=>a+d.hours,0)};
}
function renderPay(){
  const v=$('#view-pay'),[from,to]=rangeOf(pay.range);
  const inRange=playedDays().filter(k=>k>=from&&k<=to).reverse();
  const R=report(inRange.filter(k=>!pay.off.has(k)));
  v.innerHTML=`
  <div class="pagehead"><span class="eyebrow">Roll out to the team</span><h1 class="page"><em>Pay</em>outs</h1></div>
  <section class="card">
    <div class="step-h"><span class="tile">${ic('cal')}</span><div><span class="eyebrow">Which days?</span><h2>${esc(dlabel(from,{day:'numeric',month:'short'}))}${from!==to?' – '+esc(dlabel(to,{day:'numeric',month:'short'})):''}</h2></div></div>
    <div class="chips">${RANGES.map(([k,l])=>`<button class="chip sm ${pay.range===k?'on':''}" data-range="${k}">${ic('check')}${l}</button>`).join('')}</div>
    ${pay.range==='custom'?`<div class="btns"><div class="field"><label for="pfrom">From</label><input class="txt" type="date" id="pfrom" value="${pay.from}"></div><div class="field"><label for="pto">To</label><input class="txt" type="date" id="pto" value="${pay.to}"></div></div>`:''}
    ${inRange.length?`<div class="daylist">${inRange.map(k=>{const dd=getDay(k),c=calc(dd);return`<label><input type="checkbox" data-k="${k}" ${pay.off.has(k)?'':'checked'}><span>${esc(dlabel(k))}</span><em>${c.n} players · ${fmtH(dd.hours)} h<br>${inr(c.collected)}</em></label>`}).join('')}</div>`:`<div class="empty">No play days recorded in these dates.<br>Record a day on the Today tab.</div>`}
  </section>
  ${R.rows.length?`
  <section class="card">
    <div class="step-h"><span class="tile">${ic('rupee')}</span><div><span class="eyebrow">${R.days.length} day${R.days.length>1?'s':''} · ${fmtH(R.hours)} court hours</span><h2>Who pays what</h2></div><span class="badge solid" style="margin-left:auto">${inr(R.total)}</span></div>
    <div class="tablewrap"><table><thead><tr><th>Name</th>${R.days.map(d=>`<th>${esc(dlabel(d.date,{weekday:'short',day:'numeric'}))}</th>`).join('')}${R.days.length>1?'<th>Total</th>':''}</tr></thead>
      <tbody>${R.rows.map(r=>`<tr><td>${esc(r.p)}</td>${r.cells.map(x=>`<td>${x===null?'–':inr(x)}</td>`).join('')}${R.days.length>1?`<td class="tot">${inr(r.total)}</td>`:''}</tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td>${R.calcs.map(c=>`<td>${inr(c.collected)}</td>`).join('')}${R.days.length>1?`<td class="tot">${inr(R.total)}</td>`:''}</tr></tfoot></table></div>
  </section>
  <section class="card">
    <div class="step-h"><span class="tile">${ic('share')}</span><div><span class="eyebrow">Send to the group</span><h2>Share</h2></div></div>
    <button class="btn primary" id="shareimg">${ic('share')}Share payout poster</button>
    <div class="btns"><a class="btn wa" id="watext" target="_blank" rel="noopener">${ic('chat')}WhatsApp text</a><button class="btn ghost" id="copytext">${ic('copy')}Copy text</button></div>
    <p class="hint">“Share payout poster” opens your phone’s share sheet. Pick WhatsApp, then your group.</p>
  </section>
  <section class="card preview"><span class="lbl">Poster preview · long-press to save</span><img id="poster" alt="Payout poster"></section>`:''}`;
  v.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{pay.range=b.dataset.range;pay.off.clear();renderPay()});
  v.querySelectorAll('[data-k]').forEach(cb=>cb.onchange=()=>{cb.checked?pay.off.delete(cb.dataset.k):pay.off.add(cb.dataset.k);renderPay()});
  const pf=$('#pfrom'),pt=$('#pto');if(pf){pf.onchange=()=>{pay.from=pf.value||pay.from;renderPay()};pt.onchange=()=>{pay.to=pt.value||pay.to;renderPay()}}
  if(!R.rows.length)return;
  const msg=payText(R);
  $('#watext').href=waHref(msg);
  $('#copytext').onclick=()=>copyText(msg);
  const fname='payouts-'+R.days.map(d=>d.date.slice(5)).join('_')+'.png';
  drawPoster(R).then(url=>{const img=$('#poster');if(img)img.src=url;const sb=$('#shareimg');if(!sb)return;
    sb.onclick=async()=>{try{
      const blob=await(await fetch(url)).blob(),file=new File([blob],fname,{type:'image/png'});

      else{const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();toast('Poster saved. Attach it in WhatsApp.')}
    }catch(e){if(!e||e.name!=='AbortError')toast('Couldn’t share. Long-press the poster to save it.')}}});
}
function payText(R){
  const L=['🏸 *'+(S.groupName||'Badminton')+' — Payouts*',R.days.map(d=>dlabel(d.date)).join(' | '),''];
  R.rows.forEach(r=>L.push('• '+r.p+' – *'+inr(r.total)+'*'));L.push('');
  R.days.forEach((d,i)=>{const c=R.calcs[i];L.push('📅 *'+dlabel(d.date)+'* · '+c.n+' players');
    L.push('   Court: '+fmtH(d.hours)+' h × '+inr(d.rate)+' = '+inr(c.court)+' → '+inr(c.cEach)+' each');
    if(c.shuttle)L.push('   Shuttles: '+inr(c.shuttle)+' ÷ '+c.shN+' → '+inr(c.sEach)+' each');
    if(c.drinks)L.push('   Drinks: '+inr(c.drinks)+' ÷ '+c.drN+' → '+inr(c.dEach)+' each');});
  L.push('');L.push('💰 *Total to collect: '+inr(R.total)+'*');return L.join('\n');
}

    const gr=g.createLinearGradient(0,heroH*.3,0,heroH);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.75)');g.fillStyle=gr;g.fillRect(0,0,W,heroH)}
  else{g.fillStyle=acc;g.fillRect(0,0,W,heroH);g.save();g.globalAlpha=.14;g.strokeStyle=sk.ink;g.lineWidth=3;
    for(let i=-2;i<9;i++){g.beginPath();g.moveTo(i*160,heroH);g.lineTo(i*160+260,0);g.stroke()}g.restore();
    g.fillStyle=sk.pop===acc?sk.ink:sk.pop;g.beginPath();g.arc(W-160,140,46,0,7);g.fill();g.strokeStyle=sk.ink;g.lineWidth=7;g.lineCap='round';g.beginPath();
    [[W-128,108,W-50,30],[W-140,102,W-102,20],[W-120,118,W-32,70]].forEach(a=>{g.moveTo(a[0],a[1]);g.lineTo(a[2],a[3])});g.stroke()}
  g.fillStyle=img?'#FFFFFF':sk.ink;g.textBaseline='alphabetic';g.textAlign='left';

  y+=crow*(cardH+18)+12;

  g.globalAlpha=.8;g.font='600 20px '+U;g.fillText('Cost ₹'+R.actual.toLocaleString('en-IN',{maximumFractionDigits:2})+(R.total>R.actual?' · rounded up per head':''),P+36,y+104);g.globalAlpha=1;
  g.textAlign='right';g.fillStyle=sk.pop===acc?sk.ink:sk.pop;g.font='600 104px '+D;g.fillText('₹'+R.total.toLocaleString('en-IN'),W-P-36,y+124);
  g.textAlign='center';g.fillStyle='#6B6B6B';g.font='italic 500 28px '+D;g.fillText('Same court · Same people · Stronger together',W/2,H-46);

function fit(g,t,x,y,max){let s=String(t);while(g.measureText(s).width>max&&s.length>3)s=s.slice(0,-2)+'…';g.fillText(s,x,y)}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

const pollLink=id=>location.origin+location.pathname+'#poll-'+id;
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'x';
const first=s=>norm(s).split(' ')[0];
function nextWeekend(w){const d=new Date(),sat=shift(todayStr(),((6-d.getDay()+7)%7)+7*w);return[sat,shift(sat,1)]}
function latestByName(arr){const m={};arr.forEach(v=>{if(!v||!v.name)return;const k=nkey(v.name);if(!m[k]||(v.updatedAt||0)>(m[k].updatedAt||0))m[k]=v});return Object.values(m)}
function waOpt(dt){const d=new Date(dt.date+'T00:00');return d.getDate()+'-'+d.toLocaleDateString('en-IN',{month:'short'})+' ('+d.toLocaleDateString('en-IN',{weekday:'long'})+')'+(dt.note?' | '+dt.note:'')}
const isClosed=p=>!!p&&(p.closed||(p.closesAt&&Date.now()>p.closesAt));
function closeText(ms){const d=new Date(ms),ds=todayStr(),dd=ymd(d);const tm=d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}).replace(':00','').toUpperCase();
  return(dd===ds?'today':dd===shift(ds,1)?'tomorrow':d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'}))+' at '+tm}
function tally(poll,votes){
  const voters=latestByName(votes),per=Math.max(1,+poll.perCourt||6);
  const res=(poll.dates||[]).map(dt=>{const yes=[],maybe=[],no=[];voters.forEach(v=>{const a=(v.answers||{})[dt.date];if(a==='yes')yes.push(v.name);else if(a==='maybe')maybe.push(v.name);else if(a==='no')no.push(v.name)});
    return{...dt,yes:orderNames(yes),maybe:orderNames(maybe),no:orderNames(no),courts:yes.length?Math.ceil(yes.length/per):0,courtsMax:(yes.length+maybe.length)?Math.ceil((yes.length+maybe.length)/per):0}});
  const replied=new Set(voters.map(v=>nkey(v.name)));
  return{voters,res,pending:S.roster.filter(n=>!replied.has(nkey(n))),per};
}
function msgPoll(p){return['🏸 *'+p.title+'*','','Please cast your vote 🗳️ so we can book the courts accordingly!','',...p.dates.map(dt=>'• '+waOpt(dt)),'','👉 Vote here: '+pollLink(p.id),...(p.closesAt?['','⏰ Poll closes '+closeText(p.closesAt)+' sharp. No vote = No game! 🙇']:[])].join('\n')}
function msgReminder(p,t){return['⏰ *'+p.title+'*','Still waiting for: '+t.pending.join(', ')+(p.closesAt&&!isClosed(p)?'\nPoll closes '+closeText(p.closesAt)+'. No vote = No game!':''),'','Vote here 👉 '+pollLink(p.id)].join('\n')}
function msgResults(p,t){const L=['📋 *'+p.title+' — results*',''];t.res.forEach(r=>{L.push('*'+waOpt(r)+'*');L.push('✅ '+r.yes.length+(r.yes.length?': '+r.yes.join(', '):''));if(r.maybe.length)L.push('🤔 '+r.maybe.length+': '+r.maybe.join(', '));L.push('🏸 Courts: '+(r.courts||'none')+(r.courtsMax>r.courts?' (up to '+r.courtsMax+' if maybes come)':''));L.push('')});if(t.pending.length)L.push('No vote: '+t.pending.join(', '));return L.join('\n').trim()}
function msgOptions(p){const o=p.dates.map((dt,i)=>(i+1)+'. '+waOpt(dt));if(p.dates.length===2)o.push('3. Both 1&2');o.push((o.length+1)+'. Not available');return['🏸 '+p.title,'',...o].join('\n')}

function startPollsListener(){if(P.listening||!db)return;P.listening=true;
  pollsCol().orderBy('createdAt','desc').limit(30).onSnapshot(q=>{P.list=q.docs.map(d=>({id:d.id,...d.data()}));if(tab==='polls'&&P.mode==='list')renderPolls();if(tab==='day')refreshDay()},()=>{})}
function openPoll(id){if(!db)return;stopPoll();P.mode='detail';P.confirmDel=false;P.sel={id,loading:true};P.votes=[];P.myAns={};
  const ref=pollsCol().doc(id);
  P.unsubPoll=ref.onSnapshot(s=>{P.sel=s.exists?{id,...s.data()}:{id,missing:true};pollRender()},()=>{P.sel={id,missing:true};pollRender()});
  P.unsubVotes=ref.collection('votes').onSnapshot(q=>{P.votes=q.docs.map(d=>d.data());pollRender()},()=>{})}
function stopPoll(){if(P.unsubPoll)P.unsubPoll();if(P.unsubVotes)P.unsubVotes();P.unsubPoll=P.unsubVotes=null}
function pollRender(){if(tab!=='polls')return;const a=document.activeElement;if(a&&a.tagName==='INPUT'&&a.type==='text'&&$('#view-polls').contains(a))return;renderPolls()}
function routeHash(){const m=location.hash.match(/^#poll-([A-Za-z0-9_-]+)$/);if(m){openPoll(m[1]);go('polls')}}
function leavePoll(){stopPoll();P.mode='list';P.sel=null;try{history.replaceState(null,'',location.pathname)}catch(e){}renderPolls()}

  if(P.mode==='new')return renderNewPoll(v);

  v.innerHTML=`
  <div class="pagehead"><span class="eyebrow">Who’s playing?</span><h1 class="page"><em>Polls</em></h1></div>
  <section class="card cta">
    <h2>Ask the group who can play</h2>

    <button class="btn" style="background:var(--pop-ink);color:var(--pop)" data-act="newpoll">${ic(isOrg?'plus':'lock')}${isOrg?'New poll':'Sign in to create a poll'}</button>
  </section>
  ${P.list.length?`<span class="lbl">Recent polls</span>`+P.list.map(p=>`<section class="card pollcard" data-open="${esc(p.id)}" role="button" tabindex="0">
    <div class="step-h"><span class="tile">${ic('poll')}</span><div style="flex:1"><b>${esc(p.title)}</b><span class="hint">${(p.dates||[]).map(dt=>esc(dlabel(dt.date))).join(' · ')}</span></div><span class="badge ${isClosed(p)?'':'solid'}">${isClosed(p)?'Closed':'Open'}</span></div></section>`).join(''):''}`;
  v.querySelector('[data-act=newpoll]').onclick=()=>{if(!isOrg){signIn();return}const[sa,su]=nextWeekend(0);P.draft={title:'Who’s up for Badminton this weekend?',dates:[{date:sa,note:'5-7 PM'},{date:su,note:'9-11 AM'}],perCourt:6,closes:shift(sa,-1)+'T22:00'};P.mode='new';renderPolls();window.scrollTo(0,0)};
  v.querySelectorAll('[data-open]').forEach(el=>{const f=()=>{location.hash='poll-'+el.dataset.open};el.onclick=f;el.onkeydown=e=>{if(e.key==='Enter')f()}});
}

    catch(e){b.disabled=false;b.textContent='Create poll';toast(e.code==='permission-denied'?'Only the organizer can create polls. Sign in first.':'Couldn’t create the poll ('+e.code+').')}};
}
function renderPollDetail(v){

  if(p.missing){v.innerHTML=`<section class="card"><div class="empty">This poll was deleted or the link is wrong.</div><button class="btn ghost" id="back">See all polls</button></section>`;$('#back').onclick=leavePoll;return}
  const t=tally(p,P.votes),closed=isClosed(p);
  const mine=t.voters.find(x=>P.myName&&nkey(x.name)===nkey(P.myName));

  const names=orderNames([...new Set([...S.roster,...t.voters.map(x=>x.name)])]);

  <section class="card ${fresh?'cta':''}">

    <a class="btn wa" href="${waHref(msgPoll(p))}" target="_blank" rel="noopener">${ic('chat')}Send poll on WhatsApp</a>

    <div class="field"><label for="vname">Your name</label>
      <select class="txt" id="vname"><option value="">Choose your name…</option>${names.map(n=>`<option ${nkey(n)===nkey(P.myName)?'selected':''}>${esc(n)}</option>`).join('')}<option value="__other" ${P.myName&&!known?'selected':''}>I’m not on the list…</option></select></div>

  <section class="card">

      <span class="hint">✅ ${r.yes.length} yes · 🤔 ${r.maybe.length} maybe · ❌ ${r.no.length} no${r.courtsMax>r.courts?' · up to '+r.courtsMax+' courts if maybes come':''}</span>

    ${t.pending.length?`<div class="field"><span class="lbl">No vote yet (${t.pending.length})</span><span>${t.pending.map(esc).join(', ')}</span></div>`:'<span class="hint">Everyone on the team has voted. 🎉</span>'}
    <div class="btns">${t.pending.length&&!closed?`<a class="btn ghost" href="${waHref(msgReminder(p,t))}" target="_blank" rel="noopener">${ic('bell')}Remind</a>`:''}<a class="btn wa ${t.pending.length&&!closed?'':'full'}" href="${waHref(msgResults(p,t))}" target="_blank" rel="noopener">${ic('chat')}Post results</a></div>

function orgGrid(p,t){
  const names=orderNames([...new Set([...S.roster,...t.voters.map(x=>x.name)])]);
  const ans=n=>{const m=t.voters.find(x=>nkey(x.name)===nkey(n));return m?(m.answers||{}):{}};
  const out=n=>{const a=ans(n);return p.dates.length&&p.dates.every(dt=>a[dt.date]==='no')};
  return`<section class="card">
    <div class="step-h"><span class="tile">${ic('check')}</span><div><span class="eyebrow">Organizer</span><h2>Record votes</h2></div><span class="savedot" id="gstat"></span></div>
    <p class="hint">For replies in the chat or a WhatsApp poll: tap the names under each option. “Both” voters go under each date.</p>
    ${p.dates.map(dt=>`<div class="vote-row"><b>${esc(waOpt(dt))}</b><div class="chips">${names.map(n=>`<button type="button" class="chip sm ${ans(n)[dt.date]==='yes'?'on':''}" data-g="${esc(n)}|${dt.date}">${ic('check')}${esc(n)}</button>`).join('')}</div></div>`).join('')}
    <div class="vote-row"><b>😭 Not available</b><div class="chips">${names.map(n=>`<button type="button" class="chip sm ${out(n)?'on':''}" data-g="${esc(n)}|__out">${ic('check')}${esc(n)}</button>`).join('')}</div></div>
  </section>`;
}
const gTimers={};
function bindOrgGrid(v,p,t){
  v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.g.lastIndexOf('|'),name=b.dataset.g.slice(0,i),k=b.dataset.g.slice(i+1);
    const prev=t.voters.find(x=>nkey(x.name)===nkey(name)),a={...((prev&&prev.answers)||{})},on=!b.classList.contains('on');
    if(k==='__out')p.dates.forEach(dt=>{if(on)a[dt.date]='no';else if(a[dt.date]==='no')delete a[dt.date]});
    else{if(on){a[k]='yes';p.dates.forEach(dt=>{if(a[dt.date]==='no')delete a[dt.date]})}else delete a[k]}
    const nv={name,answers:a,updatedAt:Date.now()};
    P.votes=[...P.votes.filter(x=>nkey(x.name)!==nkey(name)),nv];renderPolls();
    const st=$('#gstat');if(st)st.textContent='Saving…';
    clearTimeout(gTimers[name]);gTimers[name]=setTimeout(async()=>{try{await pollsCol().doc(p.id).collection('votes').doc('n-'+slug(name)).set(nv);const s=$('#gstat');if(s)s.textContent='✓ Saved'}catch(e){toast('Couldn’t save '+first(name)+'’s vote ('+e.code+').')}},400)});
}
async function saveVote(){
  const p=P.sel;if(!p||!p.id)return;const name=norm(P.myName);
  try{if(!auth.currentUser)await auth.signInAnonymously();const id=auth.currentUser.isAnonymous?auth.currentUser.uid:'n-'+slug(name);
    await pollsCol().doc(p.id).collection('votes').doc(id).set({name,answers:{...P.myAns},updatedAt:Date.now()});
    const s=$('#vstat');if(s)s.textContent='✓ Saved. Thanks, '+first(name)+'!'}
  catch(e){const s=$('#vstat');if(s)s.textContent='';
    toast(e.code==='permission-denied'?(isClosed(p)?'This poll is closed.':'Couldn’t save your vote. Ask the organizer to check the poll rules.'):(e.code==='auth/admin-restricted-operation'||e.code==='auth/operation-not-allowed')?'Voting isn’t switched on yet. Ask the organizer to enable Anonymous sign-in in Firebase.':'Couldn’t save ('+(e.code||'error')+').')}
}
function pollForDate(date){return P.list.find(p=>(p.dates||[]).some(dt=>dt.date===date))}
async function fillFromPoll(date){const p=pollForDate(date);if(!p)return;
  try{const vs=await pollsCol().doc(p.id).collection('votes').get();
    const yes=latestByName(vs.docs.map(d=>d.data())).filter(v=>(v.answers||{})[date]==='yes').map(v=>norm(v.name));
    if(!yes.length)return toast('Nobody voted yes for this date yet.');
    let added=false;const canon=yes.map(n=>{const c=S.roster.find(r=>nkey(r)===nkey(n));if(c)return c;S.roster.push(n);added=true;return n});if(added)saveConfig();
    editDay(d=>{d.present=[...new Set([...d.present,...canon])]});toast('Ticked '+canon.length+' players from the poll. Untick anyone who didn’t come.')}
  catch(e){toast('Couldn’t read the poll ('+e.code+').')}}

/* ================= navigation & boot ================= */
function go(t){tab=t;document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  ['day','polls','pay','team'].forEach(k=>$('#view-'+k).hidden=k!==t);renderTab(true);window.scrollTo(0,0)}
document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='pay'&&tab!=='pay'&&pay.range==='day'){pay.range='last';pay.off.clear()}go(b.dataset.tab)});
function typingIn(id){const a=document.activeElement;return!!a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&$(id).contains(a)&&a.type!=='checkbox'&&a.type!=='file'}
function renderTab(force){
  renderHeader();
  if(tab==='day'){if(force||!typingIn('#view-day'))renderDay();else refreshDay()}
  else if(tab==='polls')pollRender();
  else if(tab==='pay')renderPay();
  else if(tab==='team'){if(force||!typingIn('#view-team'))renderTeam()}
}
async function signIn(){if(!auth)return;const prov=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(prov)}catch(e){
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))auth.signInWithRedirect(prov);
    else if(e.code!=='auth/popup-closed-by-user')toast('Sign-in failed: '+(e.message||e.code))}}
$('#authbtn').onclick=()=>{if(isOrg)go('team');else signIn()};

loadLocal();if(!S.roster.length)S.roster=[...DEFAULT_PLAYERS];
applySkin();bindDay();bindTeam();renderTab(true);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

(function boot(){
  const ok=typeof firebase!=='undefined'&&FIREBASE_CONFIG.apiKey&&!/^PASTE/.test(FIREBASE_CONFIG.apiKey);
  if(!ok)return;
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  auth=firebase.auth();
  let cfgMissing=false,authInit=false;
  auth.getRedirectResult().catch(e=>toast('Sign-in failed: '+(e.message||e.code)));
  auth.onAuthStateChanged(u=>{const was=isOrg;isOrg=!!u&&!u.isAnonymous;
    if(!authInit||was!==isOrg){authInit=true;renderTab(true);if(isOrg&&cfgMissing){cfgMissing=false;saveConfig()}}});
  fsDoc('config/main').onSnapshot(s=>{if(busy('config/main'))return;
    if(!s.exists&&!s.metadata.fromCache){cfgMissing=true;if(isOrg){cfgMissing=false;saveConfig()}}
    if(s.exists){const d=s.data();if(Array.isArray(d.roster))S.roster=[...d.roster];S.rate=+d.rate||300;S.groupName=d.groupName||'';S.skin=SKINS[d.skin]?d.skin:'court';applySkin();saveLocal()}
    renderTab(false)},e=>toast('Couldn’t load shared data ('+e.code+').'));
  fsDoc('config/photo').onSnapshot(s=>{if(busy('config/photo'))return;photo=s.exists?(s.data().data||''):'';try{photo?localStorage.setItem(LSP,photo):localStorage.removeItem(LSP)}catch(e){}renderHeader();if(tab==='team'&&!typingIn('#view-team'))renderTeam()},()=>{});
  db.collection(COLLECTION_PREFIX+'days').onSnapshot(q=>{
    const next={};q.docs.forEach(doc=>next[doc.id]=normDay(doc.data(),doc.id));
    Object.keys(S.days).forEach(k=>{if(busy('days/'+k))next[k]=S.days[k]});
    Object.keys(pending).forEach(p=>{if(p.startsWith('days/')&&pending[p]===null)delete next[p.slice(5)]});
    S.days=next;saveLocal();renderTab(false)},()=>{});
  startPollsListener();routeHash();window.addEventListener('hashchange',routeHash);
})();
})();
</script>
