<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shuttle Split</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app bar → page intro → 3 KPI tiles → stacked cards made of aligned rows → fixed tab bar */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --field:#F2F4F3; --ink:#101828; --muted:#667085; --line:#E4E7EC; --line2:#EEF0F3;
  --accent:#0B7A4E; --accent-ink:#FFFFFF; --soft:#E3F2EA; --pop:#FFD23F; --pop-ink:#1A1A1A;
  --danger:#D92D20; --ok:#079455;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --rs:11px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){:root{
  --surface:#171A1C; --field:#22262A; --ink:#F2F4F7; --muted:#98A2B3; --line:#2B3035; --line2:#24282C; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---- app bar ---- */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar .wrap{display:flex;align-items:center;gap:10px;height:58px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .ic{width:18px;height:18px}
.brand{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.brand b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:12px;color:var(--muted);font-weight:600}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.status .ic{width:15px;height:15px}
.status.org{background:var(--soft);border-color:transparent;color:var(--accent)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---- page ---- */
main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:12px;padding-block:18px 24px}
.intro h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.intro p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:46ch}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.kpi span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hl span{color:inherit;opacity:.8}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.card-h .ico{width:32px;height:32px;border-radius:9px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.card-h .ico .ic{width:18px;height:18px}
.card-h h2{margin:0;font-size:15.5px;font-weight:800;flex:1;min-width:0}
.card-h .meta{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.card-h .meta.strong{color:var(--accent)}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:9px 16px;border-top:1px solid var(--line2)}
.row:first-child{border-top:0}
.row .l{display:flex;flex-direction:column;min-width:0;flex:1}
.row .l b{font-weight:700;font-size:15px}
.row .l small{color:var(--muted);font-size:12.5px;line-height:1.35}
.row .v{font-weight:800;white-space:nowrap}
.sub{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.sublbl{font-size:12px;font-weight:700;color:var(--muted)}
.card-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line2);flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* ---- controls ---- */
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--rs);height:42px;flex:none;background:var(--surface)}
.stp button{width:42px;height:40px;display:grid;place-items:center;color:var(--accent)}
.stp button .ic{width:18px;height:18px;stroke-width:2.4}
.stp output{min-width:62px;text-align:center;font-weight:800;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:40px}
.amt{display:flex;align-items:center;background:var(--field);border:1px solid transparent;border-radius:var(--rs);height:42px;width:132px;flex:none}
.amt:focus-within{border-color:var(--accent);background:var(--surface)}
.amt span{padding-left:12px;color:var(--muted);font-weight:700}
.amt input{border:0;background:transparent;outline:none;width:100%;min-width:0;text-align:right;padding:0 12px 0 4px;font-weight:800;font-size:16px}
.txt{width:100%;min-width:0;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:0 12px;font-size:16px;outline:none}
.txt:focus{border-color:var(--accent)}
select.txt{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.inline{display:flex;gap:8px}
.inline .txt{flex:1}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;margin:0;width:50px;height:30px;border-radius:999px;background:var(--line);cursor:pointer;transition:background .2s}
.switch input:checked{background:var(--accent)}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s;pointer-events:none}
.switch input:checked + i{transform:translateX(20px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 16px;border-radius:12px;font-weight:800;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn.sm{height:38px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.line{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.wa{background:#1FA855;color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .full{grid-column:1/-1}
.lnk{color:var(--accent);font-weight:700;font-size:13.5px;padding:6px 0}
.lnk.danger{color:var(--danger)}

/* player tiles: equal-width grid so everything lines up */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px;min-width:0}
.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ic{width:15px;height:15px;stroke-width:2.8;display:none}
.tile.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.on .ic{display:block}
.tile.out{background:var(--field);color:var(--muted);text-decoration:line-through;border-style:dashed}
.tiles.sm .tile{height:38px;font-size:13px}
fieldset{border:0;margin:0;padding:0;min-width:0;display:contents}
fieldset:disabled .tile,fieldset:disabled .stp,fieldset:disabled .amt,fieldset:disabled .switch{opacity:.55}

/* week strip */
.wk-h{display:flex;align-items:center;gap:8px;padding:12px 12px 4px 16px}
.wk-h b{flex:1;font-size:15px;font-weight:800}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);position:relative;flex:none}
.iconbtn .ic{width:18px;height:18px}
.iconbtn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:8px 12px 12px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:12px}
.day small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day b{font-size:17px;font-weight:800}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.has i{background:var(--accent)}
.day.today b{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel small,.day.sel b{color:inherit}
.day.sel i{background:var(--accent-ink)}

/* notice */
.note{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--pop) 30%,var(--surface));font-size:13.5px;font-weight:600;border:1px solid color-mix(in srgb,var(--pop) 60%,transparent)}
.note .ic{width:18px;height:18px}
.note p{margin:0;flex:1}
.warn{margin:0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--pop) 30%,var(--surface));font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* split / tables */
.split{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line2)}
.prow:first-child{border-top:0}
.ini{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:12px}
.prow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:normal;line-height:1.35}
.prow .am{font-weight:800}
.tot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--soft);font-weight:800}
.tot b{font-size:18px;color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line2)}
th{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:0;background:var(--field)}
th:first-child,td:first-child{text-align:left;padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
td.t{font-weight:800;color:var(--accent)}
tfoot td{font-weight:800;background:var(--soft)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;flex:none}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chk{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
label.row{cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--field);color:var(--muted);white-space:nowrap}
.badge.on{background:var(--soft);color:var(--accent)}
.badge.solid{background:var(--accent);color:var(--accent-ink)}
.badge .ic{width:13px;height:13px}
.chev{color:var(--muted)}
.poster img{display:block;width:100%;border-top:1px solid var(--line2)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty .ic{width:34px;height:34px;display:block;margin:0 auto 8px;stroke-width:1.5}

/* team */
.profile{display:flex;align-items:center;gap:14px;padding:16px}
.gphoto{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;flex:none;position:relative}
.gphoto img{width:100%;height:100%;object-fit:cover}
.gphoto .ic{width:30px;height:30px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:12px 16px 14px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.sw i{width:100%;max-width:56px;aspect-ratio:1;border-radius:14px;display:block;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw[aria-pressed="true"]{color:var(--ink)}
.sw[aria-pressed="true"] i{border-color:var(--ink)}

/* polls */
.vote{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.vote button{height:40px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:13.5px}
.vote button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.nm-chip{height:28px;padding:0 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center}
.nm-chip.maybe{background:transparent;border:1px dashed var(--accent)}
.cta{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cta .pad h2{margin:0;font-size:18px;font-weight:800}
.cta .pad p{margin:0;opacity:.85;font-size:13.5px}
.cta .btn{background:var(--accent-ink);color:var(--accent)}

/* tab bar + toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tabbar button .ic{width:23px;height:23px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] .ic{stroke-width:2.3}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
/* reminders */
.rem{display:flex;flex-direction:column;gap:10px;padding:12px 16px;border-top:1px solid var(--line2)}
.rem:first-of-type{border-top:0}
.rem-h b{display:block;font-size:15px}.rem-h small{color:var(--muted);font-size:12.5px}
.rem details summary{font-size:13px;font-weight:700;color:var(--accent);cursor:pointer}
.msgpre{white-space:pre-wrap;font:13px/1.45 var(--font);background:var(--field);border-radius:10px;padding:10px 12px;margin:8px 0 0}
textarea.tpl{height:auto;min-height:140px;padding:10px 12px;font-size:14px;line-height:1.45;resize:vertical}
.tabbar button{position:relative}
.tabbar button.has-due::after{content:"";position:absolute;top:7px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}
/* suggestions dropdown */
.sugg{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 8px 24px rgba(16,24,40,.12);overflow:hidden;margin-top:6px}
.sugg-h{display:block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:9px 12px 4px}
.sugg-i{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border-top:1px solid var(--line2)}
.sugg-i .ini{width:28px;height:28px;font-size:11px}
.sugg-i small{color:var(--muted);font-size:11.5px;font-weight:600}
.sugg-i.ex{background:color-mix(in srgb,var(--pop) 22%,var(--surface))}
.sugg-f{display:block;font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line2)}
/* team extras */
details.inact{border-top:1px solid var(--line2)}
details.inact summary{padding:12px 16px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.stage{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.stage.s0{background:var(--field);color:var(--muted)}
.stage.s1{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger)}
.stage.s2{background:#FEF0C7;color:#93370D}
.stage.s3{background:var(--soft);color:var(--accent)}
.bar{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;font-size:13px;font-weight:700}
.bar div{height:8px;border-radius:99px;background:var(--field);overflow:hidden}
.bar div i{display:block;height:100%;border-radius:99px}
.bar b{text-align:right;font-size:12.5px;color:var(--muted)}
.danger-card .card-h .ico{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger)}
.ver{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 0}
/* payouts person rows */
.prow2{display:grid;grid-template-columns:32px minmax(0,1fr) auto;column-gap:10px;row-gap:4px;align-items:center;padding:11px 16px;border-top:1px solid var(--line2)}
.prow2:first-child{border-top:0}
.pinfo{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0}
.pinfo b{font-weight:800;font-size:15px;color:var(--accent)}
.pinfo small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pright b{font-size:15px}
.paybtn{height:30px;padding:0 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:12.5px;white-space:nowrap}
.paybtn.red{background:var(--danger);color:#fff}
.pnote{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 10px}
.pnote .flag,.pnote .wait-chip{margin:0}
.note-ok{font-size:11.5px;font-weight:700;color:var(--ok)}
details.poster summary{list-style:none;cursor:pointer}
details.poster summary::-webkit-details-marker{display:none}
details.poster:not([open]) .card-h{border-bottom:0}
/* levels */
.lvl{height:30px;border-radius:999px;border:1px solid var(--lc,var(--line));color:var(--lc,var(--muted));background:color-mix(in srgb,var(--lc,var(--field)) 10%,var(--surface));font-size:12px;font-weight:800;padding:0 10px;appearance:none;-webkit-appearance:none;text-align:center;flex:none;max-width:118px}
.lvl:disabled{opacity:1}
.lvl-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}
.mix{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);font-weight:600}
/* dues flags */

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ymd(new Date());

const dlabel=(ds,o)=>new Date(ds+'T00:00').toLocaleDateString('en-IN',o||{weekday:'short',day:'numeric',month:'short'});
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const fmtH=h=>String(Math.round(h*100)/100);
const initials=n=>norm(n).split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

/* ---------- themes ---------- */
const SKINS={
  court:{name:'Court',accent:'#0B7A4E',ink:'#FFFFFF',pop:'#FFD23F',popInk:'#1A1A1A',bg:'#F3F5F4'},
  smash:{name:'Smash',accent:'#D92D45',ink:'#FFFFFF',pop:'#1E2A5E',popInk:'#FFFFFF',bg:'#F7F4F4'},
  ocean:{name:'Ocean',accent:'#1F4FD1',ink:'#FFFFFF',pop:'#F6BE2C',popInk:'#1A1A1A',bg:'#F3F5F9'},
  sunset:{name:'Sunset',accent:'#7B3FE4',ink:'#FFFFFF',pop:'#FF8A3D',popInk:'#1A1A1A',bg:'#F5F4F9'},

};

function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v*t+B[i]*(1-t)).toString(16).padStart(2,'0')).join('')}

  if(darkMQ.matches){if(k==='mono'){s.accent='#F2F2F2';s.ink='#111111';s.pop='#F2F2F2';s.popInk='#111111'}s.bg='#0E1012';s.soft=mix(s.accent,'#171A1C',.22)}

const GID=(new URLSearchParams(location.search).get('g')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
const BASE=GID?COLLECTION_PREFIX+'groups/'+GID+'/':COLLECTION_PREFIX, SUF=GID?'-'+GID:'';
const HERE=location.origin+location.pathname+(GID?'?g='+GID:'');
const LS='shuttle-split-v1'+SUF, LSP='shuttle-split-photo'+SUF;
const S={roster:[],rate:300,courts:1,groupName:'',skin:'court',upiId:'',upiName:'',levels:{},admins:[],inactive:[],ignored:[],openNames:true,idleWeeks:4,since:{},autoOff:{},billed:[],msg:null,sent:{},days:{}};
let CFG_READY=false, DAYS_READY=false, GROUP=null, GROUP_MISSING=false, SEEN=[], PDATA={votes:[],at:0,loading:false};
let PAYS=[], photo='', db=null, auth=null, isOrg=false, tab='day', curDate=todayStr();
const canEdit=()=>!db||isOrg;
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&typeof j==='object')Object.assign(S,j);photo=localStorage.getItem(LSP)||''}catch(e){}
  S.days=S.days||{};Object.keys(S.days).forEach(k=>S.days[k]=normDay(S.days[k],k))}

/* ---------- writes: one at a time per document, debounced ---------- */
const pending={},inflight={},timers={};
const fsDoc=path=>db.doc(BASE+path);
const col=n=>db.collection(BASE+n);

function queueWrite(path,val){saveLocal();if(!db)return;pending[path]=val;clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),450)}
async function flush(path){
  if(inflight[path]||!(path in pending))return;
  const v=pending[path];delete pending[path];inflight[path]=true;
  try{const ref=fsDoc(path);if(v===null)await ref.delete();else await ref.set(v)}
  catch(e){toast(e&&e.code==='permission-denied'?'Only the organizer can change this. Sign in first.':'Couldn’t save ('+((e&&e.code)||'error')+'). Kept on this phone.')}

/* ---------- days & money ---------- */
function blankDay(date){return{date,present:[],hours:2,rate:S.rate,courts:1,shuttle:0,shuttleSkip:[],drinksOn:false,drinks:0,drinksSkip:[]}}
function normDay(d,date){
  const x=Object.assign(blankDay(date),d||{});

const getDay=date=>S.days[date]?normDay(S.days[date],date):blankDay(date);
function perOf(c,name){const k=nkey(name);const key=Object.keys(c.per).find(x=>nkey(x)===k);return key?c.per[key]:null}

  const n=d.present.length, court=(+d.hours||0)*(+d.rate||0);
  const shS=d.present.filter(p=>!d.shuttleSkip.includes(p));

  const per={};d.present.forEach(p=>{const o={court:cEach,shuttle:shS.includes(p)?sEach:0,drinks:drS.includes(p)?dEach:0};o.total=o.court+o.shuttle+o.drinks;per[p]=o});
  const actual=court+shuttle+drinks, collected=Object.values(per).reduce((a,b)=>a+b.total,0);
  return{n,court,shuttle,drinks,cEach,sEach,dEach,shN:shS.length,drN:drS.length,per,actual,collected};
}
/* ---------- player levels + who is using this phone ---------- */
const LEVELS=[['beginner','Beginner','#12B76A'],['intermediate','Intermediate','#2E90FA'],['advanced','Advanced','#F79009'],['pro','Pro','#7A5AF8']];
const levelOf=n=>LEVELS.find(l=>l[0]===(S.levels||{})[nkey(n)]);

/* ---------- payments ledger: charges from every recorded day minus confirmed payments ---------- */
const allPays=()=>db?PAYS:(S.payments||[]);
function allNames(){return orderNames(uniq([...S.roster,...Object.values(S.days).flatMap(d=>d.present||[]),...allPays().map(p=>p.name)].map(canon)))}
function ledger(name,before){
  const k=nkey(name);let charged=0;const days=[];
  Object.keys(S.days).sort().forEach(ds=>{if(before&&ds>=before)return;const d=getDay(ds);const p=d.present.find(x=>nkey(x)===k);if(!p)return;const amt=calc(d).per[p].total;charged+=amt;days.push({date:ds,amt})});
  let paid=0,claimed=0;const hist=[];
  allPays().forEach(x=>{if(nkey(x.name)!==k)return;if(x.kind==='adjust'){charged+=+x.amount||0}else if(x.status==='confirmed'){paid+=+x.amount||0}else if(x.status==='claimed'){claimed+=+x.amount||0}hist.push(x)});
  const due=Math.max(0,r2(charged-paid));
  let left=paid,since=null;for(const d of days){if(left>=d.amt){left-=d.amt}else{since=d.date;break}}
  hist.sort((a,b)=>(b.at||0)-(a.at||0));
  return{charged,paid,claimed,due,since,hist};
}
/* line items: every game day charge and every payment, oldest first, with running balance.
   Confirmed payments clear the oldest unpaid days first. */
function statement(name){
  const k=nkey(name),rows=[];
  Object.keys(S.days).sort().forEach(ds=>{const d=getDay(ds),o=perOf(calc(d),name);if(!o)return;
    rows.push({type:'game',date:ds,at:new Date(ds+'T12:00').getTime(),court:o.court,shuttle:o.shuttle,drinks:o.drinks,amt:o.total,hours:d.hours})});
  allPays().forEach(x=>{if(nkey(x.name)!==k)return;const base={date:ymd(new Date(x.at||0)),at:x.at||0,amt:+x.amount||0,note:x.note||'',id:x.id};
    rows.push(x.kind==='adjust'?{...base,type:'adj'}:{...base,type:'pay',status:x.status,method:x.method})});
  rows.sort((a,b)=>a.at-b.at);let bal=0;
  rows.forEach(r=>{if(r.type==='game'||r.type==='adj')bal+=r.amt;else if(r.status==='confirmed')bal-=r.amt;r.bal=r2(bal)});
  /* oldest charges are cleared first by payments and credits */
  let pool=rows.filter(r=>(r.type==='pay'&&r.status==='confirmed')).reduce((a,r)=>a+r.amt,0)+rows.filter(r=>r.type==='adj'&&r.amt<0).reduce((a,r)=>a-r.amt,0);
  const unpaid=[];rows.filter(r=>r.type==='game'||(r.type==='adj'&&r.amt>0)).forEach(r=>{const use=Math.min(pool,r.amt);pool-=use;const left=r2(r.amt-use);if(left>0)unpaid.push({...r,left,part:use>0})});
  return{rows,unpaid};
}

function unpaidLine(x){const u=statement(x.name).unpaid;return'• '+x.name+' – *'+inr(x.due)+'*'+(u.length?' ('+u.map(i=>itemLbl(i)+' '+inr(i.left)+(i.part?' bal':'')).join(', ')+')':'')}

function duesList(before){return allNames().map(n=>({name:n,...ledger(n,before)})).filter(x=>x.due>0).sort((a,b)=>b.due-a.due)}

async function addPayment(name,amount,status,method,at,extra){
  const doc={name:canon(name),amount:r2(+amount),at:at||Date.now(),status,method:method||'upi',by:isOrg||!db?'organizer':'player'};
  if(extra&&(isOrg||!db))Object.assign(doc,extra);
  if(!db){S.payments=S.payments||[];S.payments.push({id:'l'+Date.now(),...doc,status:status||'confirmed'});saveLocal();renderTab(false);return true}
  try{if(!isOrg){if(!auth.currentUser)await auth.signInAnonymously();doc.uid=auth.currentUser.uid}
    await payCol().add(doc);return true}
  catch(e){toast(e.code==='permission-denied'?'Couldn’t record the payment. Ask the organizer to update the app rules.':(e.code==='auth/admin-restricted-operation'||e.code==='auth/operation-not-allowed')?'Ask the organizer to enable Anonymous sign-in in Firebase.':'Couldn’t record the payment ('+(e.code||'error')+').');return false}
}

function orderNames(arr){const ix=n=>{const i=S.roster.findIndex(r=>nkey(r)===nkey(n));return i<0?999:i};return[...arr].sort((a,b)=>ix(a)-ix(b)||a.localeCompare(b))}

/* ---------- duplicate name check ---------- */
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
/* PREETAM → Preetam; keeps mixed case like McDonald */
function tcase(n){return norm(n).split(' ').map(w=>(w===w.toUpperCase()||w===w.toLowerCase())?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():w).join(' ')}
/* de-duplicate names ignoring case and extra spaces, keeping the first spelling */
function uniq(arr){const seen=new Set(),out=[];arr.forEach(n=>{n=norm(n);const k=nkey(n);if(k&&!seen.has(k)){seen.add(k);out.push(n)}});return out}
/* the roster's spelling of a name, if it's on the team */
function canon(n){const k=nkey(n);return S.roster.find(r=>nkey(r)===k)||norm(n)}
const activeRoster=()=>S.roster.filter(n=>!(S.inactive||[]).includes(nkey(n)));
/* sound-alike key: Preetam / Pritam / Preetham → prtm */
function skey(n){return nkey(n).replace(/[^a-z]/g,'').replace(/(.)\1+/g,'$1').replace(/th/g,'t').replace(/sh/g,'s').replace(/[aeiouy]/g,'')}
function suggest(q,list){const k=nkey(q);if(k.length<2)return[];const sk=skey(q),k1=k.split(' ')[0];
  return uniq(list).map(n=>{const nk=nkey(n),n1=nk.split(' ')[0];let s=0;
    if(nk===k)s=100;else if(nk.startsWith(k))s=80;else if(nk.split(' ').some(w=>w.startsWith(k)))s=70;else if(k.length>=3&&nk.includes(k))s=60;
    else if(sk.length>=2&&skey(n)===sk)s=55;else if(k1.length>=4&&lev(n1,k1)<=2)s=50;else if(k.length>=3&&skey(n1)===skey(k1)&&skey(k1).length>=2)s=45;
    return{n,s}}).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,5)}
function nameCheck(n,list){const k=nkey(n);if(!k)return null;list=list||S.roster;
  const ex=list.find(r=>nkey(r)===k);if(ex)return{type:'dup',name:ex};
  const nr=suggest(n,list).find(x=>x.s>=45&&x.s<100);
  return nr?{type:'near',name:nr.n}:null}
/* live "did you mean" list under a name box */
function attachSuggest(input,getList,onPick,label){
  if(!input)return;const host=input.closest('.inline')||input;
  let box=host.nextElementSibling;if(!box||!box.classList.contains('sugg')){box=document.createElement('div');box.className='sugg';box.hidden=true;host.after(box)}
  const draw=()=>{const q=input.value,list=suggest(q,getList());
    if(!norm(q)||!list.length){box.hidden=true;box.innerHTML='';return}
    const ex=list.find(x=>x.s===100);
    box.innerHTML=`<span class="sugg-h">${ex?'Already '+(label||'on the team'):'Did you mean?'}</span>`+list.map(x=>`<button type="button" class="sugg-i${x.s===100?' ex':''}" data-n="${esc(x.n)}"><span class="ini">${esc(initials(x.n))}</span><b>${esc(x.n)}</b><small>${x.s===100?'Exact match · tap to use':x.s>=60?'Starts the same':'Sounds similar'}</small></button>`).join('')+(ex?'':`<span class="sugg-f">Not listed? Keep typing and add <b>${esc(tcase(q))}</b> as new.</span>`);
    box.hidden=false};
  input.addEventListener('input',draw);input.addEventListener('focus',draw);
  input.addEventListener('blur',()=>setTimeout(()=>{box.hidden=true},180));
  box.addEventListener('mousedown',e=>e.preventDefault());
  box.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;box.hidden=true;input.value='';onPick(b.dataset.n)});
}

function bindDay(){

      case'nw':setDate(shift(curDate,7));break;

const RANGES=[['last','Latest'],['week','This week'],['lastweek','Last week'],['month','This month'],['lastmonth','Last month'],['custom','Custom']];
function rangeOf(k){
  const t=todayStr(),d=new Date(t+'T00:00'),dow=(d.getDay()+6)%7;
  switch(k){
    case'day':return[pay.day,pay.day];
    case'week':return[shift(t,-dow),shift(t,6-dow)];
    case'lastweek':return[shift(t,-dow-7),shift(t,-dow-1)];
    case'month':return[t.slice(0,8)+'01',t];
    case'lastmonth':return[ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))];
    case'custom':return pay.from<=pay.to?[pay.from,pay.to]:[pay.to,pay.from];
    default:{const ds=playedDays();if(!ds.length)return[t,t];return[shift(ds[0],-2),ds[0]]}
  }
}

async function loadOrgData(force){
  if(!db||!isOrg)return;if(PDATA.loading){if(force)PDATA.again=true;return}if(!force&&Date.now()-PDATA.at<30000)return;
  PDATA.loading=true;
  try{const out=[];for(const pl of P.list){try{const vs=await pollsCol().doc(pl.id).collection('votes').get();vs.docs.forEach(d=>out.push({poll:pl.id,id:d.id,...d.data()}))}catch(e){}}PDATA.votes=out}catch(e){}
  try{const q=await col('seen').get();SEEN=q.docs.map(d=>({uid:d.id,...d.data()}))}catch(e){SEEN=[]}
  PDATA.at=Date.now();PDATA.loading=false;autoInactive();autoBillFromPolls();if(PDATA.again){PDATA.again=false;return loadOrgData(true)}if(tab==='team'&&!typingIn('#view-team'))renderTeam();
}
/* newcomers (names seen in polls, days or payments that aren't on the team) + likely duplicates */
function attention(){
  const rk=new Set(S.roster.map(nkey)),ig=new Set(S.ignored||[]),src={};
  PDATA.votes.forEach(v=>{if(v.name)src[nkey(v.name)]=src[nkey(v.name)]||{n:tcase(v.name),from:'Voted in a poll'}});
  Object.values(S.days).forEach(d=>(d.present||[]).forEach(n=>{src[nkey(n)]=src[nkey(n)]||{n,from:'Recorded on a game day'}}));
  allPays().forEach(x=>{src[nkey(x.name)]=src[nkey(x.name)]||{n:x.name,from:'Has a payment'}});
  const fresh=Object.entries(src).filter(([k])=>!rk.has(k)&&!ig.has(k)).map(([k,v])=>({...v,match:(suggest(v.n,S.roster).find(x=>x.s>=45&&x.s<100)||{}).n}));
  const dups=[];const R=S.roster;
  for(let i=0;i<R.length;i++)for(let j=i+1;j<R.length;j++){const pair=nkey(R[i])+'|'+nkey(R[j]);if(ig.has(pair))continue;
    const sc=(suggest(R[j],[R[i]])[0]||{}).s||0;if(sc>=45&&sc<100)dups.push([R[i],R[j]])}
  return{fresh,dups};
}
/* adoption: has the player opened the app, do they vote and pay through it */
/* last sign of life for a player: opened the app, played, voted or paid */
function lastActivity(n){const k=nkey(n);let t=0;
  SEEN.forEach(x=>{if(nkey(x.name)===k&&x.at>t)t=x.at});
  Object.keys(S.days).forEach(ds=>{const d=S.days[ds];if((d.present||[]).some(x=>nkey(x)===k)){const ms=new Date(ds+'T20:00').getTime();if(ms>t)t=ms}});
  PDATA.votes.forEach(v=>{if(nkey(v.name)===k&&(v.updatedAt||0)>t)t=v.updatedAt});
  allPays().forEach(x=>{if(nkey(x.name)===k&&(x.at||0)>t)t=x.at});return t}
/* players with no activity for N weeks go inactive automatically, and come back the moment they're active again */
function autoInactive(){
  if(!isOrg||!PDATA.at||!CFG_READY||!DAYS_READY)return;const wk=+S.idleWeeks||0;let changed=false,quiet=false;const now=Date.now();
  S.since=S.since||{};S.autoOff=S.autoOff||{};S.inactive=S.inactive||[];
  S.roster.forEach(n=>{const k=nkey(n);if(!S.since[k]){S.since[k]=now;quiet=true}});
  Object.keys(S.autoOff).forEach(k=>{const n=S.roster.find(r=>nkey(r)===k);if(!n){delete S.autoOff[k];changed=true;return}
    if(lastActivity(n)>S.autoOff[k]){delete S.autoOff[k];S.inactive=S.inactive.filter(x=>x!==k);changed=true;toast(first(n)+' is back. Marked active again.')}});
  if(wk>0)S.roster.forEach(n=>{const k=nkey(n);if(S.inactive.includes(k))return;
    const last=Math.max(lastActivity(n),S.since[k]||now);if(now-last>wk*7*864e5){S.inactive.push(k);S.autoOff[k]=now;changed=true}});
  if(changed){saveConfig();if(tab==='team'&&!typingIn('#view-team'))renderTeam()}else if(quiet)saveConfig();
}
function adoption(){
  const seen={};SEEN.forEach(x=>{const k=nkey(x.name);if(!seen[k]||x.at>seen[k])seen[k]=x.at});
  const me=nkey(getMe()),selfV={},orgV={};PDATA.votes.forEach(v=>{const k=nkey(v.name);const own=!String(v.id).startsWith('n-')||v.self||(isOrg&&me&&k===me);if(own)selfV[k]=(selfV[k]||0)+1;else orgV[k]=(orgV[k]||0)+1});
  const appPaid={};allPays().forEach(x=>{if(x.by==='player'||x.method==='self')appPaid[nkey(x.name)]=(appPaid[nkey(x.name)]||0)+1});
  const rows=activeRoster().map(n=>{const k=nkey(n),sv=selfV[k]||0,ov=orgV[k]||0,pp=appPaid[k]||0,on=!!seen[k]||sv>0||pp>0;
    const stage=sv||pp?3:on?2:1;return{n,k,on,last:seen[k]||0,sv,ov,pp,stage,lvl:levelOf(n)}});
  const idle=Object.keys(S.autoOff||{}).map(k=>{const n=S.roster.find(r=>nkey(r)===k);return n?{n,k,since:S.autoOff[k],act:lastActivity(n)}:null}).filter(Boolean);
  const pct=f=>rows.length?Math.round(rows.filter(f).length*100/rows.length):0;
  const byLvl=[...LEVELS.map(l=>[l[1],l[2],rows.filter(r=>r.lvl&&r.lvl[0]===l[0])]),['Not set','#98A2B3',rows.filter(r=>!r.lvl)]].filter(x=>x[2].length);

}

async function renamePlayer(from,to){
  const fk=nkey(from);to=tcase(to);if(!nkey(to))return;
  const target=S.roster.find(r=>nkey(r)===nkey(to)&&nkey(r)!==fk),fin=target||to,merging=!!target;
  if(merging)S.roster=S.roster.filter(r=>nkey(r)!==fk);else{const i=S.roster.findIndex(r=>nkey(r)===fk);if(i>=0)S.roster[i]=fin;else S.roster.push(fin)}
  S.levels=S.levels||{};if(S.levels[fk]&&!S.levels[nkey(fin)])S.levels[nkey(fin)]=S.levels[fk];if(fk!==nkey(fin))delete S.levels[fk];
  S.inactive=(S.inactive||[]).filter(k=>k!==fk);S.ignored=(S.ignored||[]).filter(k=>k!==fk);saveConfig();
  const swap=a=>uniq(a.map(x=>nkey(x)===fk?fin:x));
  Object.keys(S.days).forEach(k=>{const d=getDay(k);if(![...d.present,...d.shuttleSkip,...d.drinksSkip].some(x=>nkey(x)===fk))return;d.present=swap(d.present);d.shuttleSkip=swap(d.shuttleSkip);d.drinksSkip=swap(d.drinksSkip);S.days[k]=d;queueWrite('days/'+k,d)});
  if(db){for(const x of PAYS.filter(x=>nkey(x.name)===fk)){try{await payCol().doc(x.id).update({name:fin})}catch(e){}}
    for(const pl of P.list){try{const vs=await pollsCol().doc(pl.id).collection('votes').get();for(const d of vs.docs){if(nkey(d.data().name)===fk)await d.ref.update({name:fin})}}catch(e){}}}
  else(S.payments||[]).forEach(x=>{if(nkey(x.name)===fk)x.name=fin});
  if(nkey(getMe())===fk)setMe(fin);
  saveLocal();PDATA.at=0;renderTab(true);return{fin,merging};
}

async function resetData(){
  const o=teamUI.reset;if(!o.pays&&!o.days&&!o.polls)return toast('Tick what you want to clear.');
  teamUI.resetBusy=true;renderTeam();let n=0;
  try{
    if(o.pays){if(db){for(const x of [...PAYS]){await payCol().doc(x.id).delete();n++}}else{n+=(S.payments||[]).length;S.payments=[]}}
    if(o.days){const ks=Object.keys(S.days);if(db){const q=await col('days').get();for(const d of q.docs){await d.ref.delete();n++}}else n+=ks.length;S.days={}}
    if(o.polls&&db){for(const pl of [...P.list]){const vs=await pollsCol().doc(pl.id).collection('votes').get();for(const d of vs.docs)await d.ref.delete();await pollsCol().doc(pl.id).delete();n++}}

function shrinkPhoto(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=u})}

const P={list:[],sel:null,votes:[],mode:'list',unsubPoll:null,unsubVotes:null,draft:null,confirmDel:false,myName:'',myAns:{},saveT:null,listening:false,justCreated:null};
P.myName=getMe();
const pollsCol=()=>col('polls');
const pollLink=id=>HERE+'#poll-'+id;
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'x';
const first=s=>norm(s).split(' ')[0];
/* default deadline: the night before the first game, or 2 hours from now if that has passed */
function defClose(first){let c=shift(first,-1)+'T22:00';if(new Date(c).getTime()>Date.now()+3600e3)return c;const d=new Date(Date.now()+2*3600e3);d.setMinutes(0,0,0);const v=ymd(d)+'T'+String(d.getHours()).padStart(2,'0')+':00';return v<=first+'T23:59'?v:''}
function nextWeekend(w){const d=new Date(),sat=shift(todayStr(),((6-d.getDay()+7)%7)+7*w);return[sat,shift(sat,1)]}
function latestByName(arr){const m={};arr.forEach(v=>{if(!v||!v.name)return;const k=nkey(v.name);if(!m[k]||(v.updatedAt||0)>(m[k].updatedAt||0))m[k]=v});return Object.values(m)}
function waOpt(dt){const d=new Date(dt.date+'T00:00');return d.getDate()+'-'+d.toLocaleDateString('en-IN',{month:'short'})+' ('+d.toLocaleDateString('en-IN',{weekday:'long'})+')'+(dt.note?' | '+dt.note:'')}
const isClosed=p=>!!p&&(p.closed||(p.closesAt&&Date.now()>p.closesAt));
function closeText(ms){const d=new Date(ms),ds=todayStr(),dd=ymd(d);const tm=d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}).replace(':00','').toUpperCase();
  return(dd===ds?'today':dd===shift(ds,1)?'tomorrow':d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'}))+' at '+tm}
function tally(poll,votes){
  const voters=latestByName(votes),per=Math.max(1,+poll.perCourt||6);
  const res=(poll.dates||[]).map(dt=>{const yes=[],maybe=[],no=[];voters.forEach(v=>{const a=(v.answers||{})[dt.date];const vn=canon(v.name);if(a==='yes')yes.push(vn);else if(a==='maybe')maybe.push(vn);else if(a==='no')no.push(vn)});
    return{...dt,yes:orderNames(yes),maybe:orderNames(maybe),no:orderNames(no),courts:yes.length?Math.ceil(yes.length/per):0,courtsMax:(yes.length+maybe.length)?Math.ceil((yes.length+maybe.length)/per):0}});
  const replied=new Set(voters.map(v=>nkey(v.name)));
  return{voters,res,pending:activeRoster().filter(n=>!replied.has(nkey(n))),per};
}
function msgPoll(p,k){return fillTpl(tplOf(k||'start'),pollVars(p).v)}
function msgReminder(p,t){return fillTpl(tplOf('remind'),pollVars(p).v)}
function msgReminderOld(p,t){return['⏰ *'+p.title+'*','Still waiting for: '+t.pending.join(', ')+(p.closesAt&&!isClosed(p)?'\nPoll closes '+closeText(p.closesAt)+'. No vote = No game!':''),'','Vote here 👉 '+pollLink(p.id)].join('\n')}
function msgResults(p,t){const L=['📋 *'+p.title+' — results*',''];t.res.forEach(r=>{L.push('*'+waOpt(r)+'*');L.push('✅ '+r.yes.length+(r.yes.length?': '+r.yes.join(', '):''));if(r.maybe.length)L.push('🤔 '+r.maybe.length+': '+r.maybe.join(', '));L.push('🏸 Courts: '+(r.courts||'none')+(r.courtsMax>r.courts?' (up to '+r.courtsMax+' if maybes come)':''));L.push('')});if(t.pending.length)L.push('No vote: '+t.pending.join(', '));return L.join('\n').trim()}
function msgOptions(p){const o=p.dates.map((dt,i)=>(i+1)+'. '+waOpt(dt));if(p.dates.length===2)o.push('3. Both 1&2');o.push((o.length+1)+'. Not available');return['🏸 '+p.title,'',...o].join('\n')}

/* "5-7 PM" → 2, "6:30-8:30" → 2, "11-1" → 2 */
function slotHours(note){const m=String(note||'').match(/(\d{1,2})(?:[:.](\d{2}))?\s*(?:am|pm)?\s*(?:-|–|to)\s*(\d{1,2})(?:[:.](\d{2}))?/i);if(!m)return 0;
  const a=+m[1]+(+m[2]||0)/60,b=+m[3]+(+m[4]||0)/60;let d=(b-a+12)%12;if(d<=0||d>8)return 0;return Math.round(d*2)/2}
const pollLast=p=>(p.dates||[]).reduce((a,dt)=>dt.date>a?dt.date:a,'');
/* polls drop into the archive 2 weeks after their last game date */
const isArchived=p=>!!pollLast(p)&&pollLast(p)<shift(todayStr(),-14);
const RECAP={};
async function recapVotes(p){if(RECAP[p.id]||!db)return;RECAP[p.id]={loading:true,votes:[]};
  try{const vs=await pollsCol().doc(p.id).collection('votes').get();RECAP[p.id]={votes:vs.docs.map(d=>d.data())}}catch(e){RECAP[p.id]={votes:[]}}
  if(tab==='polls')pollRender()}
/* what happened for a poll: who said yes, who actually played, what it cost */
function recapHTML(p,title){
  const votes=(PDATA.votes.some(v=>v.poll===p.id)?PDATA.votes.filter(v=>v.poll===p.id):(RECAP[p.id]||{}).votes)||[];
  if(!RECAP[p.id]&&!PDATA.votes.some(v=>v.poll===p.id))recapVotes(p);
  const t=tally(p,votes);
  return`<section class="card">${cardH('cal',title,esc((p.dates||[]).map(dt=>dlabel(dt.date,{day:'numeric',month:'short'})).join(' · ')))}
    ${t.res.map(r=>{const d=S.days[r.date],c=d&&d.present&&d.present.length?calc(getDay(r.date)):null;
      return`<div class="row"><div class="l"><b>${esc(waOpt(r))}</b><small>${r.yes.length} voted yes${r.maybe.length?' · '+r.maybe.length+' maybe':''}${c?' · '+c.n+' played · '+fmtH(getDay(r.date).hours)+' h':' · not billed yet'}</small></div><span class="v">${c?inr(c.collected):'–'}</span></div>`}).join('')}
    <div class="card-f"><p class="hint">${isClosed(p)?'Voting closed.':'Voting still open.'} ${t.voters.length} of ${activeRoster().length} players voted.</p></div></section>`;
}
/* when voting closes, pre-fill "Who played" with everyone who voted yes, so billing starts from the poll */
/* fill "Who played" from Yes votes: on the game day itself (even if the poll is still open) or once voting closes.
   New Yes votes keep being added until the organizer changes the list by hand. */
async function autoBillFromPolls(){
  if(!isOrg||!CFG_READY||!DAYS_READY||!PDATA.at)return;S.billed=S.billed||[];
  const today=todayStr();let made=[],synced=[],cfgChanged=false;
  const toRoster=name=>{const c=canon(tcase(name)),k=nkey(c);
    if(!S.roster.some(r=>nkey(r)===k)){S.roster.push(c);S.since=S.since||{};S.since[k]=Date.now();cfgChanged=true}
    if((S.inactive||[]).includes(k)){S.inactive=S.inactive.filter(x=>x!==k);if(S.autoOff)delete S.autoOff[k];cfgChanged=true}
    return S.roster.find(r=>nkey(r)===k)||c};
  for(const p of P.list){if(isArchived(p))continue;
    const voters=latestByName(PDATA.votes.filter(v=>v.poll===p.id));
    for(const dt of p.dates||[]){
      if(!(isClosed(p)||dt.date<=today))continue;
      const key=p.id+'|'+dt.date,cur=S.days[dt.date];
      const yesRaw=voters.filter(v=>(v.answers||{})[dt.date]==='yes');
      if(cur&&cur.autoSync&&cur.poll===p.id){
        const yes=uniq(yesRaw.map(v=>toRoster(v.name)));
        const same=yes.length===(cur.present||[]).length&&yes.every(n=>(cur.present||[]).some(x=>nkey(x)===nkey(n)));
        if(!same&&yes.length){const d=getDay(dt.date);d.present=yes;S.days[dt.date]=d;queueWrite('days/'+dt.date,d);synced.push(dt.date)}
        continue}
      if(S.billed.includes(key))continue;
      if(cur&&(cur.present||[]).length){S.billed.push(key);cfgChanged=true;continue}
      if(!yesRaw.length)continue;
      const yes=uniq(yesRaw.map(v=>toRoster(v.name)));S.billed.push(key);cfgChanged=true;
      const per=Math.max(1,+p.perCourt||6),courts=Math.max(1,Math.ceil(yes.length/per)),h=slotHours(dt.note);
      const base=cur?getDay(dt.date):Object.assign(blankDay(dt.date),{hours:h?h*courts:2});
      const d=Object.assign(base,{present:yes,src:'poll',poll:p.id,slot:dt.note||'',courtsBooked:courts,autoSync:true});
      S.days[dt.date]=d;queueWrite('days/'+dt.date,d);made.push(dt.date)}}
  if(cfgChanged)saveConfig();
  if(made.length)toast('“Who played” auto-selected from Yes votes for '+made.map(x=>dlabel(x,{weekday:'short',day:'numeric'})).join(', ')+'. Review on Today.');
  if(made.length||synced.length)renderTab(false);
}

  if(p.missing){v.innerHTML=`<section class="card"><div class="empty">This poll was deleted or the link is wrong.</div><div class="card-f"><button class="btn line block" id="back">See all polls</button></div></section>`;$('#back').onclick=leavePoll;return}
  const t=tally(p,P.votes),closed=isClosed(p);
  const mine=t.voters.find(x=>P.myName&&nkey(x.name)===nkey(P.myName));
  if(mine&&!Object.keys(P.myAns).length)P.myAns={...(mine.answers||{})};
  const names=orderNames(uniq([...activeRoster(),...Object.keys(S.autoOff||{}).map(k=>S.roster.find(r=>nkey(r)===k)).filter(Boolean),...t.voters.map(x=>canon(x.name))]));
  const known=names.some(n=>nkey(n)===nkey(P.myName));
  const best=t.res.reduce((a,r)=>Math.max(a,r.courts),0);
  const prev=P.list.filter(x=>x.id!==p.id&&pollLast(x)<(p.dates&&p.dates[0]?p.dates[0].date:'9')).sort((a,b)=>pollLast(b).localeCompare(pollLast(a)))[0];
  const sendCardHTML=`<section class="card">${cardH('chat',P.justCreated===p.id?'Poll ready. Send it now':'Send to WhatsApp')}
    <div class="pad">${isOrg?`<a class="btn wa block" href="${waHref(msgPoll(p,'startRule'))}" target="_blank" rel="noopener" data-sent="${esc(p.id)}|start">${ic('chat')}Send poll + “app votes only” note</a>`:''}<a class="btn ${isOrg?'line':'wa'} block" href="${waHref(msgPoll(p))}" target="_blank" rel="noopener"${isOrg?` data-sent="${esc(p.id)}|start"`:''}>${ic('chat')}Send poll on WhatsApp</a>
      <div class="grid2"><button class="btn line" id="cplink">${ic('copy')}Copy message</button>${isOrg?`<button class="btn line" id="cpopts">${ic('poll')}As WA poll</button>`:`<button class="btn line" id="cplink2">${ic('copy')}Copy link</button>`}</div></div></section>`;
  v.innerHTML=`
  <button class="lnk" id="back" style="align-self:flex-start">‹ All polls</button>
  ${intro(esc(p.title),closed?'This poll is closed.':p.closesAt?'Voting closes '+esc(closeText(p.closesAt))+'.':'Voting is open.')}
  ${kpis([['Voted',t.voters.length],['Waiting',t.pending.length],['Courts',best||'–',true]])}
  ${isOrg?sendCardHTML:''}
  ${isClosed(p)&&isOrg?`<div class="note">${ic('wallet')}<p>Voting closed. “Who played” is pre-filled from the yes votes. Review it on Today before billing.</p><button class="btn sm line" data-gotoday="${esc((p.dates&&p.dates[0]||{}).date||'')}">Today</button></div>`:''}
  ${closed?'':`<section class="card">${cardH('check','Your vote','<span id="vstat"></span>')}
    <div class="pad"><select class="txt" id="vname" aria-label="Your name"><option value="">Choose your name…</option>${names.map(n=>`<option ${nkey(n)===nkey(P.myName)?'selected':''}>${esc(n)}</option>`).join('')}${S.openNames!==false?`<option value="__other" ${P.myName&&!known?'selected':''}>I’m not on the list…</option>`:''}</select>
      ${S.openNames===false?'<p class="hint">Not on the list? Ask the organizer to add you.</p>':''}
      <input class="txt" type="text" id="vother" placeholder="Type your name" value="${P.myName&&!known?esc(P.myName):''}" ${P.myName&&!known?'':'hidden'}>
      <p class="warn" id="vwarn" hidden></p></div>
    ${p.dates.map(dt=>`<div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><b>${esc(waOpt(dt))}</b><div class="vote">${['yes|Yes','maybe|Maybe','no|No'].map(s=>{const[val,l]=s.split('|');return`<button type="button" class="${P.myAns[dt.date]===val?'on':''}" data-ans="${dt.date}|${val}">${l}</button>`}).join('')}</div></div>`).join('')}
    <div class="card-f"><button type="button" class="btn line block" id="cantmake">Not available on any of these</button></div></section>`}
  ${isOrg?'':sendCardHTML}
  <section class="card">${cardH('poll','Results',t.per+' per court')}
    ${t.res.map(r=>`<div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(waOpt(r))}</b><span class="badge solid">${r.courts?plural(r.courts,'court'):'No courts'}</span></div>
      <small class="hint">${r.yes.length} yes · ${r.maybe.length} maybe · ${r.no.length} no${r.courtsMax>r.courts?' · up to '+plural(r.courtsMax,'court')+' if maybes come':''}</small>
      ${r.yes.length||r.maybe.length?`<div class="names">${r.yes.map(n=>`<span class="nm-chip">${esc(n)}</span>`).join('')}${r.maybe.map(n=>`<span class="nm-chip maybe">${esc(n)}?</span>`).join('')}</div>`:''}</div>`).join('')}
    <div class="row"><div class="l"><b>No vote yet</b><small>${t.pending.length?t.pending.map(esc).join(', '):'Everyone has voted'}</small></div></div>
    <div class="card-f" style="display:grid;grid-template-columns:${t.pending.length&&!closed?'1fr 1fr':'1fr'}">${t.pending.length&&!closed?`<a class="btn line" href="${waHref(msgReminder(p,t))}" target="_blank" rel="noopener">${ic('bell')}Remind</a>`:''}<a class="btn wa" href="${waHref(msgResults(p,t))}" target="_blank" rel="noopener">${ic('chat')}Post results</a></div>
  </section>
  ${isOrg?orgGrid(p,t)+`<section class="card">${cardH('gear','Manage poll')}
    <div class="pad"><div class="grid2"><button class="btn line" id="toggleclose">${p.closed?'Reopen poll':'Close poll'}</button>${P.confirmDel?`<button class="btn danger" id="delok">Delete for good</button>`:`<button class="btn line" id="delpoll">${ic('trash')}Delete</button>`}</div>
    <p class="hint">When voting closes, the yes voters are pre-filled as “Who played” for each date. You can still change it on Today.</p></div></section>`:''}
  ${prev?recapHTML(prev,'Previous poll'):''}`;
  $('#back').onclick=leavePoll;
  bindReminders(v);
  v.querySelectorAll('[data-gotoday]').forEach(b=>b.onclick=()=>{if(b.dataset.gotoday)curDate=b.dataset.gotoday;go('day')});
  $('#cplink').onclick=()=>copyText(msgPoll(p));
  const c2=$('#cplink2');if(c2)c2.onclick=()=>copyText(pollLink(p.id),'Link copied.');
  const co=$('#cpopts');if(co)co.onclick=()=>copyText(msgOptions(p),'Poll options copied. Paste them into a WhatsApp poll.');
  bindOrgGrid(v,p,t);
  const sel=$('#vname');
  if(sel){
    const setName=n=>{P.myName=n;P.myAns={};const m=t.voters.find(x=>nkey(x.name)===nkey(n));if(m)P.myAns={...(m.answers||{})};setMe(n)};
    sel.onchange=()=>{if(sel.value==='__other'){$('#vother').hidden=false;$('#vother').focus();P.myName=''}else{setName(sel.value);renderPolls()}};
    $('#vother').oninput=e=>{P.myName=tcase(e.target.value);$('#vwarn').hidden=true};
    attachSuggest($('#vother'),()=>names,n=>{setName(canon(n));renderPolls()},'in the list');
    $('#vother').onblur=e=>{const n=tcase(e.target.value);if(!n)return;const chk=nameCheck(n,names);
      if(chk&&chk.type==='dup'){setName(chk.name);renderPolls()}
      else if(chk&&chk.type==='near'){const w=$('#vwarn');w.hidden=false;w.innerHTML=`<span style="flex:1">Are you <b>${esc(chk.name)}</b>?</span><button type="button" class="btn sm line" id="yesme">Yes, that’s me</button>`;$('#yesme').onclick=()=>{setName(chk.name);renderPolls()}}
      else setName(n)};
    v.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{
      if(!norm(P.myName)){toast('Choose your name first.');sel.focus();return}
      const[date,val]=b.dataset.ans.split('|');P.myAns[date]=val;
      b.parentElement.querySelectorAll('[data-ans]').forEach(x=>x.classList.toggle('on',x===b));
      $('#vstat').textContent='Saving…';clearTimeout(P.saveT);P.saveT=setTimeout(saveVote,350)});
    $('#cantmake').onclick=()=>{if(!norm(P.myName)){toast('Choose your name first.');return}p.dates.forEach(dt=>P.myAns[dt.date]='no');renderPolls();saveVote()};
  }
  const tc=$('#toggleclose');if(tc)tc.onclick=async()=>{try{await pollsCol().doc(p.id).update({closed:!p.closed});if(!p.closed){PDATA.at=0;await loadOrgData(true)}}catch(e){toast('Couldn’t update the poll ('+e.code+').')}};
  const dp=$('#delpoll');if(dp)dp.onclick=()=>{P.confirmDel=true;renderPolls()};
  const dk=$('#delok');if(dk)dk.onclick=async()=>{try{const ref=pollsCol().doc(p.id);const vs=await ref.collection('votes').get();await Promise.all(vs.docs.map(d=>d.ref.delete()));await ref.delete();leavePoll();toast('Poll deleted.')}catch(e){toast('Couldn’t delete ('+e.code+').')}};
}
function orgGrid(p,t){
  const names=orderNames(uniq([...activeRoster(),...Object.keys(S.autoOff||{}).map(k=>S.roster.find(r=>nkey(r)===k)).filter(Boolean),...t.voters.map(x=>canon(x.name))]));
  const ans=n=>{const m=t.voters.find(x=>nkey(x.name)===nkey(n));return m?(m.answers||{}):{}};
  const out=n=>{const a=ans(n);return p.dates.length&&p.dates.every(dt=>a[dt.date]==='no')};
  return`<section class="card">${cardH('check','Record votes','<span id="gstat"></span>')}
    <div class="pad" style="padding-bottom:4px"><p class="hint">For replies in the chat or a WhatsApp poll: tap who picked each option. “Both” voters go under each date.</p></div>
    ${p.dates.map(dt=>`<div class="sub"><span class="sublbl">${esc(waOpt(dt))}</span><div class="tiles sm">${names.map(n=>`<button type="button" class="tile ${ans(n)[dt.date]==='yes'?'on':''}" data-g="${esc(n)}|${dt.date}">${ic('check')}<span>${esc(n)}</span></button>`).join('')}</div></div>`).join('')}
    <div class="sub"><span class="sublbl">Not available</span><div class="tiles sm">${names.map(n=>`<button type="button" class="tile ${out(n)?'on':''}" data-g="${esc(n)}|__out">${ic('check')}<span>${esc(n)}</span></button>`).join('')}</div></div>
  </section>`;
}
const gTimers={};
function bindOrgGrid(v,p,t){
  v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.g.lastIndexOf('|'),name=b.dataset.g.slice(0,i),k=b.dataset.g.slice(i+1);
    const prev=t.voters.find(x=>nkey(x.name)===nkey(name)),a={...((prev&&prev.answers)||{})},on=!b.classList.contains('on');
    if(k==='__out')p.dates.forEach(dt=>{if(on)a[dt.date]='no';else if(a[dt.date]==='no')delete a[dt.date]});
    else{if(on){a[k]='yes';p.dates.forEach(dt=>{if(a[dt.date]==='no')delete a[dt.date]})}else delete a[k]}
    const nv={name,answers:a,updatedAt:Date.now()};
    P.votes=[...P.votes.filter(x=>nkey(x.name)!==nkey(name)),nv];renderPolls();
    const st=$('#gstat');if(st)st.textContent='Saving…';
    clearTimeout(gTimers[name]);gTimers[name]=setTimeout(async()=>{try{await pollsCol().doc(p.id).collection('votes').doc('n-'+slug(name)).set(nv);const s=$('#gstat');if(s)s.textContent='Saved'}catch(e){toast('Couldn’t save '+first(name)+'’s vote ('+e.code+').')}},400)});
}
async function saveVote(){
  const p=P.sel;if(!p||!p.id)return;const name=canon(tcase(P.myName));
  try{if(!auth.currentUser)await auth.signInAnonymously();const id=auth.currentUser.isAnonymous?auth.currentUser.uid:'n-'+slug(name);
    await pollsCol().doc(p.id).collection('votes').doc(id).set(Object.assign({name,answers:{...P.myAns},updatedAt:Date.now()},auth.currentUser.isAnonymous?{}:{self:true}));
    const s=$('#vstat');if(s)s.textContent='Saved. Thanks, '+first(name)+'!'}
  catch(e){const s=$('#vstat');if(s)s.textContent='';
    toast(e.code==='permission-denied'?(isClosed(p)?'This poll is closed.':'Couldn’t save your vote. Ask the organizer to check the poll rules.'):(e.code==='auth/admin-restricted-operation'||e.code==='auth/operation-not-allowed')?'Voting isn’t switched on yet. Ask the organizer to enable Anonymous sign-in in Firebase.':'Couldn’t save ('+(e.code||'error')+').')}
}
function pollForDate(date){return P.list.find(p=>(p.dates||[]).some(dt=>dt.date===date))}
async function fillFromPoll(date){const p=pollForDate(date);if(!p)return;
  try{const vs=await pollsCol().doc(p.id).collection('votes').get();
    const yes=latestByName(vs.docs.map(d=>d.data())).filter(v=>(v.answers||{})[date]==='yes').map(v=>norm(v.name));
    if(!yes.length)return toast('Nobody voted yes for this date yet.');
    let added=false;const canonN=yes.map(n=>{const c=S.roster.find(r=>nkey(r)===nkey(n));if(c)return c;const t=tcase(n);S.roster.push(t);added=true;return t});if(added)saveConfig();
    editDay(d=>{d.present=uniq([...d.present,...canonN])});toast('Ticked '+canonN.length+' players from the poll. Untick anyone who didn’t come.')}
  catch(e){toast('Couldn’t read the poll ('+e.code+').')}}

/* ================= navigation & boot ================= */
function go(t){closeWho();if(t!=='team'&&teamUI)teamUI.page='';tab=t;if((t==='team'||t==='day')&&isOrg)loadOrgData(false);document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  ['day','polls','pay','team'].forEach(k=>$('#view-'+k).hidden=k!==t);renderTab(true);window.scrollTo(0,0)}
document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='pay'&&tab!=='pay'&&pay.range==='day'){pay.range='last';pay.off.clear()}go(b.dataset.tab)});
function typingIn(id){const a=document.activeElement;return!!a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&$(id).contains(a)&&a.type!=='checkbox'&&a.type!=='file'}
function renderTab(force){
  renderHeader();
  if(tab==='day'){if(force||!typingIn('#view-day'))renderDay();else refreshDay()}
  else if(tab==='polls')pollRender();
  else if(tab==='pay')renderPay();
  else if(tab==='team'){if(force||!typingIn('#view-team'))renderTeam()}
}
async function signIn(){if(!auth)return;const prov=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(prov)}catch(e){
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))auth.signInWithRedirect(prov);
    else if(e.code!=='auth/popup-closed-by-user')toast('Sign-in failed: '+(e.message||e.code))}}
$('#status').onclick=()=>{if(isOrg||userEmail())go('team');else signIn()};

loadLocal();if(!S.roster.length&&!GID)S.roster=[...DEFAULT_PLAYERS];
/* each group installs with its own link */
if(GID){try{const abs=u=>new URL(u,location.href).href;const m={name:'Shuttle Split',short_name:'Shuttle Split',start_url:HERE,scope:abs('./'),display:'standalone',background_color:'#F3F5F4',theme_color:'#0B7A4E',icons:[{src:abs('icon-192.png'),sizes:'192x192',type:'image/png'},{src:abs('icon-512.png'),sizes:'512x512',type:'image/png'}]};
  const l=document.querySelector('link[rel=manifest]');if(l)l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))}catch(e){}}
applySkin();bindDay();bindTeam();renderTab(true);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

(function boot(){
  const ok=typeof firebase!=='undefined'&&FIREBASE_CONFIG.apiKey&&!/^PASTE/.test(FIREBASE_CONFIG.apiKey);
  if(!ok)return;
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  auth=firebase.auth();
  let cfgMissing=false,authInit=false;
  auth.getRedirectResult().catch(e=>toast('Sign-in failed: '+(e.message||e.code)));
  auth.onAuthStateChanged(u=>{const changed=computeOrg();
    if(!authInit||changed){authInit=true;renderTab(true);if(isOrg&&cfgMissing){cfgMissing=false;saveConfig()}}else renderHeader();
    if(isOrg)loadOrgData(true)});
  if(GID)db.doc(COLLECTION_PREFIX+'groups/'+GID).onSnapshot(s=>{
    if(!s.exists&&!s.metadata.fromCache){GROUP_MISSING=true;renderHeader();return}
    if(s.exists){GROUP=s.data();GROUP_MISSING=false;if(!S.groupName)S.groupName=GROUP.name||'';rememberGroup();if(computeOrg()){renderTab(true);if(isOrg)loadOrgData(true)}else renderHeader()}},()=>{});
  fsDoc('config/main').onSnapshot(s=>{if(busy('config/main'))return;
    if(!s.metadata.fromCache)CFG_READY=true;
    if(!s.exists&&!s.metadata.fromCache){cfgMissing=true;if(isOrg){cfgMissing=false;saveConfig()}}
    if(s.exists){const d=s.data();if(Array.isArray(d.roster))S.roster=[...d.roster];S.rate=+d.rate||300;S.groupName=d.groupName||'';S.upiId=d.upiId||'';S.upiName=d.upiName||'';S.levels=d.levels&&typeof d.levels==='object'?d.levels:{};S.admins=Array.isArray(d.admins)?d.admins:[];S.inactive=Array.isArray(d.inactive)?d.inactive:[];S.ignored=Array.isArray(d.ignored)?d.ignored:[];S.openNames=d.openNames!==false;S.idleWeeks=d.idleWeeks==null?4:+d.idleWeeks;S.since=d.since||{};S.autoOff=d.autoOff||{};S.billed=Array.isArray(d.billed)?d.billed:[];S.msg=d.msg||null;S.sent=d.sent||{};setTimeout(autoInactive,0);S.skin=SKINS[d.skin]?d.skin:'court';applySkin();saveLocal();if(GID)rememberGroup();if(computeOrg())renderTab(true)}
    renderTab(false)},e=>toast('Couldn’t load shared data ('+e.code+').'));
  fsDoc('config/photo').onSnapshot(s=>{if(busy('config/photo'))return;photo=s.exists?(s.data().data||''):'';try{photo?localStorage.setItem(LSP,photo):localStorage.removeItem(LSP)}catch(e){}renderHeader();if(tab==='team'&&!typingIn('#view-team'))renderTeam()},()=>{});
  col('days').onSnapshot(q=>{
    const next={};q.docs.forEach(doc=>next[doc.id]=normDay(doc.data(),doc.id));
    Object.keys(S.days).forEach(k=>{if(busy('days/'+k))next[k]=S.days[k]});
    Object.keys(pending).forEach(p=>{if(p.startsWith('days/')&&pending[p]===null)delete next[p.slice(5)]});
    S.days=next;if(!q.metadata||!q.metadata.fromCache)DAYS_READY=true;saveLocal();renderTab(false);autoInactive()},()=>{});
  payCol().onSnapshot(q=>{PAYS=q.docs.map(d=>({id:d.id,...d.data()}));if(!typingIn('#view-day')&&!typingIn('#view-team'))renderTab(false)},()=>{});
  startPollsListener();routeHash();window.addEventListener('hashchange',routeHash);
  setTimeout(()=>pingSeen(false),1500);
})();
})();
</script>
