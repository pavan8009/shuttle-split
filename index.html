<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#132F78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow phone column — sticky header with tabs, stacked sections, a live summary card per day */
:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --sunk:#E3E9F5; --ink:#0E1B3D; --muted:#56637F; --line:#D5DDEC;
  --navy:#132F78; --accent:#1F4FD1; --on-accent:#FFFFFF; --shuttle:#F2BE12; --good:#127A4B; --warn:#B4520B;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1020; --surface:#121B31; --sunk:#0E1528; --ink:#E7ECF8; --muted:#95A2C2; --line:#25304D;
  --navy:#16306F; --accent:#7EA0FF; --on-accent:#0A1020; --shuttle:#F2BE12; --good:#4CC98C; --warn:#F0A060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1020; --surface:#121B31; --sunk:#0E1528; --ink:#E7ECF8; --muted:#95A2C2; --line:#25304D;
  --navy:#16306F; --accent:#7EA0FF; --on-accent:#0A1020; --shuttle:#F2BE12; --good:#4CC98C; --warn:#F0A060; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff}
header .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;margin:0;line-height:1}
.brand small{color:#C7D3F5;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.brand svg{flex:none}
nav{display:flex;gap:4px}
nav button{flex:1;background:none;border:0;color:#C7D3F5;font:600 14px var(--body);padding:10px 4px 12px;border-bottom:3px solid transparent;cursor:pointer;letter-spacing:.02em}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--shuttle)}
main .wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.badge{font:700 13px var(--body);background:var(--sunk);color:var(--ink);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.datebar{display:flex;align-items:center;gap:8px}
.datebar input{flex:1;min-width:0;font:600 16px var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 20px var(--body);cursor:pointer;flex:none}
.daylabel{font-family:var(--display);font-size:26px;font-weight:700;margin:0;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.off{background:var(--sunk);color:var(--muted);text-decoration:line-through;border-style:dashed}
.chip.small{padding:6px 11px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;color:var(--accent);font:600 13px var(--body);cursor:pointer;padding:4px 2px}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.money span{padding:0 4px 0 12px;color:var(--muted);font-weight:600}
.money input,.textin{border:0;background:transparent;color:var(--ink);font:600 17px var(--body);padding:11px 12px 11px 4px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.textin{border:1px solid var(--line);border-radius:10px;padding-left:12px;font-weight:500;font-size:15px;background:var(--surface)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{width:44px;height:44px;border:0;background:var(--sunk);color:var(--ink);font:700 20px var(--body);cursor:pointer}
.stepper output{flex:1;text-align:center;font:700 17px var(--body);font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:0}
.sum{background:var(--navy);color:#fff;border-color:var(--navy)}
.sum .lbl{color:#C7D3F5}
.sum-lines{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.sum-lines div{display:flex;justify-content:space-between;gap:12px}
.sum-lines .eq{color:#C7D3F5;font-size:13px}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed rgba(255,255,255,.3);padding-top:10px}
.sum-total b{font-family:var(--display);font-size:32px;color:var(--shuttle);font-variant-numeric:tabular-nums}
.pp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.pp span:nth-child(even){text-align:right;font-weight:700}
.btn{border:0;border-radius:12px;padding:13px 16px;font:700 15px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.wa{background:#1F9D55;color:#fff}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--warn);color:#fff}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .full{grid-column:1/-1}
.daylist{display:flex;flex-direction:column;gap:6px}
.daylist label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums}
.daylist label input{width:20px;height:20px;accent-color:var(--accent)}
.daylist label span{flex:1}
.daylist label em{font-style:normal;color:var(--muted);font-size:13px}
.preview img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td.tot{font-weight:800}
.plist{display:flex;flex-direction:column}
.plist div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.plist div:last-child{border-bottom:0}
.empty{text-align:center;padding:20px 8px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.status{font-size:12px;color:#C7D3F5;margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.authbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 11px;font:600 12px var(--body);cursor:pointer}
.ro .chip,.ro .stepper button{cursor:default}
.setup{background:#FFF4D6;color:#5A3B00;border:1px solid #F2BE12;border-radius:12px;padding:12px 14px;font-size:14px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--shuttle);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="9" cy="23" r="6" fill="#F2BE12"/><path d="M12 19 L26 4 M9 18 L18 3 M14 21 L29 10" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M12 19 L18 3 L26 4 L29 10 L14 21Z" fill="#fff" opacity=".25"/></svg>
      <div><h1>Shuttle Split</h1><small>Court · Shuttles · Drinks</small></div>
      <div class="status"><span id="status">Loading…</span><button class="authbtn" id="authbtn" hidden>Sign in</button></div>
    </div>
    <nav role="tablist">
      <button role="tab" id="tab-day" aria-selected="true">Day</button>
      <button role="tab" id="tab-polls" aria-selected="false">Polls</button>
      <button role="tab" id="tab-share" aria-selected="false">Share</button>
      <button role="tab" id="tab-players" aria-selected="false">Players</button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap" id="view-day"></div>
  <div class="wrap" id="view-polls" hidden></div>
  <div class="wrap" id="view-share" hidden></div>
  <div class="wrap" id="view-players" hidden></div>
</main>
<canvas id="cv" hidden></canvas>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== 1. Paste your Firebase web config here (Firebase console → Project settings → Your apps) ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAlY9WxJ8Q_pbDiJQ2XQmsLpBug3KBtyPQ",
  authDomain: "gg-dvg-badminton-league.firebaseapp.com",
  projectId: "gg-dvg-badminton-league",
  storageBucket: "gg-dvg-badminton-league.firebasestorage.app",
  messagingSenderId: "426882143669",
  appId: "1:426882143669:web:b8acbcafbbb47756a035fc"
};
/* Collections get this prefix so they never clash with your league app's data in the same project */
const COLLECTION_PREFIX = "shuttleSplit_";
/* Starting player list, used only until the first save */
const DEFAULT_PLAYERS = ["Manju","Ashwini","Pavan","Praveen","Santhosh","Karthik","Ram","Suresh","Sheela","Uma","Shwetha"];

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS='shuttle-split-v1';
const S={roster:[],rate:300,courts:1,days:{}};
let db=null, curDate=todayStr(), tab='day', shareSel=null, readOnly=false;

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shift(ds,n){const d=new Date(ds+'T00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dlabel(ds,long){const d=new Date(ds+'T00:00');return d.toLocaleDateString('en-IN',long?{weekday:'long',day:'numeric',month:'short',year:'numeric'}:{weekday:'short',day:'numeric',month:'short'})}
const inr=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;

function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&typeof j==='object'){Object.assign(S,j)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ---------- writes (one at a time per doc, debounced) ---------- */
const pending={},inflight={},timers={};
function fsDoc(path){return db.doc(path.replace(/^([^/]+)\//,COLLECTION_PREFIX+'$1/'))}
function queueWrite(path,val){if(db&&readOnly){toast('Sign in as the organizer to make changes.');return}saveLocal();if(!db)return;pending[path]=val;clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),450);setStatus('Saving…')}
async function flush(path){
  if(inflight[path]||!(path in pending))return;
  const v=pending[path];delete pending[path];inflight[path]=true;
  try{const ref=fsDoc(path);if(v===null)await ref.delete();else await ref.set(v);setStatus('Saved')}
  catch(e){
    if(e&&e.code==='permission-denied'){readOnly=true;setStatus('View only');toast('This account can view but not edit. Ask the organizer.')}
    else toast('Could not save ('+((e&&e.code)||'error')+'). Your change is kept on this phone.');
  }
  inflight[path]=false;if(path in pending)flush(path);
}
const busy=p=>(p in pending)||inflight[p];

/* ---------- model ---------- */
function blankDay(date){return{date,present:[],hours:2,rate:S.rate,courts:S.courts,shuttle:0,shuttleSkip:[],drinksOn:false,drinks:0,drinksSkip:[]}}
function getDay(date){return S.days[date]?JSON.parse(JSON.stringify(S.days[date])):blankDay(date)}
function isEmpty(d){return !d.present.length&&!(+d.shuttle)&&!(+d.drinks)}
function setDay(d){
  if(readOnly){toast(db?'Sign in as the organizer to make changes.':'Set up Firebase to save changes.');return}
  if(isEmpty(d)){delete S.days[d.date];queueWrite('days/'+d.date,null)}
  else{S.days[d.date]=d;queueWrite('days/'+d.date,d)}
}
function saveConfig(){queueWrite('config/main',{roster:S.roster,rate:S.rate,courts:S.courts})}

function calc(d){
  const n=d.present.length;
  const court=(+d.hours||0)*(+d.rate||0)*(+d.courts||1);
  const shSharers=d.present.filter(p=>!d.shuttleSkip.includes(p));
  const drSharers=d.drinksOn?d.present.filter(p=>!d.drinksSkip.includes(p)):[];
  const shuttle=+d.shuttle||0, drinks=d.drinksOn?(+d.drinks||0):0;
  const cEach=n?Math.ceil(court/n):0, sEach=shSharers.length&&shuttle?Math.ceil(shuttle/shSharers.length):0, dEach=drSharers.length&&drinks?Math.ceil(drinks/drSharers.length):0;
  const per={};
  d.present.forEach(p=>{per[p]={court:cEach,shuttle:shSharers.includes(p)?sEach:0,drinks:drSharers.includes(p)?dEach:0};per[p].total=per[p].court+per[p].shuttle+per[p].drinks});
  const actual=court+shuttle+drinks, collected=Object.values(per).reduce((a,b)=>a+b.total,0);
  return{n,court,shuttle,drinks,cEach,sEach,dEach,shN:shSharers.length,drN:drSharers.length,per,actual,collected,
    courtExact:n?court/n:0,shExact:shSharers.length?shuttle/shSharers.length:0,drExact:drSharers.length?drinks/drSharers.length:0};
}

/* ---------- UI helpers ---------- */
let toastT;function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function setStatus(s){$('#status').textContent=s}
function orderNames(names){const idx=n=>{const i=S.roster.indexOf(n);return i<0?999:i};return [...names].sort((a,b)=>idx(a)-idx(b)||a.localeCompare(b))}

/* ---------- DAY VIEW ---------- */
function renderDay(full=true){
  const v=$('#view-day'), d=getDay(curDate);
  if(full||!v.firstChild){
    v.innerHTML=`
    <section class="card">
      <div class="datebar">
        <button class="iconbtn" id="prev" aria-label="Previous day">‹</button>
        <input type="date" id="date" value="${curDate}" aria-label="Play date">
        <button class="iconbtn" id="next" aria-label="Next day">›</button>
      </div>
      <p class="daylabel">${esc(dlabel(curDate,true))}</p>
    </section>
    <section class="card">
      <div class="sec-h"><h2>Who played</h2><span class="badge" id="pcount"></span></div>
      <div class="chips" id="att"></div>
      <div class="row"><button class="link" id="all">Mark all</button><button class="link" id="none">Clear</button><button class="link" id="frompoll" hidden>Fill from poll</button></div>
      <div class="row"><input class="textin" id="guest" placeholder="Add a guest or new player" style="flex:1;min-width:0"><button class="btn ghost" id="addguest">Add</button></div>
    </section>
    <section class="card">
      <div class="sec-h"><h2>Court</h2><span class="badge" id="courtamt"></span></div>
      <div class="grid3">
        <div class="field"><span class="lbl">Hours played</span><div class="stepper"><button id="h-" aria-label="Less time">−</button><output id="hours"></output><button id="h+" aria-label="More time">+</button></div></div>
        <div class="field"><label for="rate">Per hour</label><div class="money"><span>₹</span><input id="rate" type="number" inputmode="decimal" min="0" value="${d.rate}"></div></div>
        <div class="field"><span class="lbl">Courts</span><div class="stepper"><button id="c-" aria-label="Fewer courts">−</button><output id="courts"></output><button id="c+" aria-label="More courts">+</button></div></div>
      </div>
    </section>
    <section class="card">
      <div class="sec-h"><h2>Shuttles</h2></div>
      <div class="field"><label for="shuttle">Shuttle cost for the day</label><div class="money"><span>₹</span><input id="shuttle" type="number" inputmode="decimal" min="0" placeholder="0" value="${+d.shuttle||''}"></div></div>
      <div id="shWrap"><p class="hint">Shared by (tap to leave someone out)</p><div class="chips" id="shChips"></div></div>
    </section>
    <section class="card">
      <div class="sec-h"><h2>Drinks</h2></div>
      <label class="toggle"><input type="checkbox" id="drOn" ${d.drinksOn?'checked':''}> Drinks taken today</label>
      <div id="drWrap">
        <div class="field"><label for="drinks">Drinks total</label><div class="money"><span>₹</span><input id="drinks" type="number" inputmode="decimal" min="0" placeholder="0" value="${+d.drinks||''}"></div></div>
        <p class="hint" style="margin-top:10px">Shared by (tap anyone who didn’t have a drink)</p><div class="chips" id="drChips"></div>
      </div>
    </section>
    <section class="card sum" id="sum"></section>`;
    bindDay();
  }
  // dynamic parts
  {const fp=$('#frompoll');if(fp)fp.hidden=!(db&&!readOnly&&pollForDate(curDate));}
  $('#pcount').textContent=d.present.length+' of '+S.roster.length;
  $('#att').innerHTML=S.roster.length?S.roster.map(p=>`<button class="chip" data-p="${esc(p)}" aria-pressed="${d.present.includes(p)}">${esc(p)}</button>`).join('')
    :`<p class="hint">No players yet. Add names below or in the Players tab.</p>`;
  $('#hours').textContent=(+d.hours)+' hr';
  $('#courts').textContent=d.courts;
  const c=calc(d);
  $('#courtamt').textContent=inr(c.court);
  $('#shWrap').hidden=!(+d.shuttle)||!d.present.length;
  $('#shChips').innerHTML=orderNames(d.present).map(p=>`<button class="chip small ${d.shuttleSkip.includes(p)?'off':''}" data-sh="${esc(p)}">${esc(p)}</button>`).join('');
  $('#drWrap').hidden=!d.drinksOn;
  $('#drChips').innerHTML=orderNames(d.present).map(p=>`<button class="chip small ${d.drinksSkip.includes(p)?'off':''}" data-dr="${esc(p)}">${esc(p)}</button>`).join('');
  const diff=c.collected-c.actual;
  $('#sum').innerHTML=c.n?`
    <div class="sec-h"><h2>${esc(dlabel(curDate))}</h2><span class="lbl">${c.n} players</span></div>
    <div class="sum-lines">
      <div><span>Court ${inr(c.court)}</span><b>${inr(c.cEach)} each</b></div>
      <div class="eq"><span>${+d.hours} hr × ${inr(d.rate)}${d.courts>1?' × '+d.courts+' courts':''} ÷ ${c.n} = ${inr(r2(c.courtExact))}</span></div>
      ${c.shuttle?`<div><span>Shuttles ${inr(c.shuttle)}</span><b>${inr(c.sEach)} each</b></div><div class="eq"><span>÷ ${c.shN} players = ${inr(r2(c.shExact))}</span></div>`:''}
      ${c.drinks?`<div><span>Drinks ${inr(c.drinks)}</span><b>${inr(c.dEach)} each</b></div><div class="eq"><span>÷ ${c.drN} players = ${inr(r2(c.drExact))}</span></div>`:''}
    </div>
    <div class="pp">${orderNames(d.present).map(p=>`<span>${esc(p)}</span><span>${inr(c.per[p].total)}</span>`).join('')}</div>

function report(sel){
  const days=[...sel].sort().map(k=>S.days[k]).filter(Boolean);
  const calcs=days.map(calc);

  const rows=names.map(p=>{const cells=calcs.map(c=>c.per[p]?c.per[p].total:null);return{p,cells,total:cells.reduce((a,b)=>a+(b||0),0),count:cells.filter(x=>x!==null).length}});

}

function startPollsListener(){
  if(P.listening||!db)return;P.listening=true;
  pollsCol().orderBy('createdAt','desc').limit(30).onSnapshot(q=>{P.list=q.docs.map(d=>({id:d.id,...d.data()}));if(tab==='polls'&&P.mode==='list')render(true);if(tab==='day')renderDay(false)},e=>{});
}
function openPoll(id){
  if(!db)return;
  if(P.unsubPoll)P.unsubPoll();if(P.unsubVotes)P.unsubVotes();
  P.mode='detail';P.confirmDel=false;P.sel={id,loading:true};P.votes=[];P.myAns={};
  const ref=pollsCol().doc(id);
  P.unsubPoll=ref.onSnapshot(s=>{P.sel=s.exists?{id,...s.data()}:{id,missing:true};pollRender()},e=>{P.sel={id,missing:true};pollRender()});
  P.unsubVotes=ref.collection('votes').onSnapshot(q=>{P.votes=q.docs.map(d=>d.data());pollRender()},e=>{});
}
function pollRender(){if(tab!=='polls')return;const a=document.activeElement;if(a&&a.tagName==='INPUT'&&a.type==='text'&&$('#view-polls').contains(a))return;renderPolls()}
function routeHash(){const m=location.hash.match(/^#poll-([A-Za-z0-9_-]+)$/);if(m){openPoll(m[1]);go('polls')}}
function leavePoll(){if(P.unsubPoll)P.unsubPoll();if(P.unsubVotes)P.unsubVotes();P.unsubPoll=P.unsubVotes=null;P.mode='list';P.sel=null;try{history.replaceState(null,'',location.pathname)}catch(e){}renderPolls()}

function renderPolls(){
  const v=$('#view-polls');
  if(!db){v.innerHTML=`<section class="card"><div class="empty">Availability polls need the shared Firebase database. Paste your Firebase config into index.html to turn them on.</div></section>`;return}
  if(P.mode==='new')return renderNewPoll(v);
  if(P.mode==='detail')return renderPollDetail(v);
  v.innerHTML=`
  <section class="card">
    <div class="sec-h"><h2>Availability polls</h2>${isOrg?'<button class="btn primary" id="newpoll" style="padding:9px 14px">New poll</button>':''}</div>
    <p class="hint">Ask the group who can play on which dates, then book courts to match.</p>
  </section>
  ${P.list.length?P.list.map(p=>`<section class="card" style="gap:6px;cursor:pointer" data-open="${esc(p.id)}" role="button" tabindex="0">
    <div class="sec-h"><b style="font-size:16px">${esc(p.title)}</b><span class="badge">${isClosed(p)?'Closed':'Open'}</span></div>
    <span class="hint">${(p.dates||[]).map(dt=>esc(dlabel(dt.date))).join(' · ')}</span></section>`).join('')
  :`<section class="card"><div class="empty">${isOrg?'No polls yet. Tap New poll to ask about the coming weekend.':'No polls yet.'}</div></section>`}`;
  const np=$('#newpoll');if(np)np.onclick=()=>{const[sa,su]=nextWeekend(0);P.draft={title:'Who’s up for Badminton this weekend?',dates:[{date:sa,note:'5-7 PM'},{date:su,note:'9-11 AM'}],perCourt:6,closes:shift(sa,-1)+'T22:00'};P.mode='new';renderPolls()};
  v.querySelectorAll('[data-open]').forEach(el=>{const f=()=>{location.hash='poll-'+el.dataset.open};el.onclick=f;el.onkeydown=e=>{if(e.key==='Enter')f()}});
}

function renderNewPoll(v){
  const D=P.draft;if(D.closes===undefined)D.closes='';
  v.innerHTML=`
  <section class="card">
    <div class="sec-h"><h2>New poll</h2><button class="link" id="cancelnew">Cancel</button></div>
    <div class="field"><label for="ptitle">Question</label><input class="textin" type="text" id="ptitle" value="${esc(D.title)}"></div>
  </section>
  <section class="card">
    <div class="sec-h"><h2>Dates</h2><span class="badge">${D.dates.length}</span></div>
    <div class="row"><button class="chip small" id="wk0">This weekend</button><button class="chip small" id="wk1">Next weekend</button></div>
    <div class="plist">${D.dates.map((dt,i)=>`<div><span>${esc(dlabel(dt.date))}${dt.note?' · <span class="hint" style="display:inline">'+esc(dt.note)+'</span>':''}</span><button class="link" data-rmdate="${i}">Remove</button></div>`).join('')||'<p class="hint">Add at least one date.</p>'}</div>
    <div class="grid3">
      <div class="field"><label for="ndate">Date</label><input class="textin" type="date" id="ndate" value="${shift(D.dates.length?D.dates[D.dates.length-1].date:todayStr(),1)}"></div>
      <div class="field"><label for="nnote">Time (optional)</label><input class="textin" type="text" id="nnote" placeholder="5-7 PM"></div>
    </div>
    <button class="btn ghost" id="adddate">Add date</button>
  </section>
  <section class="card">
    <div class="sec-h"><h2>Voting closes</h2></div>
    <input class="textin" type="datetime-local" id="pclose" value="${esc(D.closes)}" aria-label="Poll closes at">
    <p class="hint">After this, no more votes. Leave empty to close it yourself.</p>
  </section>
  <section class="card">
    <div class="sec-h"><h2>Courts</h2></div>
    <div class="field"><span class="lbl">Players per court</span><div class="stepper"><button id="pc-" aria-label="Fewer players per court">−</button><output>${D.perCourt}</output><button id="pc+" aria-label="More players per court">+</button></div></div>
    <p class="hint">Used to work out how many courts to book. 4 means everyone plays every game; 6 or more means people rotate.</p>
    <button class="btn primary" id="createpoll">Create poll</button>
  </section>`;
  const keep=()=>{D.title=$('#ptitle').value;D.closes=$('#pclose').value};
  $('#cancelnew').onclick=()=>{P.mode='list';renderPolls()};
  const setWk=w=>{keep();const[a,b]=nextWeekend(w);D.dates=[{date:a,note:'5-7 PM'},{date:b,note:'9-11 AM'}];D.closes=shift(a,-1)+'T22:00';renderPolls()};
  $('#wk0').onclick=()=>setWk(0);$('#wk1').onclick=()=>setWk(1);
  v.querySelectorAll('[data-rmdate]').forEach(b=>b.onclick=()=>{keep();D.dates.splice(+b.dataset.rmdate,1);renderPolls()});
  $('#adddate').onclick=()=>{keep();const d=$('#ndate').value;if(!d)return;const note=$('#nnote').value.trim();D.dates=D.dates.filter(x=>!(x.date===d&&x.note===note));D.dates.push({date:d,note});D.dates.sort((a,b)=>a.date.localeCompare(b.date));renderPolls()};
  $('#pc-').onclick=()=>{keep();D.perCourt=Math.max(2,D.perCourt-1);renderPolls()};
  $('#pc+').onclick=()=>{keep();D.perCourt=Math.min(12,D.perCourt+1);renderPolls()};
  $('#createpoll').onclick=async()=>{
    keep();if(!D.title.trim())return toast('Add a question for the poll.');if(!D.dates.length)return toast('Add at least one date.');
    const b=$('#createpoll');b.disabled=true;b.textContent='Creating…';
    try{const ref=pollsCol().doc();const ca=D.closes?new Date(D.closes).getTime():null;if(ca&&ca<Date.now()){b.disabled=false;b.textContent='Create poll';return toast('The closing time is already past.')}
    await ref.set({title:D.title.trim(),dates:D.dates,perCourt:D.perCourt,closed:false,closesAt:ca,createdAt:Date.now()});P.draft=null;location.hash='poll-'+ref.id;toast('Poll created. Share it to your group.')}
    catch(e){b.disabled=false;b.textContent='Create poll';toast(e.code==='permission-denied'?'Only the organizer can create polls. Sign in first.':'Could not create the poll ('+e.code+').')}

function renderPollDetail(v){
  const p=P.sel;
  if(!p||p.loading){v.innerHTML=`<section class="card"><div class="empty">Loading poll…</div></section>`;return}
  if(p.missing){v.innerHTML=`<section class="card"><div class="empty">This poll was deleted or the link is wrong.</div><button class="btn ghost" id="back">See all polls</button></section>`;$('#back').onclick=leavePoll;return}
  const t=tally(p,P.votes);
  const mine=t.voters.find(x=>P.myName&&x.name.trim().toLowerCase()===P.myName.trim().toLowerCase());
  if(mine&&!Object.keys(P.myAns).length)P.myAns={...(mine.answers||{})};
  const names=orderNames([...new Set([...S.roster,...t.voters.map(x=>x.name)])]);
  const known=names.some(n=>n.toLowerCase()===P.myName.trim().toLowerCase());
  const ansBtn=(date,val,label)=>`<button class="chip small" data-ans="${date}|${val}" aria-pressed="${P.myAns[date]===val}">${label}</button>`;
  v.innerHTML=`
  <button class="link" id="back" style="align-self:flex-start">‹ All polls</button>
  <section class="card">
    <div class="sec-h"><h2 style="text-transform:none;font-size:22px">${esc(p.title)}</h2><span class="badge">${isClosed(p)?'Closed':t.voters.length+' voted'}</span></div>
    ${p.closesAt?`<span class="hint">⏰ ${isClosed(p)&&!p.closed?'Closed':'Closes'} ${esc(closeText(p.closesAt))}</span>`:''}
    <div class="btns">
      <a class="btn wa" href="${waHref(msgPoll(p))}" target="_blank" rel="noopener">Post poll in WhatsApp</a>
      <button class="btn ghost" id="cplink">Copy message</button>
      ${isOrg?'<button class="btn ghost full" id="cpopts">Copy as WhatsApp poll options</button>':''}
    </div>
  </section>
  ${isOrg?orgGrid(p,t):''}
  ${isClosed(p)||isOrg?'':`<section class="card">
    <div class="sec-h"><h2>${isOrg?'Mark a reply':'Your vote'}</h2><span class="hint" id="vstat"></span></div>
    <div class="field"><label for="vname">${isOrg?'Player':'Your name'}</label>
      <select class="textin" id="vname"><option value="">Choose a name…</option>${names.map(n=>`<option ${n.toLowerCase()===P.myName.trim().toLowerCase()?'selected':''}>${esc(n)}</option>`).join('')}<option value="__other" ${P.myName&&!known?'selected':''}>Someone else…</option></select></div>
    <input class="textin" type="text" id="vother" placeholder="Type the name" value="${P.myName&&!known?esc(P.myName):''}" ${P.myName&&!known?'':'hidden'}>
    ${p.dates.map(dt=>`<div class="field" style="gap:8px"><span style="font-weight:700">${esc(waOpt(dt))}</span><div class="row">${ansBtn(dt.date,'yes','✅ Yes')}${ansBtn(dt.date,'maybe','🤔 Maybe')}${ansBtn(dt.date,'no','❌ No')}</div></div>`).join('')}
    <button class="btn ghost" id="cantmake">😭 Not available on any of these</button>
    ${isOrg?'<p class="hint">For people who replied in the WhatsApp chat instead of the link.</p>':''}
  </section>`}
  <section class="card">
    <div class="sec-h"><h2>Results</h2><span class="hint">${t.per} per court</span></div>
    ${t.res.map(r=>`<div style="display:flex;flex-direction:column;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)">
      <div class="sec-h"><b>${esc(waOpt(r))}</b><span class="badge" style="background:var(--accent);color:var(--on-accent)">${r.courts?r.courts+' court'+(r.courts>1?'s':''):'No courts'}</span></div>
      <span class="hint">✅ ${r.yes.length} yes · 🤔 ${r.maybe.length} maybe · ❌ ${r.no.length} no${r.courtsMax>r.courts?' · up to '+r.courtsMax+' courts if maybes come':''}</span>
      <div class="chips">${r.yes.map(n=>`<span class="chip small" aria-pressed="true">${esc(n)}</span>`).join('')}${r.maybe.map(n=>`<span class="chip small">${esc(n)}?</span>`).join('')}</div>
    </div>`).join('')}
    ${t.pending.length?`<div class="field"><span class="lbl">No reply yet (${t.pending.length})</span><span>${t.pending.map(esc).join(', ')}</span></div>`:'<span class="hint">Everyone on the player list has replied.</span>'}
    <div class="btns">
      ${t.pending.length&&!isClosed(p)?`<a class="btn ghost" href="${waHref(msgReminder(p,t))}" target="_blank" rel="noopener">Send reminder</a>`:''}
      <a class="btn wa ${t.pending.length&&!isClosed(p)?'':'full'}" href="${waHref(msgResults(p,t))}" target="_blank" rel="noopener">Post results</a>
    </div>
  </section>
  ${isOrg?`<section class="card">
    <div class="sec-h"><h2>Organizer</h2></div>
    <div class="btns">
      <button class="btn ghost" id="toggleclose">${p.closed?'Reopen poll':'Close poll'}</button>
      ${P.confirmDel?`<button class="btn danger" id="delok">Delete for good</button>`:`<button class="btn ghost" id="delpoll">Delete poll</button>`}
    </div>
    <p class="hint">Closing stops new replies. On the Day tab, “Fill from poll” marks everyone who said yes.</p>
  </section>`:''}`;
  $('#back').onclick=leavePoll;
  $('#cplink').onclick=()=>copyBtn(msgPoll(p));
  const co=$('#cpopts');if(co)co.onclick=()=>copyBtn(msgOptions(p));
  bindOrgGrid(v,p,t);
  const cm=$('#cantmake');if(cm)cm.onclick=()=>{if(!P.myName.trim()){toast('Choose your name first.');return}p.dates.forEach(dt=>P.myAns[dt.date]='no');renderPolls();saveVote()};
  const sel=$('#vname');
  if(sel){
    sel.onchange=()=>{const val=sel.value;if(val==='__other'){$('#vother').hidden=false;$('#vother').focus();P.myName='';}else{P.myName=val;$('#vother').hidden=true}
      P.myAns={};const m=t.voters.find(x=>x.name.trim().toLowerCase()===P.myName.toLowerCase());if(m)P.myAns={...(m.answers||{})};
      if(!isOrg)try{localStorage.setItem('ss-voter',P.myName)}catch(e){}
      renderPolls()};
    $('#vother').oninput=e=>{P.myName=e.target.value;if(!isOrg)try{localStorage.setItem('ss-voter',P.myName)}catch(e){}};
    v.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{
      if(!P.myName.trim()){toast(isOrg?'Choose the player first.':'Choose your name first.');sel.focus();return}
      const[date,val]=b.dataset.ans.split('|');P.myAns[date]=val;
      b.parentElement.querySelectorAll('[data-ans]').forEach(x=>x.setAttribute('aria-pressed',x===b));
      $('#vstat').textContent='Saving…';clearTimeout(P.saveT);P.saveT=setTimeout(saveVote,350);
    });
  }
  const tc=$('#toggleclose');if(tc)tc.onclick=async()=>{try{await pollsCol().doc(p.id).update({closed:!p.closed})}catch(e){toast('Could not update the poll ('+e.code+').')}};
  const dp=$('#delpoll');if(dp)dp.onclick=()=>{P.confirmDel=true;renderPolls()};
  const dk=$('#delok');if(dk)dk.onclick=async()=>{try{const ref=pollsCol().doc(p.id);const vs=await ref.collection('votes').get();await Promise.all(vs.docs.map(d=>d.ref.delete()));await ref.delete();leavePoll();toast('Poll deleted.')}catch(e){toast('Could not delete ('+e.code+').')}};
}
function orgGrid(p,t){
  const names=orderNames([...new Set([...S.roster,...t.voters.map(x=>x.name)])]);
  const ans=n=>{const m=t.voters.find(x=>x.name.trim().toLowerCase()===n.toLowerCase());return m?(m.answers||{}):{}};
  const out=n=>{const a=ans(n);return p.dates.length&&p.dates.every(dt=>a[dt.date]==='no')};
  return`<section class="card">
    <div class="sec-h"><h2>Record votes</h2><span class="hint" id="gstat"></span></div>
    <p class="hint">Tap the names who picked each option, e.g. from your WhatsApp poll’s “View votes”. “Both” voters go in every date.</p>
    ${p.dates.map(dt=>`<div class="field" style="gap:8px"><span style="font-weight:700">${esc(waOpt(dt))}</span><div class="chips">${names.map(n=>`<button class="chip small" data-g="${esc(n)}|${dt.date}" aria-pressed="${ans(n)[dt.date]==='yes'}">${esc(n)}</button>`).join('')}</div></div>`).join('')}
    <div class="field" style="gap:8px"><span style="font-weight:700">😭 Not available</span><div class="chips">${names.map(n=>`<button class="chip small" data-g="${esc(n)}|__out" aria-pressed="${out(n)}">${esc(n)}</button>`).join('')}</div></div>
  </section>`;
}
const gTimers={};
function bindOrgGrid(v,p,t){
  v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.g.lastIndexOf('|'),name=b.dataset.g.slice(0,i),key=b.dataset.g.slice(i+1);
    const prev=t.voters.find(x=>x.name.trim().toLowerCase()===name.toLowerCase());
    const a={...((prev&&prev.answers)||{})};
    const on=b.getAttribute('aria-pressed')!=='true';
    if(key==='__out'){p.dates.forEach(dt=>{if(on)a[dt.date]='no';else if(a[dt.date]==='no')delete a[dt.date]})}
    else{if(on)a[key]='yes';else delete a[key];
      // picking a date clears "not available"
      if(on)p.dates.forEach(dt=>{if(a[dt.date]==='no')delete a[dt.date]})}
    // optimistic local update so taps feel instant
    const nv={name,answers:a,updatedAt:Date.now()};P.votes=[...P.votes.filter(x=>x.name.trim().toLowerCase()!==name.toLowerCase()),nv];renderPolls();
    const st=$('#gstat');if(st)st.textContent='Saving…';
    clearTimeout(gTimers[name]);gTimers[name]=setTimeout(async()=>{
      try{await pollsCol().doc(p.id).collection('votes').doc('n-'+slug(name)).set(nv);const s2=$('#gstat');if(s2)s2.textContent='Saved'}
      catch(e){toast('Could not save '+firstName(name)+'’s vote ('+e.code+').')}
    },400);
  });
}
async function saveVote(){
  const p=P.sel;if(!p||!p.id)return;const name=P.myName.trim();
  try{
    let id;
    if(isOrg)id='n-'+slug(name);
    else{if(!auth.currentUser)await auth.signInAnonymously();id=auth.currentUser.uid}
    await pollsCol().doc(p.id).collection('votes').doc(id).set({name,answers:{...P.myAns},updatedAt:Date.now()});
    const s=$('#vstat');if(s)s.textContent=isOrg?'Saved for '+firstName(name):'Saved. Thanks, '+firstName(name)+'!';
  }catch(e){
    const s=$('#vstat');if(s)s.textContent='';
    toast(e.code==='permission-denied'?(isClosed(p)?'This poll is closed.':'Could not save your reply. Ask the organizer to check the poll rules.'):e.code==='auth/admin-restricted-operation'||e.code==='auth/operation-not-allowed'?'Voting isn’t switched on yet. Ask the organizer to enable Anonymous sign-in in Firebase.':'Could not save ('+(e.code||'error')+').');
  }
}
function pollForDate(date){return P.list.find(p=>!!(p.dates||[]).find(dt=>dt.date===date))}
async function fillFromPoll(date){
  const p=pollForDate(date);if(!p)return;
  try{
    const vs=await pollsCol().doc(p.id).collection('votes').get();
    const yes=latestByName(vs.docs.map(d=>d.data())).filter(v=>(v.answers||{})[date]==='yes').map(v=>v.name.trim());
    if(!yes.length)return toast('Nobody said yes for this date yet.');
    let added=false;yes.forEach(n=>{if(!S.roster.some(r=>r.toLowerCase()===n.toLowerCase())){S.roster.push(n);added=true}});if(added)saveConfig();
    const canon=yes.map(n=>S.roster.find(r=>r.toLowerCase()===n.toLowerCase())||n);
    const d=getDay(curDate);d.present=[...new Set([...d.present,...canon])];setDay(d);renderDay(false);
    toast('Marked '+canon.length+' players from the poll. Untick anyone who didn’t turn up.');
  }catch(e){toast('Could not read the poll ('+e.code+').')}
}

/* ---------- tabs & boot ---------- */
function go(t){tab=t;['day','polls','share','players'].forEach(k=>{$('#view-'+k).hidden=k!==t;$('#tab-'+k).setAttribute('aria-selected',k===t)});render(true);window.scrollTo(0,0)}
['day','polls','share','players'].forEach(k=>$('#tab-'+k).onclick=()=>{if(k==='share')shareSel=null;if(k==='polls'&&P.mode==='new'){}go(k)});
function render(full){
  if(tab==='day'){const a=document.activeElement;const typing=a&&a.tagName==='INPUT'&&$('#view-day').contains(a)&&a.type!=='checkbox';renderDay(full&&!typing)}
  else if(tab==='polls'){pollRender()}
  else if(tab==='share'){const img=$('#poster');renderShare()}
  else if(tab==='players'){const a=document.activeElement;if(!(a&&a.tagName==='INPUT'))renderPlayers()}
}
loadLocal();if(!S.roster.length)S.roster=[...DEFAULT_PLAYERS];render(true);setStatus('This phone only');

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

(function boot(){
  const configured=typeof firebase!=='undefined'&&FIREBASE_CONFIG.apiKey&&!FIREBASE_CONFIG.apiKey.startsWith('PASTE');
  if(!configured){
    const b=document.createElement('div');b.className='wrap';b.style.paddingTop='14px';
    b.innerHTML='<div class="setup"><b>Saving on this phone only.</b> Paste your Firebase config at the top of index.html to sync with the group.</div>';
    document.querySelector('main').prepend(b);return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  auth=firebase.auth();const ab=$('#authbtn');ab.hidden=false;
  readOnly=true;setStatus('Syncing…');
  auth.getRedirectResult().catch(e=>toast('Sign-in failed: '+(e.message||e.code)));
  ab.onclick=async()=>{
    if(isOrg){await auth.signOut();return}
    const prov=new firebase.auth.GoogleAuthProvider();
    try{await auth.signInWithPopup(prov)}
    catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'||e.code==='auth/cancelled-popup-request')auth.signInWithRedirect(prov);else if(e.code!=='auth/popup-closed-by-user')toast('Sign-in failed: '+(e.message||e.code))}
  };
  auth.onAuthStateChanged(u=>{
    isOrg=!!u&&!u.isAnonymous;readOnly=!isOrg;ab.textContent=isOrg?'Sign out':'Organizer sign in';
    document.body.classList.toggle('ro',readOnly);
    setStatus(isOrg?(u.displayName||u.email||'Signed in').split(' ')[0]+' · editing':'View only');
    if(isOrg&&!P.myName)P.myName='';
    settleRef&&settleRef();render(true);
  });
  startPollsListener();routeHash();window.addEventListener('hashchange',routeHash);
  let settleRef=null;
  let gotCfg=false,gotDays=false,cfgMissing=false;
  const settle=()=>{if(gotCfg&&gotDays){if(cfgMissing&&!readOnly){cfgMissing=false;saveConfig()}render(true)}};
  settleRef=settle;
  fsDoc('config/main').onSnapshot(s=>{
    if(busy('config/main'))return;
    if(!s.exists&&!s.metadata.fromCache)cfgMissing=true;
    if(s.exists){cfgMissing=false;const d=s.data();S.roster=Array.isArray(d.roster)?[...d.roster]:[];S.rate=+d.rate||300;S.courts=+d.courts||1;saveLocal()}
    gotCfg=true;settle();
  },e=>{setStatus('Not synced');toast('Could not load shared data ('+e.code+'). Check the Firestore rules.')});
  db.collection(COLLECTION_PREFIX+'days').onSnapshot(q=>{
    const next={};q.docs.forEach(doc=>{const d=doc.data();next[doc.id]=Object.assign(blankDay(doc.id),JSON.parse(JSON.stringify(d)))});
    Object.keys(S.days).forEach(k=>{if(busy('days/'+k))next[k]=S.days[k]});
    Object.keys(pending).forEach(p=>{if(p.startsWith('days/')&&pending[p]===null)delete next[p.slice(5)]});
    S.days=next;saveLocal();gotDays=true;settle();
  },e=>setStatus('Not synced'));
})();
})();
</script>
