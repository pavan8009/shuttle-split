<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shuttle Split</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Vote, play, split and settle up: badminton costs shared fairly.">
<meta property="og:title" content="Shuttle Split · Badminton Family">
<meta property="og:description" content="Vote for games, see your share and pay by UPI.">
<meta property="og:image" content="https://pavan8009.github.io/shuttle-split/og-thumb.png">
<meta property="og:image:width" content="256"><meta property="og:image:height" content="256">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app bar → page intro → 3 KPI tiles → stacked cards made of aligned rows → fixed tab bar */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --field:#F2F4F3; --ink:#101828; --muted:#667085; --line:#E4E7EC; --line2:#EEF0F3;
  --accent:#0B7A4E; --accent-ink:#FFFFFF; --soft:#E3F2EA; --pop:#FFD23F; --pop-ink:#1A1A1A;
  --danger:#D92D20; --ok:#079455;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --rs:11px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){:root{
  --surface:#171A1C; --field:#22262A; --ink:#F2F4F7; --muted:#98A2B3; --line:#2B3035; --line2:#24282C; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---- app bar ---- */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar .wrap{display:flex;align-items:center;gap:10px;height:58px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .ic{width:18px;height:18px}
.brand{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.brand b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:12px;color:var(--muted);font-weight:600}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.status .ic{width:15px;height:15px}
.status.org{background:var(--soft);border-color:transparent;color:var(--accent)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---- page ---- */
main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:12px;padding-block:18px 24px}
.intro h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.intro p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:46ch}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.kpi span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hl span{color:inherit;opacity:.8}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.card-h .ico{width:32px;height:32px;border-radius:9px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.card-h .ico .ic{width:18px;height:18px}
.card-h h2{margin:0;font-size:15.5px;font-weight:800;flex:1;min-width:0}
.card-h .meta{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.card-h .meta.strong{color:var(--accent)}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:9px 16px;border-top:1px solid var(--line2)}
.row:first-child{border-top:0}
.row .l{display:flex;flex-direction:column;min-width:0;flex:1}
.row .l b{font-weight:700;font-size:15px}
.row .l small{color:var(--muted);font-size:12.5px;line-height:1.35}
.row .v{font-weight:800;white-space:nowrap}
.sub{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.sublbl{font-size:12px;font-weight:700;color:var(--muted)}
.card-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line2);flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* ---- controls ---- */
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--rs);height:42px;flex:none;background:var(--surface)}
.stp button{width:42px;height:40px;display:grid;place-items:center;color:var(--accent)}
.stp button .ic{width:18px;height:18px;stroke-width:2.4}
.stp output{min-width:62px;text-align:center;font-weight:800;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:40px}
.amt{display:flex;align-items:center;background:var(--field);border:1px solid transparent;border-radius:var(--rs);height:42px;width:132px;flex:none}
.amt:focus-within{border-color:var(--accent);background:var(--surface)}
.amt span{padding-left:12px;color:var(--muted);font-weight:700}
.amt input{border:0;background:transparent;outline:none;width:100%;min-width:0;text-align:right;padding:0 12px 0 4px;font-weight:800;font-size:16px}
.txt{width:100%;min-width:0;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:0 12px;font-size:16px;outline:none}
.txt:focus{border-color:var(--accent)}
select.txt{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.inline{display:flex;gap:8px}
.inline .txt{flex:1}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;margin:0;width:50px;height:30px;border-radius:999px;background:var(--line);cursor:pointer;transition:background .2s}
.switch input:checked{background:var(--accent)}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s;pointer-events:none}
.switch input:checked + i{transform:translateX(20px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 16px;border-radius:12px;font-weight:800;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn.sm{height:38px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.line{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.wa{background:#1FA855;color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .full{grid-column:1/-1}
.lnk{color:var(--accent);font-weight:700;font-size:13.5px;padding:6px 0}
.lnk.danger{color:var(--danger)}

/* player tiles: equal-width grid so everything lines up */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px;min-width:0}
.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ic{width:15px;height:15px;stroke-width:2.8;display:none}
.tile.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.on .ic{display:block}
.tile.out{background:var(--field);color:var(--muted);text-decoration:line-through;border-style:dashed}
.tiles.sm .tile{height:38px;font-size:13px}
fieldset{border:0;margin:0;padding:0;min-width:0;display:contents}
fieldset:disabled .tile,fieldset:disabled .stp,fieldset:disabled .amt,fieldset:disabled .switch{opacity:.55}

/* week strip */
.wk-h{display:flex;align-items:center;gap:8px;padding:12px 12px 4px 16px}
.wk-h b{flex:1;font-size:15px;font-weight:800}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);position:relative;flex:none}
.iconbtn .ic{width:18px;height:18px}
.iconbtn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:8px 12px 12px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:12px}
.day small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day b{font-size:17px;font-weight:800}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.has i{background:var(--accent)}
.day.today b{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel small,.day.sel b{color:inherit}
.day.sel i{background:var(--accent-ink)}

/* notice */
.note{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--pop) 30%,var(--surface));font-size:13.5px;font-weight:600;border:1px solid color-mix(in srgb,var(--pop) 60%,transparent)}
.note .ic{width:18px;height:18px}
.note p{margin:0;flex:1}
.warn{margin:0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--pop) 30%,var(--surface));font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* split / tables */
.split{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line2)}
.prow:first-child{border-top:0}
.ini{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:12px}
.prow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:normal;line-height:1.35}
.prow .am{font-weight:800}
.tot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--soft);font-weight:800}
.tot b{font-size:18px;color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line2)}
th{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:0;background:var(--field)}
th:first-child,td:first-child{text-align:left;padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
td.t{font-weight:800;color:var(--accent)}
tfoot td{font-weight:800;background:var(--soft)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;flex:none}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chk{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
label.row{cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--field);color:var(--muted);white-space:nowrap}
.badge.on{background:var(--soft);color:var(--accent)}
.badge.solid{background:var(--accent);color:var(--accent-ink)}
.badge .ic{width:13px;height:13px}
.chev{color:var(--muted)}
.poster img{display:block;width:100%;border-top:1px solid var(--line2)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty .ic{width:34px;height:34px;display:block;margin:0 auto 8px;stroke-width:1.5}

/* team */
.profile{display:flex;align-items:center;gap:14px;padding:16px}
.gphoto{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;flex:none;position:relative}
.gphoto img{width:100%;height:100%;object-fit:cover}
.gphoto .ic{width:30px;height:30px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:12px 16px 14px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.sw i{width:100%;max-width:56px;aspect-ratio:1;border-radius:14px;display:block;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw[aria-pressed="true"]{color:var(--ink)}
.sw[aria-pressed="true"] i{border-color:var(--ink)}

/* polls */
.vote{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.vote button{height:40px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:13.5px}
.vote button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.nm-chip{height:28px;padding:0 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center}
.nm-chip.maybe{background:transparent;border:1px dashed var(--accent)}
.cta{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cta .pad h2{margin:0;font-size:18px;font-weight:800}
.cta .pad p{margin:0;opacity:.85;font-size:13.5px}
.cta .btn{background:var(--accent-ink);color:var(--accent)}

/* tab bar + toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(6,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11px;font-weight:700;color:var(--muted)}
.tabbar button .ic{width:23px;height:23px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] .ic{stroke-width:2.3}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
/* reminders */
.rem{display:flex;flex-direction:column;gap:10px;padding:12px 16px;border-top:1px solid var(--line2)}
.rem:first-of-type{border-top:0}
.rem-h b{display:block;font-size:15px}.rem-h small{color:var(--muted);font-size:12.5px}
.rem details summary{font-size:13px;font-weight:700;color:var(--accent);cursor:pointer}
.msgpre{white-space:pre-wrap;font:13px/1.45 var(--font);background:var(--field);border-radius:10px;padding:10px 12px;margin:8px 0 0}
textarea.tpl{height:auto;min-height:140px;padding:10px 12px;font-size:14px;line-height:1.45;resize:vertical}
.tabbar button{position:relative}
/* sub-navigation inside a page */
.subnav{display:flex;gap:4px;padding:4px;background:var(--field);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:1 0 auto;padding:9px 12px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.subnav button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.nb{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;font-style:normal;display:inline-grid;place-items:center;line-height:1}
.view>[data-in]{display:contents}.view>[data-in][hidden]{display:none!important}
/* settings-style menu */
.menu .mi{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;border-top:1px solid var(--line2)}
.menu .mi:first-of-type{border-top:0}
.mi .mico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--accent);flex:none}
.mi .mico .ic{width:20px;height:20px}
.mi .mt{flex:1;min-width:0}.mi .mt b{display:block;font-size:15px}.mi .mt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.mi .mm{font-size:12.5px;font-weight:700;color:var(--muted);text-align:right;white-space:nowrap}
.mi>.ic{width:18px;height:18px;color:var(--muted);flex:none}
.backbar{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--accent);align-self:flex-start;padding:4px 0}
.backbar .ic{width:18px;height:18px}
.todo{position:relative;margin-right:6px}.std th:nth-child(2),.std td:nth-child(2){text-align:left}
.brand{min-width:0;flex:1}.brand b,.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){.status{font-size:0!important;gap:0!important;padding:0 11px!important}.status .dot{width:9px;height:9px}.status .ic{width:18px;height:18px}.mebtn,.todo{margin-right:2px}}.mebtn{margin-right:6px;font-weight:800;font-size:13px}.mebtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bracket{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 16px}.bracket .rnd{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:205px}
.bracket .rnd>b{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.mcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);text-align:left;width:100%}
.mcard .ms{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:13.5px}.mcard .ms+.ms{border-top:1px solid var(--line2)}.mcard .ms.w{font-weight:800;color:var(--accent)}
.dsum{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;list-style:none}.dsum::-webkit-details-marker{display:none}.dsum .dt{flex:1;min-width:0}.dsum .dt b{display:block;font-size:15.5px}.dsum .dt small{color:var(--muted);font-size:12.5px}
.dsum .chev .ic{width:18px;height:18px;color:var(--muted);transition:transform .15s}details[open]>.dsum .chev .ic{transform:rotate(90deg)}
.sub2{border-top:1px solid var(--line2)}.sub2>summary{padding:11px 16px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--accent)}

      case'dr':editDay(d=>{d.drinksSkip=d.drinksSkip.includes(val)?d.drinksSkip.filter(x=>x!==val):[...d.drinksSkip,val]});break;

    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(i,0,0,w,h);

function slotHours(t){const m=String(t||'').match(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?\s*(?:-|–|to)\s*(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?/i);if(!m)return 0;
  let a=+m[1]+(+m[2]||0)/60,b=+m[4]+(+m[5]||0)/60;if((m[3]||'').toLowerCase()==='pm'&&a<12)a+=12;if((m[6]||'').toLowerCase()==='pm'&&b<12)b+=12;
  if(!m[3]&&(m[6]||'').toLowerCase()==='pm'&&a<12&&a+12<=b)a+=12;let d=b-a;while(d<=0)d+=12;while(d>12)d-=12;return r2(d)}

function boardHours(date){if(typeof S==='undefined'||!S.board)return 0;const d=boardDays().find(x=>x.date===date);return d?r2((d.slots||[]).reduce((a,x)=>a+slotHours(x.t)*(+x.c||0),0)):0}

  if(act==='share'){const t=reqText(open);if(navigator.share){try{await navigator.share({text:t})}catch(e){}}else copyText(t,'Copied.');return}
  if(act==='img'&&r)return sheetOpen(`<div class="sheet-h"><span class="ini">${ic('image')}</span><div><b>Screenshot</b><small>${esc(r.name||'')} · ${timeAgo(r.at)}</small></div><button class="iconbtn" id="whoclose" aria-label="Close">${ic('x')}</button></div><img src="${r.img}" alt="Screenshot" style="width:100%;display:block">`,'Screenshot');

const VOTE_UNSUB={},VOTES_BY={};let SEEN_UNSUB=null,orgTick=null;
function orgChanged(){clearTimeout(orgTick);orgTick=setTimeout(()=>{PDATA.votes=Object.values(VOTES_BY).flat();PDATA.at=Date.now();autoInactive();autoBillFromPolls();

/* organizers get votes and app opens live, so every organizer sees the same numbers */
async function loadOrgData(force){
  if(!db)return;
  if(isOrg&&!SEEN_UNSUB)SEEN_UNSUB=col('seen').onSnapshot(q=>{SEEN=q.docs.map(d=>({uid:d.id,...d.data()}));orgChanged()},()=>{SEEN_UNSUB=null});
  const want=P.list.filter(p=>isOrg||!isClosed(p)),ids=new Set(want.map(p=>p.id));
  want.forEach(pl=>{if(VOTE_UNSUB[pl.id])return;VOTE_UNSUB[pl.id]=pollsCol().doc(pl.id).collection('votes').onSnapshot(q=>{VOTES_BY[pl.id]=q.docs.map(d=>({poll:pl.id,id:d.id,...d.data()}));orgChanged()},()=>{delete VOTE_UNSUB[pl.id]})});
  Object.keys(VOTE_UNSUB).forEach(id=>{if(!ids.has(id)){VOTE_UNSUB[id]();delete VOTE_UNSUB[id];delete VOTES_BY[id]}});
  if(force)orgChanged();
}
/* newcomers (names seen in polls, days or payments that aren't on the team) + likely duplicates */
function attention(){
  const rk=new Set(S.roster.map(nkey)),ig=new Set(S.ignored||[]),src={};
  PDATA.votes.forEach(v=>{if(v.name)src[nkey(v.name)]=src[nkey(v.name)]||{n:tcase(v.name),from:'Voted in a poll'}});
  Object.values(S.days).forEach(d=>(d.present||[]).forEach(n=>{src[nkey(n)]=src[nkey(n)]||{n,from:'Recorded on a game day'}}));
  allPays().forEach(x=>{src[nkey(x.name)]=src[nkey(x.name)]||{n:x.name,from:'Has a payment'}});
  const fresh=Object.entries(src).filter(([k])=>!rk.has(k)&&!ig.has(k)).map(([k,v])=>({...v,match:(suggest(v.n,S.roster).find(x=>x.s>=45&&x.s<100)||{}).n}));
  const dups=[];const R=S.roster;
  for(let i=0;i<R.length;i++)for(let j=i+1;j<R.length;j++){const pair=nkey(R[i])+'|'+nkey(R[j]);if(ig.has(pair))continue;
    const sc=(suggest(R[j],[R[i]])[0]||{}).s||0;if(sc>=45&&sc<100)dups.push([R[i],R[j]])}
  return{fresh,dups};
}
/* adoption: has the player opened the app, do they vote and pay through it */
/* last sign of life for a player: opened the app, played, voted or paid */
function lastActivity(n){const k=nkey(n);let t=0;
  SEEN.forEach(x=>{if(nkey(x.name)===k&&x.at>t)t=x.at});
  Object.keys(S.days).forEach(ds=>{const d=S.days[ds];if((d.present||[]).some(x=>nkey(x)===k)){const ms=new Date(ds+'T20:00').getTime();if(ms>t)t=ms}});
  PDATA.votes.forEach(v=>{if(nkey(v.name)===k&&(v.updatedAt||0)>t)t=v.updatedAt});
  allPays().forEach(x=>{if(nkey(x.name)===k&&(x.at||0)>t)t=x.at});return t}
/* players with no activity for N weeks go inactive automatically, and come back the moment they're active again */
function autoInactive(){
  if(!isOrg||!PDATA.at||!CFG_READY||!DAYS_READY)return;const wk=+S.idleWeeks||0;let changed=false,quiet=false;const now=Date.now();
  S.since=S.since||{};S.autoOff=S.autoOff||{};S.inactive=S.inactive||[];
  S.roster.forEach(n=>{const k=nkey(n);if(!S.since[k]){S.since[k]=now;quiet=true}});
  Object.keys(S.autoOff).forEach(k=>{const n=S.roster.find(r=>nkey(r)===k);if(!n){delete S.autoOff[k];changed=true;return}
    if(lastActivity(n)>S.autoOff[k]){delete S.autoOff[k];S.inactive=S.inactive.filter(x=>x!==k);changed=true;toast(first(n)+' is back. Marked active again.')}});
  if(wk>0)S.roster.forEach(n=>{const k=nkey(n);if(S.inactive.includes(k))return;
    const last=Math.max(lastActivity(n),S.since[k]||now);if(now-last>wk*7*864e5){S.inactive.push(k);S.autoOff[k]=now;changed=true}});
  if(changed){saveConfig();if(tab==='team'&&!typingIn('#view-team'))renderTeam()}else if(quiet)saveConfig();
}
function adoption(){
  const seen={};SEEN.forEach(x=>{const k=nkey(x.name);if(!seen[k]||x.at>seen[k])seen[k]=x.at});
  const me=nkey(getMe()),selfV={},orgV={};PDATA.votes.forEach(v=>{const k=nkey(v.name);const own=!String(v.id).startsWith('n-')||v.self||(isOrg&&me&&k===me);if(own)selfV[k]=(selfV[k]||0)+1;else orgV[k]=(orgV[k]||0)+1});
  const appPaid={};allPays().forEach(x=>{if(x.by==='player'||x.method==='self')appPaid[nkey(x.name)]=(appPaid[nkey(x.name)]||0)+1});
  const rows=activeRoster().map(n=>{const k=nkey(n),sv=selfV[k]||0,ov=orgV[k]||0,pp=appPaid[k]||0,on=!!seen[k]||sv>0||pp>0;
    const stage=sv||pp?3:on?2:1;return{n,k,on,last:seen[k]||0,sv,ov,pp,stage,lvl:levelOf(n)}});
  const idle=Object.keys(S.autoOff||{}).map(k=>{const n=S.roster.find(r=>nkey(r)===k);return n?{n,k,since:S.autoOff[k],act:lastActivity(n)}:null}).filter(Boolean);
  const pct=f=>rows.length?Math.round(rows.filter(f).length*100/rows.length):0;
  const byLvl=[...LEVELS.map(l=>[l[1],l[2],rows.filter(r=>r.lvl&&r.lvl[0]===l[0])]),['Not set','#98A2B3',rows.filter(r=>!r.lvl)]].filter(x=>x[2].length);
  return{rows,idle,joined:pct(r=>r.on),voting:pct(r=>r.sv>0),paying:pct(r=>r.pp>0),byLvl};
}

    toast(e.code==='permission-denied'?(isClosed(p)?'This poll is closed.':'Couldn’t save your vote. Ask the organizer to check the poll rules.'):(e.code==='auth/admin-restricted-operation'||e.code==='auth/operation-not-allowed')?'Voting isn’t switched on yet. Ask the organizer to enable Anonymous sign-in in Firebase.':'Couldn’t save ('+(e.code||'error')+').')}
}
function pollForDate(date){return P.list.find(p=>(p.dates||[]).some(dt=>dt.date===date))}
async function fillFromPoll(date){const p=pollForDate(date);if(!p)return;
  try{const vs=await pollsCol().doc(p.id).collection('votes').get();
    const yes=latestByName(vs.docs.map(d=>d.data())).filter(v=>(v.answers||{})[date]==='yes').map(v=>norm(v.name));
    if(!yes.length)return toast('Nobody voted yes for this date yet.');
    let added=false;const canonN=yes.map(n=>{const c=S.roster.find(r=>nkey(r)===nkey(n));if(c)return c;const t=tcase(n);S.roster.push(t);added=true;return t});if(added)saveConfig();
    editDay(d=>{d.present=uniq([...d.present,...canonN])});toast('Ticked '+canonN.length+' players from the poll. Untick anyone who didn’t come.')}
  catch(e){toast('Couldn’t read the poll ('+e.code+').')}}

/* ================= navigation & boot ================= */
function go(t){if(t==='me'){SUB.pay='mine';t='pay'}closeWho();if(t!=='team'&&teamUI)teamUI.page='';tab=t;if((t==='team'||t==='day')&&isOrg)loadOrgData(false);document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  ['day','polls','pay','cup','club','me','team'].forEach(k=>$('#view-'+k).hidden=k!==t);if(t==='club')clubSeen();renderTab(true);window.scrollTo(0,0)}
document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='pay'&&tab!=='pay'&&pay.range==='day'){pay.range='last';pay.off.clear()}go(b.dataset.tab)});
function typingIn(id){const a=document.activeElement;return!!a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&$(id).contains(a)&&a.type!=='checkbox'&&a.type!=='file'}
let STALE=false;
function renderTab(force){
  renderHeader();
  if(!force&&tab!=='day'&&tab!=='polls'&&typingIn('#view-'+tab)){STALE=true;return}
  if(tab==='day'){if(force||!typingIn('#view-day'))renderDay();else{refreshDay();STALE=true}}
  else if(tab==='polls')pollRender();
  else if(tab==='pay')renderPay();
  else if(tab==='me')renderMe();
  else if(tab==='club')renderClub();
  else if(tab==='cup')renderCup();
  else if(tab==='team'){if(force||!typingIn('#view-team'))renderTeam()}
}
async function signIn(){if(!auth)return;const prov=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(prov)}catch(e){
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))auth.signInWithRedirect(prov);
    else if(e.code!=='auth/popup-closed-by-user')toast('Sign-in failed: '+(e.message||e.code))}}
$('#status').onclick=()=>{if(isOrg||userEmail())go('team');else signIn()};

loadLocal();if(!S.roster.length&&!GID)S.roster=[...DEFAULT_PLAYERS];
/* each group installs with its own link */
if(GID){try{const abs=u=>new URL(u,location.href).href;const m={share_target:{action:abs('./share-target')+'?g='+encodeURIComponent(GID),method:'POST',enctype:'multipart/form-data',params:{title:'title',text:'text',url:'url',files:[{name:'media',accept:['image/*']}]}},name:'Shuttle Split',short_name:'Shuttle Split',start_url:HERE,scope:abs('./'),display:'standalone',background_color:'#F3F5F4',theme_color:'#0B7A4E',icons:[{src:abs('icon-192.png'),sizes:'192x192',type:'image/png'},{src:abs('icon-512.png'),sizes:'512x512',type:'image/png'}]};
  const l=document.querySelector('link[rel=manifest]');if(l)l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))}catch(e){}}
applySkin();bindDay();bindTeam();renderTab(true);
if('serviceWorker' in navigator)window.addEventListener('load',()=>{const had=!!navigator.serviceWorker.controller;let done=false;
  navigator.serviceWorker.register('sw.js').then(reg=>{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});setInterval(()=>reg.update().catch(()=>{}),30*60e3)}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||done)return;done=true;if(!document.querySelector('#whosheet')&&!document.activeElement.matches('input,textarea,select'))location.reload();else toast('A new version is ready. Close and reopen the app to update.')})});

(function boot(){
  const ok=typeof firebase!=='undefined'&&FIREBASE_CONFIG.apiKey&&!/^PASTE/.test(FIREBASE_CONFIG.apiKey);
  if(!ok)return;
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  auth=firebase.auth();
  let cfgMissing=false,authInit=false;
  auth.getRedirectResult().catch(e=>toast('Sign-in failed: '+(e.message||e.code)));
  auth.onAuthStateChanged(u=>{const changed=computeOrg();
    if(!authInit||changed){authInit=true;renderTab(true);if(isOrg&&cfgMissing){cfgMissing=false;saveConfig()}}else renderHeader();
    if(isOrg){loadOrgData(true);startRequests();startPrivate()}});
  if(GID)db.doc(COLLECTION_PREFIX+'groups/'+GID).onSnapshot(s=>{
    if(!s.exists&&!s.metadata.fromCache){GROUP_MISSING=true;renderHeader();return}
    if(s.exists){GROUP=s.data();GROUP_MISSING=false;if(!S.groupName)S.groupName=GROUP.name||'';rememberGroup();if(computeOrg()){renderTab(true);if(isOrg)loadOrgData(true)}else renderHeader()}},()=>{});
  fsDoc('config/main').onSnapshot(s=>{if(busy('config/main'))return;
    if(!s.metadata.fromCache)CFG_READY=true;
    if(!s.exists&&!s.metadata.fromCache){cfgMissing=true;if(isOrg){cfgMissing=false;saveConfig()}}
    if(s.exists&&!s.metadata.hasPendingWrites)CFG_CLOUD=JSON.parse(JSON.stringify(s.data()));
    if(s.exists){const d=s.data();if(Array.isArray(d.roster))S.roster=[...d.roster];S.rate=+d.rate||300;S.groupName=d.groupName||'';S.upiId=d.upiId||'';S.upiName=d.upiName||'';S.levels=d.levels&&typeof d.levels==='object'?d.levels:{};S.admins=Array.isArray(d.admins)?d.admins:[];S.inactive=Array.isArray(d.inactive)?d.inactive:[];S.ignored=Array.isArray(d.ignored)?d.ignored:[];S.openNames=d.openNames!==false;S.idleWeeks=d.idleWeeks==null?4:+d.idleWeeks;S.since=d.since||{};S.autoOff=d.autoOff||{};S.billed=Array.isArray(d.billed)?d.billed:[];S.msg=d.msg||null;S.sent=d.sent||{};S.board=d.board&&typeof d.board==='object'?d.board:null;S.dupOk=Array.isArray(d.dupOk)?d.dupOk:[];S.model=d.model==='pre'?'pre':'post';S.load=+d.load||1000;S.low=d.low==null?200:+d.low;setTimeout(autoInactive,0);S.skin=SKINS[d.skin]?d.skin:'court';applySkin();saveLocal();if(GID)rememberGroup();if(computeOrg())renderTab(true)}
    renderTab(false)},e=>toast('Couldn’t load shared data ('+e.code+').'));
  fsDoc('config/photo').onSnapshot(s=>{if(busy('config/photo'))return;photo=s.exists?(s.data().data||''):'';try{photo?localStorage.setItem(LSP,photo):localStorage.removeItem(LSP)}catch(e){}renderHeader();if(tab==='team'&&!typingIn('#view-team'))renderTeam()},()=>{});
  col('days').onSnapshot(q=>{
    const next={};q.docs.forEach(doc=>next[doc.id]=normDay(doc.data(),doc.id));
    Object.keys(S.days).forEach(k=>{if(busy('days/'+k))next[k]=S.days[k]});
    Object.keys(pending).forEach(p=>{if(p.startsWith('days/')&&pending[p]===null)delete next[p.slice(5)]});
    S.days=next;if(!q.metadata||!q.metadata.fromCache)DAYS_READY=true;saveLocal();renderTab(false);autoInactive()},()=>{});
  payCol().onSnapshot(q=>{PAYS=q.docs.map(d=>({id:d.id,...d.data()}));if(!typingIn('#view-day')&&!typingIn('#view-team')&&!typingIn('#view-me'))renderTab(false);else STALE=true},()=>{});
  document.addEventListener('focusout',()=>setTimeout(()=>{if(STALE&&!typingIn('#view-'+tab)){STALE=false;renderTab(false)}},120));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){renderTab(false);syncUI()}});
  startPollsListener();startProfiles();routeHash();setTimeout(()=>{startClub();startComments()},tab==='club'||tab==='cup'?0:1200);setTimeout(startRequests,1200);setTimeout(takeShared,1600);window.addEventListener('hashchange',routeHash);
  setTimeout(()=>pingSeen(false),1500);startUse();
})();
})();
