<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shuttle Split</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app bar → page intro → 3 KPI tiles → stacked cards made of aligned rows → fixed tab bar */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --field:#F2F4F3; --ink:#101828; --muted:#667085; --line:#E4E7EC; --line2:#EEF0F3;
  --accent:#0B7A4E; --accent-ink:#FFFFFF; --soft:#E3F2EA; --pop:#FFD23F; --pop-ink:#1A1A1A;
  --danger:#D92D20; --ok:#079455;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --rs:11px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){:root{
  --surface:#171A1C; --field:#22262A; --ink:#F2F4F7; --muted:#98A2B3; --line:#2B3035; --line2:#24282C; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---- app bar ---- */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar .wrap{display:flex;align-items:center;gap:10px;height:58px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .ic{width:18px;height:18px}
.brand{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.brand b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:12px;color:var(--muted);font-weight:600}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.status .ic{width:15px;height:15px}
.status.org{background:var(--soft);border-color:transparent;color:var(--accent)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---- page ---- */
main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:12px;padding-block:18px 24px}
.intro h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.intro p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:46ch}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.kpi span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hl span{color:inherit;opacity:.8}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.card-h .ico{width:32px;height:32px;border-radius:9px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.card-h .ico .ic{width:18px;height:18px}
.card-h h2{margin:0;font-size:15.5px;font-weight:800;flex:1;min-width:0}
.card-h .meta{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.card-h .meta.strong{color:var(--accent)}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:9px 16px;border-top:1px solid var(--line2)}
.row:first-child{border-top:0}
.row .l{display:flex;flex-direction:column;min-width:0;flex:1}
.row .l b{font-weight:700;font-size:15px}
.row .l small{color:var(--muted);font-size:12.5px;line-height:1.35}
.row .v{font-weight:800;white-space:nowrap}
.sub{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.sublbl{font-size:12px;font-weight:700;color:var(--muted)}
.card-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line2);flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* ---- controls ---- */
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--rs);height:42px;flex:none;background:var(--surface)}
.stp button{width:42px;height:40px;display:grid;place-items:center;color:var(--accent)}
.stp button .ic{width:18px;height:18px;stroke-width:2.4}
.stp output{min-width:62px;text-align:center;font-weight:800;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:40px}
.amt{display:flex;align-items:center;background:var(--field);border:1px solid transparent;border-radius:var(--rs);height:42px;width:132px;flex:none}
.amt:focus-within{border-color:var(--accent);background:var(--surface)}
.amt span{padding-left:12px;color:var(--muted);font-weight:700}
.amt input{border:0;background:transparent;outline:none;width:100%;min-width:0;text-align:right;padding:0 12px 0 4px;font-weight:800;font-size:16px}
.txt{width:100%;min-width:0;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:0 12px;font-size:16px;outline:none}
.txt:focus{border-color:var(--accent)}
select.txt{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.inline{display:flex;gap:8px}
.inline .txt{flex:1}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;margin:0;width:50px;height:30px;border-radius:999px;background:var(--line);cursor:pointer;transition:background .2s}
.switch input:checked{background:var(--accent)}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s;pointer-events:none}
.switch input:checked + i{transform:translateX(20px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 16px;border-radius:12px;font-weight:800;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn.sm{height:38px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.line{border:1px solid var(--line);background:var(--surface)}
.btn.wa{background:#1FA855;color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .full{grid-column:1/-1}
.lnk{color:var(--accent);font-weight:700;font-size:13.5px;padding:6px 0}
.lnk.danger{color:var(--danger)}

/* player tiles: equal-width grid so everything lines up */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px;min-width:0}
.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ic{width:15px;height:15px;stroke-width:2.8;display:none}
.tile.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.on .ic{display:block}
.tile.out{background:var(--field);color:var(--muted);text-decoration:line-through;border-style:dashed}
.tiles.sm .tile{height:38px;font-size:13px}
fieldset{border:0;margin:0;padding:0;min-width:0;display:contents}
fieldset:disabled .tile,fieldset:disabled .stp,fieldset:disabled .amt,fieldset:disabled .switch{opacity:.55}

/* week strip */
.wk-h{display:flex;align-items:center;gap:8px;padding:12px 12px 4px 16px}
.wk-h b{flex:1;font-size:15px;font-weight:800}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);position:relative;flex:none}
.iconbtn .ic{width:18px;height:18px}
.iconbtn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:8px 12px 12px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:12px}
.day small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day b{font-size:17px;font-weight:800}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.has i{background:var(--accent)}
.day.today b{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel small,.day.sel b{color:inherit}
.day.sel i{background:var(--accent-ink)}

/* notice */
.note{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--pop) 30%,var(--surface));font-size:13.5px;font-weight:600;border:1px solid color-mix(in srgb,var(--pop) 60%,transparent)}
.note .ic{width:18px;height:18px}
.note p{margin:0;flex:1}
.warn{margin:0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--pop) 30%,var(--surface));font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* split / tables */
.split{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line2)}
.prow:first-child{border-top:0}
.ini{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:12px}
.prow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.prow .am{font-weight:800}
.tot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--soft);font-weight:800}
.tot b{font-size:18px;color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line2)}
th{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:0;background:var(--field)}
th:first-child,td:first-child{text-align:left;padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
td.t{font-weight:800;color:var(--accent)}
tfoot td{font-weight:800;background:var(--soft)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;flex:none}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chk{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
label.row{cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--field);color:var(--muted);white-space:nowrap}
.badge.on{background:var(--soft);color:var(--accent)}
.badge.solid{background:var(--accent);color:var(--accent-ink)}
.badge .ic{width:13px;height:13px}
.chev{color:var(--muted)}
.poster img{display:block;width:100%;border-top:1px solid var(--line2)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty .ic{width:34px;height:34px;display:block;margin:0 auto 8px;stroke-width:1.5}

/* team */
.profile{display:flex;align-items:center;gap:14px;padding:16px}
.gphoto{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;flex:none;position:relative}
.gphoto img{width:100%;height:100%;object-fit:cover}
.gphoto .ic{width:30px;height:30px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:12px 16px 14px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.sw i{width:100%;max-width:56px;aspect-ratio:1;border-radius:14px;display:block;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw[aria-pressed="true"]{color:var(--ink)}
.sw[aria-pressed="true"] i{border-color:var(--ink)}

/* polls */
.vote{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.vote button{height:40px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:13.5px}
.vote button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.nm-chip{height:28px;padding:0 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center}
.nm-chip.maybe{background:transparent;border:1px dashed var(--accent)}
.cta{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cta .pad h2{margin:0;font-size:18px;font-weight:800}
.cta .pad p{margin:0;opacity:.85;font-size:13.5px}
.cta .btn{background:var(--accent-ink);color:var(--accent)}

/* tab bar + toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tabbar button .ic{width:23px;height:23px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] .ic{stroke-width:2.3}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
/* tappable names + personal breakdown sheet */
.who{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:3px}
.who .ic{width:14px;height:14px;stroke-width:2.4}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .2s ease}
.sheet-h{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-h .ini{width:42px;height:42px;font-size:15px}
.sheet-h div{flex:1;min-width:0}
.sheet-h b{display:block;font-size:18px;font-weight:800}
.sheet-h small{color:var(--muted);font-size:13px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.btable td,.btable th{padding:11px 10px}
.btable td:first-child{font-weight:700}
.btable small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.btable td.zero{color:var(--muted)}
.how{padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line2)}
.how div{font-size:13px;color:var(--muted);line-height:1.5}
.how div b{color:var(--ink)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.amt{width:118px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/><rect x="3" y="8" width="18" height="12" rx="2.5"/><circle cx="16.5" cy="14" r="1.3"/></symbol>

  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></symbol>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);

const plural=(n,w)=>n+' '+w+(n===1?'':'s');

/* ---------- themes ---------- */
const SKINS={
  court:{name:'Court',accent:'#0B7A4E',ink:'#FFFFFF',pop:'#FFD23F',popInk:'#1A1A1A',bg:'#F3F5F4'},
  smash:{name:'Smash',accent:'#D92D45',ink:'#FFFFFF',pop:'#1E2A5E',popInk:'#FFFFFF',bg:'#F7F4F4'},
  ocean:{name:'Ocean',accent:'#1F4FD1',ink:'#FFFFFF',pop:'#F6BE2C',popInk:'#1A1A1A',bg:'#F3F5F9'},
  sunset:{name:'Sunset',accent:'#7B3FE4',ink:'#FFFFFF',pop:'#FF8A3D',popInk:'#1A1A1A',bg:'#F5F4F9'},
  mono:{name:'Mono',accent:'#111111',ink:'#FFFFFF',pop:'#111111',popInk:'#FFFFFF',bg:'#F4F4F4'}

function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v*t+B[i]*(1-t)).toString(16).padStart(2,'0')).join('')}
function skinColors(){const k=SKINS[S.skin]?S.skin:'court',s={...SKINS[k]};
  if(darkMQ.matches){if(k==='mono'){s.accent='#F2F2F2';s.ink='#111111';s.pop='#F2F2F2';s.popInk='#111111'}s.bg='#0E1012';s.soft=mix(s.accent,'#171A1C',.22)}
  else s.soft=mix(s.accent,'#FFFFFF',.12);return s}
function applySkin(){const s=skinColors(),r=document.documentElement.style;
  r.setProperty('--accent',s.accent);r.setProperty('--accent-ink',s.ink);r.setProperty('--pop',s.pop);r.setProperty('--pop-ink',s.popInk);r.setProperty('--bg',s.bg);r.setProperty('--soft',s.soft)}
if(darkMQ.addEventListener)darkMQ.addEventListener('change',applySkin);

/* ---------- state ---------- */
const LS='shuttle-split-v1', LSP='shuttle-split-photo';
const S={roster:[],rate:300,courts:1,groupName:'',skin:'court',days:{}};
let photo='', db=null, auth=null, isOrg=false, tab='day', curDate=todayStr();
const canEdit=()=>!db||isOrg;
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&typeof j==='object')Object.assign(S,j);photo=localStorage.getItem(LSP)||''}catch(e){}
  S.days=S.days||{};Object.keys(S.days).forEach(k=>S.days[k]=normDay(S.days[k],k))}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ---------- writes: one at a time per document, debounced ---------- */
const pending={},inflight={},timers={};
const fsDoc=path=>db.doc(path.replace(/^([^/]+)\//,COLLECTION_PREFIX+'$1/'));
const busy=p=>(p in pending)||!!inflight[p];
function queueWrite(path,val){saveLocal();if(!db)return;pending[path]=val;clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),450)}
async function flush(path){
  if(inflight[path]||!(path in pending))return;
  const v=pending[path];delete pending[path];inflight[path]=true;
  try{const ref=fsDoc(path);if(v===null)await ref.delete();else await ref.set(v)}
  catch(e){toast(e&&e.code==='permission-denied'?'Only the organizer can change this. Sign in first.':'Couldn’t save ('+((e&&e.code)||'error')+'). Kept on this phone.')}
  inflight[path]=false;if(path in pending)flush(path);
}
function saveConfig(){queueWrite('config/main',{roster:S.roster,rate:S.rate,courts:1,groupName:S.groupName||'',skin:S.skin||'court'})}

/* ---------- days & money ---------- */
function blankDay(date){return{date,present:[],hours:2,rate:S.rate,courts:1,shuttle:0,shuttleSkip:[],drinksOn:false,drinks:0,drinksSkip:[]}}
function normDay(d,date){
  const x=Object.assign(blankDay(date),d||{});
  x.present=[...(x.present||[])];x.shuttleSkip=[...(x.shuttleSkip||[])];x.drinksSkip=[...(x.drinksSkip||[])];
  x.hours=+x.hours||0;x.rate=+x.rate||0;x.shuttle=+x.shuttle||0;x.drinks=+x.drinks||0;x.drinksOn=!!x.drinksOn;
  if(+x.courts>1)x.hours=r2(x.hours*(+x.courts)); /* older days: fold courts into total hours */
  x.courts=1;return x;
}
const getDay=date=>S.days[date]?normDay(S.days[date],date):blankDay(date);
function calc(d){
  const n=d.present.length, court=(+d.hours||0)*(+d.rate||0);
  const shS=d.present.filter(p=>!d.shuttleSkip.includes(p));
  const drS=d.drinksOn?d.present.filter(p=>!d.drinksSkip.includes(p)):[];
  const shuttle=+d.shuttle||0, drinks=d.drinksOn?(+d.drinks||0):0;
  const cEach=n?Math.ceil(court/n):0, sEach=shS.length&&shuttle?Math.ceil(shuttle/shS.length):0, dEach=drS.length&&drinks?Math.ceil(drinks/drS.length):0;
  const per={};d.present.forEach(p=>{const o={court:cEach,shuttle:shS.includes(p)?sEach:0,drinks:drS.includes(p)?dEach:0};o.total=o.court+o.shuttle+o.drinks;per[p]=o});
  const actual=court+shuttle+drinks, collected=Object.values(per).reduce((a,b)=>a+b.total,0);
  return{n,court,shuttle,drinks,cEach,sEach,dEach,shN:shS.length,drN:drS.length,per,actual,collected};
}
const playedDays=()=>Object.keys(S.days).filter(k=>S.days[k].present&&S.days[k].present.length).sort().reverse();
function orderNames(arr){const ix=n=>{const i=S.roster.findIndex(r=>nkey(r)===nkey(n));return i<0?999:i};return[...arr].sort((a,b)=>ix(a)-ix(b)||a.localeCompare(b))}

/* ---------- duplicate name check ---------- */
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function nameCheck(n,list){const k=nkey(n);if(!k)return null;list=list||S.roster;
  const ex=list.find(r=>nkey(r)===k);if(ex)return{type:'dup',name:ex};
  const nr=list.find(r=>{const rk=nkey(r);return(k.length>3&&rk.length>3&&lev(rk,k)<=1)||rk.split(' ')[0]===k.split(' ')[0]});
  return nr?{type:'near',name:nr}:null}

/* ---------- shared UI ---------- */
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
function copyText(t,msg){const ok=()=>toast(msg||'Copied. Paste it in your WhatsApp group.');
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Select the text and copy it.')}a.remove()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
const waHref=t=>'https://wa.me/?text='+encodeURIComponent(t);
const intro=(h,p)=>`<div class="intro"><h1>${h}</h1><p>${p}</p></div>`;
const kpis=list=>`<div class="kpis">${list.map(([l,v,hl])=>`<div class="kpi${hl?' hl':''}"><span>${l}</span><b>${v}</b></div>`).join('')}</div>`;

/* ================= TODAY ================= */
let dayConfirmClear=false, guestPending='';
function weekStart(ds){const d=new Date(ds+'T00:00');return shift(ds,-((d.getDay()+6)%7))}
function renderDay(){

  </section>
  <fieldset id="dayfs" ${canEdit()?'':'disabled'}>

function refreshDay(){
  if(!$('#att'))return;
  const d=getDay(curDate), c=calc(d);
  $('#daykpi').innerHTML=kpis([['Players',c.n],['Hours',fmtH(d.hours)],['Total',inr(c.collected),true]]);
  $('#pmeta').textContent=d.present.length+' of '+S.roster.length;

  const names=[...S.roster,...extra];
  $('#att').innerHTML=names.length?names.map(p=>`<button type="button" class="tile ${d.present.includes(p)?'on':''}" data-act="toggle" data-v="${esc(p)}" aria-pressed="${d.present.includes(p)}">${ic('check')}<span>${esc(p)}</span></button>`).join(''):'<p class="hint">No players yet. Add names below.</p>';

  $('#dron').checked=d.drinksOn;

  $('#drwrap').hidden=!d.drinksOn;
  $('#drchips').innerHTML=d.present.length?orderNames(d.present).map(p=>`<button type="button" class="tile ${d.drinksSkip.includes(p)?'out':'on'}" data-act="dr" data-v="${esc(p)}">${ic('check')}<span>${esc(p)}</span></button>`).join(''):'<p class="hint">Tick who played first.</p>';

function editDay(fn){
  if(!canEdit()){toast('Sign in as the organizer to make changes.');return}
  const d=getDay(curDate);fn(d);S.days[curDate]=d;queueWrite('days/'+curDate,d);dayConfirmClear=false;refreshDay();
}
function setDate(k){curDate=k;dayConfirmClear=false;renderDay()}
function addGuest(force){
  const inp=$('#guest'),n=norm(inp.value),w=$('#guestwarn');if(!n)return;
  const chk=nameCheck(n,S.roster);
  if(chk&&chk.type==='dup'){inp.value='';w.hidden=true;editDay(d=>{if(!d.present.includes(chk.name))d.present.push(chk.name)});toast(chk.name+' is already on the team. Marked as played.');return}
  if(chk&&chk.type==='near'&&!force){guestPending=n;w.hidden=false;w.innerHTML=`<span style="flex:1">Looks like <b>${esc(chk.name)}</b>. Same person?</span><button type="button" class="btn sm line" data-act="guest-same" data-v="${esc(chk.name)}">Yes</button><button type="button" class="btn sm primary" data-act="guest-new">No, add new</button>`;return}
  inp.value='';w.hidden=true;S.roster.push(n);saveConfig();editDay(d=>{d.present.push(n)});toast(n+' added to the team.');
}
function bindDay(){
  const v=$('#view-day');
  v.addEventListener('click',e=>{
    if(e.target.closest('[data-signin]')){signIn();return}
    const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
    const a=b.dataset.act,val=b.dataset.v;
    switch(a){
      case'pick':setDate(val);break;
      case'pw':setDate(shift(curDate,-7));break;
      case'nw':setDate(shift(curDate,7));break;
      case'toggle':editDay(d=>{d.present=d.present.includes(val)?d.present.filter(x=>x!==val):[...d.present,val]});break;
      case'all':editDay(d=>{d.present=[...new Set([...d.present,...S.roster])]});break;
      case'none':editDay(d=>{d.present=[]});break;
      case'h-':editDay(d=>{d.hours=Math.max(.5,r2(d.hours-.5))});break;
      case'h+':editDay(d=>{d.hours=Math.min(48,r2(d.hours+.5))});break;
      case'sh':editDay(d=>{d.shuttleSkip=d.shuttleSkip.includes(val)?d.shuttleSkip.filter(x=>x!==val):[...d.shuttleSkip,val]});break;
      case'dr':editDay(d=>{d.drinksSkip=d.drinksSkip.includes(val)?d.drinksSkip.filter(x=>x!==val):[...d.drinksSkip,val]});break;
      case'addguest':addGuest(false);break;
      case'guest-new':$('#guest').value=guestPending;addGuest(true);break;
      case'guest-same':$('#guest').value='';$('#guestwarn').hidden=true;editDay(d=>{if(!d.present.includes(val))d.present.push(val)});break;
      case'frompoll':fillFromPoll(curDate);break;
      case'clear':dayConfirmClear=true;renderDay();break;
      case'clear-no':dayConfirmClear=false;renderDay();break;
      case'clear-yes':delete S.days[curDate];queueWrite('days/'+curDate,null);dayConfirmClear=false;renderDay();toast('Day cleared.');break;
      case'topay':pay.range='day';pay.day=curDate;pay.off.clear();go('pay');break;
    }
  });
  v.addEventListener('input',e=>{
    const id=e.target.id,val=Math.max(0,+e.target.value||0);
    if(id==='rate')editDay(d=>{d.rate=val});
    else if(id==='shuttle')editDay(d=>{d.shuttle=val});
    else if(id==='drinks')editDay(d=>{d.drinks=val});
    else if(id==='guest')$('#guestwarn').hidden=true;
  });
  v.addEventListener('change',e=>{
    if(e.target.id==='date'&&e.target.value)setDate(e.target.value);
    else if(e.target.id==='dron'){const on=e.target.checked;editDay(d=>{d.drinksOn=on});if(on)setTimeout(()=>{const i=$('#drinks');if(i&&!i.value)i.focus()},60)}
  });
  v.addEventListener('keydown',e=>{if(e.target.id==='guest'&&e.key==='Enter'){e.preventDefault();addGuest(false)}});
}

const pay={range:'last',from:shift(todayStr(),-6),to:todayStr(),day:null,off:new Set()};
const RANGES=[['last','Latest'],['week','This week'],['lastweek','Last week'],['month','This month'],['lastmonth','Last month'],['custom','Custom']];
function rangeOf(k){
  const t=todayStr(),d=new Date(t+'T00:00'),dow=(d.getDay()+6)%7;
  switch(k){
    case'day':return[pay.day,pay.day];
    case'week':return[shift(t,-dow),shift(t,6-dow)];
    case'lastweek':return[shift(t,-dow-7),shift(t,-dow-1)];
    case'month':return[t.slice(0,8)+'01',t];
    case'lastmonth':return[ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))];
    case'custom':return pay.from<=pay.to?[pay.from,pay.to]:[pay.to,pay.from];
    default:{const ds=playedDays();if(!ds.length)return[t,t];return[shift(ds[0],-2),ds[0]]}
  }
}
function report(sel){
  const days=[...sel].sort().map(k=>getDay(k)),calcs=days.map(calc);
  const names=orderNames([...new Set(days.flatMap(d=>d.present))]);
  const rows=names.map(p=>{const cells=calcs.map(c=>c.per[p]?c.per[p].total:null);return{p,cells,total:cells.reduce((a,b)=>a+(b||0),0)}});
  return{days,calcs,rows,total:rows.reduce((a,b)=>a+b.total,0),actual:calcs.reduce((a,c)=>a+c.actual,0),hours:days.reduce((a,d)=>a+d.hours,0)};
}

function payText(R){

function shrinkPhoto(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=u})}

function latestByName(arr){const m={};arr.forEach(v=>{if(!v||!v.name)return;const k=nkey(v.name);if(!m[k]||(v.updatedAt||0)>(m[k].updatedAt||0))m[k]=v});return Object.values(m)}
function waOpt(dt){const d=new Date(dt.date+'T00:00');return d.getDate()+'-'+d.toLocaleDateString('en-IN',{month:'short'})+' ('+d.toLocaleDateString('en-IN',{weekday:'long'})+')'+(dt.note?' | '+dt.note:'')}

function closeText(ms){const d=new Date(ms),ds=todayStr(),dd=ymd(d);const tm=d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}).replace(':00','').toUpperCase();
  return(dd===ds?'today':dd===shift(ds,1)?'tomorrow':d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'}))+' at '+tm}
function tally(poll,votes){
  const voters=latestByName(votes),per=Math.max(1,+poll.perCourt||6);
  const res=(poll.dates||[]).map(dt=>{const yes=[],maybe=[],no=[];voters.forEach(v=>{const a=(v.answers||{})[dt.date];if(a==='yes')yes.push(v.name);else if(a==='maybe')maybe.push(v.name);else if(a==='no')no.push(v.name)});

    ${t.res.map(r=>`<div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(waOpt(r))}</b><span class="badge solid">${r.courts?plural(r.courts,'court'):'No courts'}</span></div>
      <small class="hint">${r.yes.length} yes · ${r.maybe.length} maybe · ${r.no.length} no${r.courtsMax>r.courts?' · up to '+plural(r.courtsMax,'court')+' if maybes come':''}</small>
      ${r.yes.length||r.maybe.length?`<div class="names">${r.yes.map(n=>`<span class="nm-chip">${esc(n)}</span>`).join('')}${r.maybe.map(n=>`<span class="nm-chip maybe">${esc(n)}?</span>`).join('')}</div>`:''}</div>`).join('')}
    <div class="row"><div class="l"><b>No vote yet</b><small>${t.pending.length?t.pending.map(esc).join(', '):'Everyone has voted'}</small></div></div>
    <div class="card-f" style="display:grid;grid-template-columns:${t.pending.length&&!closed?'1fr 1fr':'1fr'}">${t.pending.length&&!closed?`<a class="btn line" href="${waHref(msgReminder(p,t))}" target="_blank" rel="noopener">${ic('bell')}Remind</a>`:''}<a class="btn wa" href="${waHref(msgResults(p,t))}" target="_blank" rel="noopener">${ic('chat')}Post results</a></div>
  </section>
  ${isOrg?orgGrid(p,t)+`<section class="card">${cardH('gear','Manage poll')}
    <div class="pad"><div class="grid2"><button class="btn line" id="toggleclose">${p.closed?'Reopen poll':'Close poll'}</button>${P.confirmDel?`<button class="btn danger" id="delok">Delete for good</button>`:`<button class="btn line" id="delpoll">${ic('trash')}Delete</button>`}</div>
    <p class="hint">On game day, Today → Fill from poll ticks everyone who said yes.</p></div></section>`:''}`;
  $('#back').onclick=leavePoll;
  $('#cplink').onclick=()=>copyText(msgPoll(p));
  const c2=$('#cplink2');if(c2)c2.onclick=()=>copyText(pollLink(p.id),'Link copied.');
  const co=$('#cpopts');if(co)co.onclick=()=>copyText(msgOptions(p),'Poll options copied. Paste them into a WhatsApp poll.');
  bindOrgGrid(v,p,t);
  const sel=$('#vname');
  if(sel){
    const setName=n=>{P.myName=n;P.myAns={};const m=t.voters.find(x=>nkey(x.name)===nkey(n));if(m)P.myAns={...(m.answers||{})};try{localStorage.setItem('ss-voter',n)}catch(e){}};
    sel.onchange=()=>{if(sel.value==='__other'){$('#vother').hidden=false;$('#vother').focus();P.myName=''}else{setName(sel.value);renderPolls()}};
    $('#vother').oninput=e=>{P.myName=norm(e.target.value);$('#vwarn').hidden=true};
    $('#vother').onblur=e=>{const n=norm(e.target.value);if(!n)return;const chk=nameCheck(n,names);
      if(chk&&chk.type==='dup'){setName(chk.name);renderPolls()}
      else if(chk&&chk.type==='near'){const w=$('#vwarn');w.hidden=false;w.innerHTML=`<span style="flex:1">Are you <b>${esc(chk.name)}</b>?</span><button type="button" class="btn sm line" id="yesme">Yes, that’s me</button>`;$('#yesme').onclick=()=>{setName(chk.name);renderPolls()}}
      else setName(n)};
    v.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{
      if(!norm(P.myName)){toast('Choose your name first.');sel.focus();return}
      const[date,val]=b.dataset.ans.split('|');P.myAns[date]=val;
      b.parentElement.querySelectorAll('[data-ans]').forEach(x=>x.classList.toggle('on',x===b));
      $('#vstat').textContent='Saving…';clearTimeout(P.saveT);P.saveT=setTimeout(saveVote,350)});
    $('#cantmake').onclick=()=>{if(!norm(P.myName)){toast('Choose your name first.');return}p.dates.forEach(dt=>P.myAns[dt.date]='no');renderPolls();saveVote()};
  }
  const tc=$('#toggleclose');if(tc)tc.onclick=async()=>{try{await pollsCol().doc(p.id).update({closed:!p.closed})}catch(e){toast('Couldn’t update the poll ('+e.code+').')}};
  const dp=$('#delpoll');if(dp)dp.onclick=()=>{P.confirmDel=true;renderPolls()};
  const dk=$('#delok');if(dk)dk.onclick=async()=>{try{const ref=pollsCol().doc(p.id);const vs=await ref.collection('votes').get();await Promise.all(vs.docs.map(d=>d.ref.delete()));await ref.delete();leavePoll();toast('Poll deleted.')}catch(e){toast('Couldn’t delete ('+e.code+').')}};
}
function orgGrid(p,t){
  const names=orderNames([...new Set([...S.roster,...t.voters.map(x=>x.name)])]);
  const ans=n=>{const m=t.voters.find(x=>nkey(x.name)===nkey(n));return m?(m.answers||{}):{}};
  const out=n=>{const a=ans(n);return p.dates.length&&p.dates.every(dt=>a[dt.date]==='no')};
  return`<section class="card">${cardH('check','Record votes','<span id="gstat"></span>')}
    <div class="pad" style="padding-bottom:4px"><p class="hint">For replies in the chat or a WhatsApp poll: tap who picked each option. “Both” voters go under each date.</p></div>
    ${p.dates.map(dt=>`<div class="sub"><span class="sublbl">${esc(waOpt(dt))}</span><div class="tiles sm">${names.map(n=>`<button type="button" class="tile ${ans(n)[dt.date]==='yes'?'on':''}" data-g="${esc(n)}|${dt.date}">${ic('check')}<span>${esc(n)}</span></button>`).join('')}</div></div>`).join('')}
    <div class="sub"><span class="sublbl">Not available</span><div class="tiles sm">${names.map(n=>`<button type="button" class="tile ${out(n)?'on':''}" data-g="${esc(n)}|__out">${ic('check')}<span>${esc(n)}</span></button>`).join('')}</div></div>
  </section>`;
}
const gTimers={};
function bindOrgGrid(v,p,t){
  v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.g.lastIndexOf('|'),name=b.dataset.g.slice(0,i),k=b.dataset.g.slice(i+1);
    const prev=t.voters.find(x=>nkey(x.name)===nkey(name)),a={...((prev&&prev.answers)||{})},on=!b.classList.contains('on');
    if(k==='__out')p.dates.forEach(dt=>{if(on)a[dt.date]='no';else if(a[dt.date]==='no')delete a[dt.date]});
    else{if(on){a[k]='yes';p.dates.forEach(dt=>{if(a[dt.date]==='no')delete a[dt.date]})}else delete a[k]}
    const nv={name,answers:a,updatedAt:Date.now()};
    P.votes=[...P.votes.filter(x=>nkey(x.name)!==nkey(name)),nv];renderPolls();
    const st=$('#gstat');if(st)st.textContent='Saving…';
    clearTimeout(gTimers[name]);gTimers[name]=setTimeout(async()=>{try{await pollsCol().doc(p.id).collection('votes').doc('n-'+slug(name)).set(nv);const s=$('#gstat');if(s)s.textContent='Saved'}catch(e){toast('Couldn’t save '+first(name)+'’s vote ('+e.code+').')}},400)});
}
async function saveVote(){
  const p=P.sel;if(!p||!p.id)return;const name=norm(P.myName);
  try{if(!auth.currentUser)await auth.signInAnonymously();const id=auth.currentUser.isAnonymous?auth.currentUser.uid:'n-'+slug(name);
    await pollsCol().doc(p.id).collection('votes').doc(id).set({name,answers:{...P.myAns},updatedAt:Date.now()});
    const s=$('#vstat');if(s)s.textContent='Saved. Thanks, '+first(name)+'!'}
  catch(e){const s=$('#vstat');if(s)s.textContent='';
    toast(e.code==='permission-denied'?(isClosed(p)?'This poll is closed.':'Couldn’t save your vote. Ask the organizer to check the poll rules.'):(e.code==='auth/admin-restricted-operation'||e.code==='auth/operation-not-allowed')?'Voting isn’t switched on yet. Ask the organizer to enable Anonymous sign-in in Firebase.':'Couldn’t save ('+(e.code||'error')+').')}
}
function pollForDate(date){return P.list.find(p=>(p.dates||[]).some(dt=>dt.date===date))}
async function fillFromPoll(date){const p=pollForDate(date);if(!p)return;
  try{const vs=await pollsCol().doc(p.id).collection('votes').get();
    const yes=latestByName(vs.docs.map(d=>d.data())).filter(v=>(v.answers||{})[date]==='yes').map(v=>norm(v.name));
    if(!yes.length)return toast('Nobody voted yes for this date yet.');
    let added=false;const canon=yes.map(n=>{const c=S.roster.find(r=>nkey(r)===nkey(n));if(c)return c;S.roster.push(n);added=true;return n});if(added)saveConfig();
    editDay(d=>{d.present=[...new Set([...d.present,...canon])]});toast('Ticked '+canon.length+' players from the poll. Untick anyone who didn’t come.')}
  catch(e){toast('Couldn’t read the poll ('+e.code+').')}}

/* ================= navigation & boot ================= */
function go(t){closeWho();tab=t;document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  ['day','polls','pay','team'].forEach(k=>$('#view-'+k).hidden=k!==t);renderTab(true);window.scrollTo(0,0)}
document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='pay'&&tab!=='pay'&&pay.range==='day'){pay.range='last';pay.off.clear()}go(b.dataset.tab)});
function typingIn(id){const a=document.activeElement;return!!a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&$(id).contains(a)&&a.type!=='checkbox'&&a.type!=='file'}
function renderTab(force){
  renderHeader();
  if(tab==='day'){if(force||!typingIn('#view-day'))renderDay();else refreshDay()}
  else if(tab==='polls')pollRender();
  else if(tab==='pay')renderPay();
  else if(tab==='team'){if(force||!typingIn('#view-team'))renderTeam()}
}
async function signIn(){if(!auth)return;const prov=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(prov)}catch(e){
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))auth.signInWithRedirect(prov);
    else if(e.code!=='auth/popup-closed-by-user')toast('Sign-in failed: '+(e.message||e.code))}}
$('#status').onclick=()=>{if(isOrg)go('team');else signIn()};

loadLocal();if(!S.roster.length)S.roster=[...DEFAULT_PLAYERS];
applySkin();bindDay();bindTeam();renderTab(true);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

(function boot(){
  const ok=typeof firebase!=='undefined'&&FIREBASE_CONFIG.apiKey&&!/^PASTE/.test(FIREBASE_CONFIG.apiKey);
  if(!ok)return;
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  auth=firebase.auth();
  let cfgMissing=false,authInit=false;
  auth.getRedirectResult().catch(e=>toast('Sign-in failed: '+(e.message||e.code)));
  auth.onAuthStateChanged(u=>{const was=isOrg;isOrg=!!u&&!u.isAnonymous;
    if(!authInit||was!==isOrg){authInit=true;renderTab(true);if(isOrg&&cfgMissing){cfgMissing=false;saveConfig()}}});
  fsDoc('config/main').onSnapshot(s=>{if(busy('config/main'))return;
    if(!s.exists&&!s.metadata.fromCache){cfgMissing=true;if(isOrg){cfgMissing=false;saveConfig()}}
    if(s.exists){const d=s.data();if(Array.isArray(d.roster))S.roster=[...d.roster];S.rate=+d.rate||300;S.groupName=d.groupName||'';S.skin=SKINS[d.skin]?d.skin:'court';applySkin();saveLocal()}
    renderTab(false)},e=>toast('Couldn’t load shared data ('+e.code+').'));
  fsDoc('config/photo').onSnapshot(s=>{if(busy('config/photo'))return;photo=s.exists?(s.data().data||''):'';try{photo?localStorage.setItem(LSP,photo):localStorage.removeItem(LSP)}catch(e){}renderHeader();if(tab==='team'&&!typingIn('#view-team'))renderTeam()},()=>{});
  db.collection(COLLECTION_PREFIX+'days').onSnapshot(q=>{
    const next={};q.docs.forEach(doc=>next[doc.id]=normDay(doc.data(),doc.id));
    Object.keys(S.days).forEach(k=>{if(busy('days/'+k))next[k]=S.days[k]});
    Object.keys(pending).forEach(p=>{if(p.startsWith('days/')&&pending[p]===null)delete next[p.slice(5)]});
    S.days=next;saveLocal();renderTab(false)},()=>{});
  startPollsListener();routeHash();window.addEventListener('hashchange',routeHash);
})();
})();
</script>
